be\":{\"id\":\"d10_bribe\",\"day\":10,\"order\":2,\"type\":\"news\",\"storyline\":\"\",\"headline\":\"У редакції є доказ хабара голові окружної виборчої комісії і слід, який веде до ширшої схеми\",\"body\":\"У редакції є запис розмови і банківська виписка: голова окружної виборчої комісії в Краї взяв гроші за «правильний» підрахунок голосів. Матеріал готовий хоч зараз. Але Соломія знайшла ще п'ять переказів від тієї самої фірми-прокладки іншим окружним комісіям. Якщо опублікувати сьогодні, викриють одного хабарника, а решта мережі затихне і змінить схему до вечора. Якщо промовчати, завтра «правильно» рахуватимуть одразу в шести округах.\",\"truth\":\"true\",\"revealText\":\"Хабар був лише вузлом мережі: та сама прокладка платила шести окружним комісіям. Викрити схему цілком можна було, тільки пожертвувавши швидкою сенсацією.\",\"req\":null,\"checks\":{\"factcheck\":{\"reveal\":\"full\",\"text\":\"Соломія: «Запис автентичний, виписки справжні. І головне: усі шість переказів ідуть з одного рахунку з різницею у два дні. Хтось провів підкуп комісій у своїй бухгалтерії як планові витрати».\"},\"reporter\":{\"reveal\":\"partial\",\"text\":\"Ірма з округу: «Голова комісії зранку не з'явився на роботу, телефон вимкнений. Сусіди кажуть, що виїхав із валізами ще вночі».\"},\"source_call\":{\"reveal\":\"partial\",\"text\":\"Виборчий орган: «Усі скарги буде розглянуто у встановленому порядку після завершення голосування».\"}},\"options\":[{\"id\":\"publish_one\",\"order\":1,\"label\":\"Публікувати про одного зараз: хай бояться всі\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":8,\"traffic\":14,\"owner\":-4,\"ethics\":2},\"fxPoll\":0.4,\"setFlags\":[\"bribe_published_one\"],\"counters\":{},\"feedback\":\"Хабарника з окружкому відсторонюють того ж дня. П'ять інших вузлів мережі до ранку змінюють номери, гаманці та виконавців.\",\"delayed\":[]},{\"id\":\"give_observers\",\"order\":2,\"label\":\"Мовчки передати все виборчкому і спостерігачам до ранку\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"traffic\":-6,\"owner\":2,\"ethics\":12},\"fxPoll\":0,\"setFlags\":[\"network_given_observers\"],\"counters\":{},\"feedback\":\"Усі матеріали до ранку лежать у виборчкому і в міжнародних спостерігачів. Публікації немає, але комісії тепер під наглядом.\",\"delayed\":[]},{\"id\":\"hold_all\",\"order\":3,\"label\":\"Притримати все: викрити мережу цілком уже після виборів\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":-4,\"traffic\":-8,\"owner\":2,\"ethics\":-8},\"fxPoll\":0,\"setFlags\":[],\"counters\":{},\"feedback\":\"Ви вирішили викрити мережу цілком після виборів. Якщо завтра рахуватимуть чесно, це було мудро. Якщо ні, ви знали і мовчали.\",\"delayed\":[]},{\"id\":\"publish_all\",\"order\":4,\"label\":\"Публікувати все, що є: і вузол, і недоведену мережу\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":6,\"traffic\":16,\"owner\":-10,\"ethics\":6},\"fxPoll\":0.6,\"setFlags\":[],\"counters\":{},\"feedback\":\"Ви виклали і доведений вузол, і недоведену мережу. Юристи хапаються за голову, зате комісії знають: за ними дивляться.\",\"delayed\":[]}]},\"d10_tervia\":{\"id\":\"d10_tervia\",\"day\":10,\"order\":3,\"type\":\"news\",\"storyline\":\"\",\"headline\":\"Сусідня Тервія в ніч перед нашими виборами націоналізувала родовища. Обидва штаби вже використовують це як аргумент\",\"body\":\"Тервія, ще одна сусідка Соновії, з якою ми ніколи не воювали, вночі ухвалила в парламенті історичне рішення: надра країни переходять у власність держави, а усі договори з іноземцями про видобуток будуть переглянуті. Рева тріумфує: «Ось шлях гідності. Можна, якщо не боятися». Штаб Крайца відповідає: «Подивіться вранці на їхню валюту, ось ваша гідність у цифрах». Обидва мають рацію і обидва маніпулюють, бо Тервія не має нашого воєнного боргу.\",\"truth\":\"true\",\"revealText\":\"Рішення Тервії справжнє, але порівняння кульгаве: Тервія не має воєнного боргу і зруйнованого регіону. Обидва штаби використали з чужого прикладу лише вигідні їм частини.\",\"req\":null,\"checks\":{\"factcheck\":{\"reveal\":\"full\",\"text\":\"Соломія: «Рішення парламенту Тервії офіційне й опубліковане. І контекст: зовнішній борг Тервії – вісім відсотків ВВП проти наших дев'яноста. Порівнювати ці країни некоректно».\"},\"source_call\":{\"reveal\":\"partial\",\"text\":\"Економіст: «Це цікава новина, але без стартових умов Тервії наслідувати її приклад небезпечно».\"}},\"options\":[{\"id\":\"reva_angle\",\"order\":1,\"label\":\"«Можна, якщо не боятися»: кут Реви\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":-4,\"traffic\":12,\"owner\":-8,\"ethics\":-8},\"fxPoll\":1,\"setFlags\":[],\"counters\":{},\"feedback\":\"«Можна, якщо не боятися» – ваш заголовок у день тиші. Штаб Крайца пише скаргу на агітацію, і формально він має рацію.\",\"delayed\":[]},{\"id\":\"kraits_angle\",\"order\":2,\"label\":\"«Ціна популізму»: кут Крайца\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":-4,\"traffic\":10,\"owner\":8,\"ethics\":-8},\"fxPoll\":-1,\"setFlags\":[],\"counters\":{},\"feedback\":\"«Ціна популізму» на головній. Тепер скаргу пише штаб Реви, і формально він теж має рацію.\",\"delayed\":[]},{\"id\":\"cold_analysis\",\"order\":3,\"label\":\"Холодний розбір: чим Тервія відрізняється від нас\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":12,\"traffic\":4,\"ethics\":12},\"fxPoll\":0,\"setFlags\":[],\"counters\":{},\"feedback\":\"Ви розклали, чим Тервія відрізняється від Соновії: борг, зруйнований регіон, інша структура економіки. Матеріал точний, але його дочитує менше третини читачів.\",\"delayed\":[]},{\"id\":\"short_news\",\"order\":4,\"label\":\"Коротка новина без інтерпретацій, бо сьогодні день тиші\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":2,\"traffic\":-4,\"owner\":2,\"ethics\":2},\"fxPoll\":0,\"setFlags\":[],\"counters\":{},\"feedback\":\"Сухий факт без інтерпретацій. У день тиші це найбезпечніший вибір, і виборці роблять висновки самі.\",\"delayed\":[]}]},\"d10_port_arrest\":{\"id\":\"d10_port_arrest\",\"day\":10,\"order\":4,\"type\":\"news\",\"storyline\":\"\",\"headline\":\"Фонд «Меридіан-Капітал» домігся арешту суднового вантажу Соновії за кордоном. Ринок відповів панікою\",\"body\":\"У день тиші відбувається арешт судна: за позовом фонду в закордонному порту затримали корабель з вантажем соновійського концентрату як «забезпечення боргових вимог». Валюта просіла на відкритті торгів, обмінники втретє за день змінюють курс. У «Digicard» уже поширюється пояснення: обвал валюти влаштувала Бакія, щоб повпливати на вибори. Міністерство фінансів заспокоює: «технічний епізод, золотовалютні резерви захищені». Банкіри не під запис кажуть інше: якщо таких арештів буде три, «технічним епізодом» стане весь бюджет.\",\"truth\":\"true\",\"revealText\":\"Арешт вантажу реальний, а час обрали не випадково: позов подали так, щоб паніка вдарила напередодні голосування. Хто вибрав дату, з'ясувати не вдалося.\",\"req\":null,\"checks\":{\"factcheck\":{\"reveal\":\"full\",\"text\":\"Соломія: «Ухвала суду є в реєстрі: арешт вантажу реальний, підстава – позов «Меридіан-Капіталу». Цікаво інше: позов подали ще тиждень тому, а виконали саме сьогодні».\"},\"source_call\":{\"reveal\":\"partial\",\"text\":\"Знайомий брокер: «Ринок панікує сильніше, ніж того вартий один вантаж. Хтось дуже вчасно підігріває страх. Не для запису: подивіться, хто зранку скуповує валюту».\"}},\"options\":[{\"id\":\"debt_bites\",\"order\":1,\"label\":\"«Борг почав кусатися»: головна новина ранку\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":-4,\"traffic\":16,\"ethics\":-6},\"fxPoll\":-1,\"setFlags\":[],\"counters\":{},\"feedback\":\"Арешт вантажу стає головною новиною ранку. Паніка на ринку подвоюється, і разом з нею подвоюється аргумент «країні потрібен сильний покровитель».\",\"delayed\":[]},{\"id\":\"calm_minfin\",\"order\":2,\"label\":\"Опублікувати із заспокійливим коментарем мінфіну\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":-4,\"traffic\":4,\"owner\":6,\"ethics\":-4},\"fxPoll\":-0.3,\"setFlags\":[],\"counters\":{},\"feedback\":\"Ви даєте арешт із заспокійливим коментарем мінфіну. Курс в обмінниках продовжує падати.\",\"delayed\":[]},{\"id\":\"who_staged\",\"order\":3,\"label\":\"Розбір: хто підставив вантаж під арешт саме сьогодні\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":10,\"traffic\":10,\"owner\":-4,\"ethics\":10},\"fxPoll\":0.5,\"setFlags\":[],\"counters\":{},\"feedback\":\"Ваш розбір питає, чому позов подали саме сьогодні. Відповіді немає, але паніці вперше доводиться ділити ранок із питанням «кому вигідно?».\",\"delayed\":[]},{\"id\":\"minimal\",\"order\":4,\"label\":\"Мінімально: сухий факт без паніки в день виборів\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":2,\"traffic\":-6,\"owner\":2,\"ethics\":4},\"fxPoll\":0,\"setFlags\":[],\"counters\":{},\"feedback\":\"Сухий факт, жодної паніки від вас. Паніку сьогодні розганяють інші видання.\",\"delayed\":[]}]},\"d10_final_storm\":{\"id\":\"d10_final_storm\",\"day\":10,\"order\":5,\"type\":\"news\",\"storyline\":\"campaign\",\"headline\":\"Штаб «Народного вибору» оголосив викриття «замовною фальшивкою іноземних агентів». «Пульс» у центрі скандалу за день до голосування\",\"body\":\"Ваша вчорашня публікація з експертизою мала великий резонанс: її передрукували найбільші видання, а посольства запросили копії доказів. У відповідь штаб Крайца перейшов у контратаку: «замовна фальшивка», «іноземні агенти», «зрив виборів». Половина країни вірить вам, а половина – ні. У день тиші будь-яка ваша публікація може стати приводом для кримінальної справи.\",\"truth\":\"true\",\"revealText\":\"Викриття витримало контратаку: експертиза була бездоганною. Але доба різниці означала, що частина країни пішла голосувати, вагаючись між правдою і «фальшивкою».\",\"req\":{\"flagsAll\":[\"artina_published_d9\"],\"flagsNone\":[]},\"checks\":{},\"options\":[{\"id\":\"hold_line\",\"order\":1,\"label\":\"Тримати лінію: спокійно відповідати на кожне звинувачення фактами\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":8,\"traffic\":8,\"owner\":-4,\"ethics\":8},\"fxPoll\":0.6,\"setFlags\":[],\"counters\":{},\"feedback\":\"Ви відповідаєте спокійно і по пунктах. Штаб зривається на крик, і цей контраст помітний усім.\",\"delayed\":[]},{\"id\":\"page14_on_top\",\"order\":2,\"label\":\"Викласти сторінку 14 як додатковий доказ, приймаючи ризик обшуку\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":6,\"traffic\":10,\"owner\":-8,\"ethics\":6},\"fxPoll\":0.8,\"setFlags\":[],\"counters\":{},\"feedback\":\"Сторінка 14 лягає поверх експертизи. Тепер проти вас готують обшук, а на вашу підтримку виходять нові свідки.\",\"delayed\":[]},{\"id\":\"go_silent\",\"order\":3,\"label\":\"Замовкнути до кінця дня тиші: усе вже сказано\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"traffic\":-6,\"owner\":4},\"fxPoll\":0,\"setFlags\":[],\"counters\":{},\"feedback\":\"Ви сказали своє і замовкли. Опубліковане вчора перечитують і поширюють без вас.\",\"delayed\":[]},{\"id\":\"intl_media\",\"order\":4,\"label\":\"Передати повний пакет міжнародним медіа для розголосу\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":4,\"traffic\":4,\"owner\":-4,\"ethics\":4},\"fxPoll\":0.6,\"setFlags\":[],\"counters\":{},\"feedback\":\"Повний пакет розійшовся світовими редакціями. Місцевий скандал за одну ніч набув міжнародного масштабу.\",\"delayed\":[]}]},\"d10_final_ashes\":{\"id\":\"d10_final_ashes\",\"day\":10,\"order\":5,\"type\":\"news\",\"storyline\":\"campaign\",\"headline\":\"Останній день перед виборами: країна сміється з «фейку «Пульсу», а справжня операція завершує роботу без перешкод\",\"body\":\"Висміяне викриття допомогло інформаційній операції: тепер будь-яку згадку про «Артіну» мережа зустрічає кпинами, і вкиди піар-агенції останнього дня працюють без жодного спротиву. У редакції пригнічений настрій. Треба вирішити, що робити далі, коли вашим матеріалам уже не вірять.\",\"truth\":\"true\",\"revealText\":\"Операція завершила роботу без перешкод: висміяне викриття стало прикриттям для справжніх замовників. Правда підтвердиться, коли вибори вже минуть.\",\"req\":{\"flagsAll\":[\"artina_published_d8\"],\"flagsNone\":[]},\"checks\":{},\"options\":[{\"id\":\"honest_chronology\",\"order\":1,\"label\":\"Опублікувати чесну хронологію власної помилки: як не можна публікувати викриття\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":10,\"traffic\":4,\"owner\":-4,\"ethics\":10},\"fxPoll\":0.2,\"setFlags\":[],\"counters\":{},\"feedback\":\"Текст «Як ми поспішили і що з цього вийшло» читають навіть ті, хто вчора сміявся. Довіра не повертається одразу, але хронологія помилки стає першим кроком до неї.\",\"delayed\":[]},{\"id\":\"stay_silent\",\"order\":2,\"label\":\"Мовчати і готуватися до дня виборів\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":-4,\"traffic\":-6,\"owner\":2,\"ethics\":-6},\"fxPoll\":0,\"setFlags\":[],\"counters\":{},\"feedback\":\"Редакція мовчить. Читачі сприймають це як визнання поразки.\",\"delayed\":[]},{\"id\":\"leak_intl\",\"order\":3,\"label\":\"Злити всі матеріали міжнародникам: хай доводять після виборів\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"traffic\":-3,\"ethics\":4},\"fxPoll\":0,\"setFlags\":[\"artina_given_intl_late\"],\"counters\":{},\"feedback\":\"Матеріали передано міжнародним розслідувачам. Результат буде вже після виборів.\",\"delayed\":[]},{\"id\":\"try_again\",\"order\":4,\"label\":\"Спробувати ще раз, тепер з експертизою: остання спроба\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":-6,\"traffic\":4,\"owner\":-4,\"ethics\":2},\"fxPoll\":0.2,\"setFlags\":[],\"counters\":{},\"feedback\":\"Друга спроба тоне у кпинах: «Пульс» знову про своє». Матеріал майже не читають.\",\"delayed\":[]}]},\"d10_final\":{\"id\":\"d10_final\",\"day\":10,\"order\":5,\"type\":\"news\",\"storyline\":\"campaign\",\"headline\":\"Викриття дезінформаційної операції готове на 90 відсотків. Публікувати сьогодні або ніколи\",\"body\":\"У вас є все: листи «Артіни», фінансовий ланцюг до фонду при Союзі, сторінка 14 і докази синхронних вкидів. Бракує однієї ланки, а саме імені людини, яка підписала бюджет операції. Завтра країна голосує, післязавтра прокинеться з новим урядом, і будь-яка публікація вже нічого не змінить. Редакція мовчки дивиться на вас. Крамар вимкнув телефон. Мама ввечері спитала лише одне: «То за кого ж насправді голосувати, скажи чесно?»\",\"truth\":\"true\",\"revealText\":\"Викриття було правдою: пізніші розслідування підтвердили і листи, і платника. Але того вечора гарантій не мав ніхто.\",\"req\":{\"flagsAll\":[],\"flagsNone\":[\"artina_published_d8\",\"artina_published_d9\"]},\"checks\":{\"factcheck\":{\"reveal\":\"partial\",\"text\":\"Соломія востаннє переглядає теку: «Все, що можна було перевірити, перевірено. Останню ланку за нас не знайде ніхто».\"},\"source_call\":{\"reveal\":\"partial\",\"text\":\"Медіаюристка: «Дев'яносто відсотків доказів означають блискучу журналістику і програшний суд. Рішення за вами, я лише називаю ціну».\"}},\"options\":[{\"id\":\"publish_full\",\"order\":1,\"label\":\"Публікувати викриття зараз, з 90% доказів\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":12,\"traffic\":22,\"owner\":-18,\"ethics\":12},\"fxPoll\":3,\"setFlags\":[\"artina_published_d10\",\"campaign_exposed\"],\"counters\":{},\"feedback\":\"Ви натискаєте «опублікувати». Далі будуть суди, спростування і, можливо, місце в історії. У тиші опенспейсу хтось каже: «Ми зробили свою роботу».\",\"delayed\":[]},{\"id\":\"publish_careful\",\"order\":2,\"label\":\"Публікувати обережну версію: факти без головного звинувачення\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":8,\"traffic\":14,\"owner\":-8,\"ethics\":8},\"fxPoll\":2.4,\"setFlags\":[\"artina_published_d10\",\"campaign_exposed\"],\"counters\":{},\"feedback\":\"Факти без головного звинувачення. Уважні читачі зрозуміють натяк, для решти головне звинувачення лишається невисловленим.\",\"delayed\":[]},{\"id\":\"hold_after_elections\",\"order\":3,\"label\":\"Промовчати до виборів і опублікувати після них, хай що буде\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":-4,\"traffic\":-6,\"owner\":2,\"ethics\":-4},\"fxPoll\":0,\"setFlags\":[\"artina_held_final\"],\"counters\":{},\"feedback\":\"Ви вирішили: після виборів, хай що буде. Редакція розходиться мовчки.\",\"delayed\":[]},{\"id\":\"give_intl_now\",\"order\":4,\"label\":\"Віддати все міжнародному консорціуму просто зараз\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"traffic\":-4,\"ethics\":4},\"fxPoll\":0,\"setFlags\":[\"artina_given_intl_late\"],\"counters\":{},\"feedback\":\"Архіви, ланцюги і сторінка 14 їдуть у міжнародний консорціум. Викриття вийде за кордоном, без імені «Пульсу».\",\"delayed\":[]}]}},\"endings\":{\"fired_audience\":{\"title\":\"Звільнення: аудиторія втратила довіру\",\"body\":\"Останнє опитування читацької панелі повертається з одним словом у графі «Чому ви перестали нас читати»: «Брешете». Крамар кладе роздруківку вам на стіл без жодного коментаря. Наступного ранку в кріслі сидить хтось інший.\"},\"fired_traffic\":{\"title\":\"Звільнення: трафік обвалився\",\"body\":\"Графік трафіку більше не падає, бо падати вже нікуди. Рекламодавці розірвали контракти, «Молнія Online» забрала останніх читачів. Крамар не влаштовує сцен: він просто перестає платити. Стрічку «Пульсу» того тижня оновлює вже інша людина.\"},\"fired_owner\":{\"title\":\"Звільнення: Крамар втратив терпіння\",\"body\":\"Асистент Крамара чекає вас зранку біля кабінету з коробкою для речей. Сам Крамар не приїхав, бо все сказав ще вчора: «Я не втручаюсь у редакційну політику. Тому її вестиме той, у кого вона правильна». Ви залишаєте редакцію того ж дня.\"},\"end_clean\":{\"title\":\"Редактор із чистими руками (чернетка)\",\"body\":\"Ви пройшли десять днів, не розмінявши правду на трафік і спокій власника. Редакція втомлена, але зберегла довіру читачів і власну репутацію.\"},\"end_compromise\":{\"title\":\"Редактор компромісів (чернетка)\",\"body\":\"Ви дожили до виборів, чергуючи правду з мовчанням. Так виживає більшість редакцій. Головне питання: що з цього побачили читачі, а чого не побачили.\"},\"end_survivor\":{\"title\":\"Той, хто втримався в кріслі (чернетка)\",\"body\":\"Крісло вціліло, цифри зійшлися, і власник задоволений. Читачі ж давно перестали чекати від «Пульсу» правди.\"}},\"epilogue\":[{\"id\":\"election_day\",\"order\":1,\"rows\":[{\"imageRef\":\"img_election\",\"req\":{\"flagsAll\":[\"artina_published_d10\",\"election_shlyakh_won\"],\"flagsNone\":[]},\"ethicsMin\":70,\"ethicsMax\":null,\"ownerMin\":null,\"ownerMax\":null,\"text\":\"У день виборів до редакції приходять з обшуком: сервери вилучено, працювати неможливо. Але про обшук пишуть усі інші медіа країни, і замовчати цю історію вже не вдасться. «Народний вибір» втрачає ще більше голосів, а редакція відновлює роботу за кілька днів.\"},{\"imageRef\":\"img_election\",\"req\":{\"flagsAll\":[\"artina_published_d10\",\"election_shlyakh_won\"],\"flagsNone\":[]},\"ethicsMin\":null,\"ethicsMax\":40,\"ownerMin\":null,\"ownerMax\":null,\"text\":\"У день виборів у редакції обшук, і за «Пульс» не заступається ніхто: надто багато мостів спалено за ці десять днів. Кількох членів редакції заарештовують. Їх звільнять лише за кілька тижнів, коли опозиція прийде до влади.\"},{\"imageRef\":\"img_election\",\"req\":{\"flagsAll\":[\"artina_published_d10\",\"election_shlyakh_won\"],\"flagsNone\":[]},\"ethicsMin\":null,\"ethicsMax\":null,\"ownerMin\":null,\"ownerMax\":null,\"text\":\"У день виборів у редакції обшук. Колеги по цеху співчувають у приватних повідомленнях, але публічно мовчать. Ви проходите цей день важко, але без арештів.\"},{\"imageRef\":\"img_election\",\"req\":{\"flagsAll\":[\"artina_published_d10\"],\"flagsNone\":[]},\"ethicsMin\":null,\"ethicsMax\":40,\"ownerMin\":null,\"ownerMax\":null,\"text\":\"У день виборів у редакції обшук, і заступитися нікому: мости спалені, а влада, яку ви звинуватили, впевнено переобралася. Кількох членів редакції заарештовують. Коли їх випустять, не скаже ніхто: опозиція, що програла, вже нічим не зарадить.\"},{\"imageRef\":\"img_election\",\"req\":{\"flagsAll\":[\"artina_published_d10\"],\"flagsNone\":[]},\"ethicsMin\":null,\"ethicsMax\":null,\"ownerMin\":null,\"ownerMax\":null,\"text\":\"У день виборів у редакції обшук. Ваше викриття було правдою, але влада втрималась і дає зрозуміти, що пам'ятатиме кожне ваше слово. Тепер редакції доведеться працювати під постійним наглядом влади.\"},{\"imageRef\":\"img_election\",\"req\":{\"flagsAll\":[\"nv_contests\"],\"flagsNone\":[]},\"ethicsMin\":null,\"ethicsMax\":null,\"ownerMin\":null,\"ownerMax\":null,\"text\":\"«Народний вибір» не визнає результатів: «вибори зірвано замовною фальшивкою». Країна входить у політичну кризу, і кожен матеріал «Пульсу» тепер читають як аргумент однієї зі сторін.\"},{\"imageRef\":\"img_election\",\"req\":{\"flagsAll\":[\"artina_published_d8\"],\"flagsNone\":[]},\"ethicsMin\":null,\"ethicsMax\":null,\"ownerMin\":null,\"ownerMax\":null,\"text\":\"Викриття, висміяне у восьмий день, підтвердиться повністю через місяць після виборів, коли це вже нічого не змінить. Ті самі «експерти» визнають, що факти були справжні.\"},{\"imageRef\":\"img_election\",\"req\":{\"flagsAll\":[\"artina_given_intl\",\"campaign_exposed\"],\"flagsNone\":[]},\"ethicsMin\":null,\"ethicsMax\":null,\"ownerMin\":null,\"ownerMax\":null,\"text\":\"Викриття вийшло за кордоном без обшуків, без арештів і без згадки вашого медіа. Історію, яку знайшли ви, світ дізнався від інших.\"},{\"imageRef\":\"img_election\",\"req\":{\"flagsAll\":[\"artina_given_intl_late\"],\"flagsNone\":[]},\"ethicsMin\":null,\"ethicsMax\":null,\"ownerMin\":null,\"ownerMax\":null,\"text\":\"День виборів минає без гучних новин: матеріали, які ви передали міжнародним розслідувачам, ще в роботі. Викриття вийде за кілька тижнів, повністю доведене, але вже не здатне вплинути на результат.\"},{\"imageRef\":\"img_election\",\"req\":{\"flagsAll\":[\"election_close\"],\"flagsNone\":[\"campaign_exposed\"]},\"ethicsMin\":null,\"ethicsMax\":null,\"ownerMin\":null,\"ownerMax\":null,\"text\":\"Увечері, коли розрив між партіями стискається до десятих відсотка, кандидат, що програє, оголошує результат «украденим» і кличе прихильників «захистити голоси». Натовп рушає до будівлі виборчого органу. Країна дивиться на це у прямому ефірі.\"},{\"imageRef\":\"img_election\",\"req\":{\"flagsAll\":[\"network_given_observers\"],\"flagsNone\":[]},\"ethicsMin\":null,\"ethicsMax\":null,\"ownerMin\":null,\"ownerMax\":null,\"text\":\"Зранку біля шести окружних комісій чергують спостерігачі з вашими матеріалами в теках. Двох голів комісій відсторонюють ще до обіду. Підрахунок цієї ночі проходить під наглядом і без порушень.\"},{\"imageRef\":\"img_election\",\"req\":{\"flagsAll\":[\"bribe_published_one\"],\"flagsNone\":[]},\"ethicsMin\":null,\"ethicsMax\":null,\"ownerMin\":null,\"ownerMax\":null,\"text\":\"Хабарника, якого ви викрили, до дільниці не підпускають. Але вночі з кількох округів приходять дивні цифри: мережа хабарників, що лишилася в тіні, завершила свою роботу. Спостерігачі фіксують порушення, юристи готують скарги, і ця історія затягнеться надовго.\"},{\"imageRef\":\"img_election\",\"req\":{\"flagsAll\":[\"turnout_campaign\"],\"flagsNone\":[]},\"ethicsMin\":null,\"ethicsMax\":null,\"ownerMin\":null,\"ownerMax\":null,\"text\":\"З ранку на дільницях черги: ваша кампанія «Прийди і вирішуй» спрацювала, і явка б'є повоєнний рекорд.\"},{\"imageRef\":\"img_election\",\"req\":{\"flagsAll\":[\"boycott_exposed\"],\"flagsNone\":[]},\"ethicsMin\":null,\"ethicsMax\":null,\"ownerMin\":null,\"ownerMax\":null,\"text\":\"Явка виявляється вищою, ніж лякали соціологи: після вашого розбору хвилі «сиди вдома» заклик до бойкоту працює навпаки. Люди приходять на дільниці хоча б для того, щоб ними не керували боти.\"},{\"imageRef\":\"img_election\",\"req\":{\"flagsAll\":[\"boycott_ignored\"],\"flagsNone\":[]},\"ethicsMin\":null,\"ethicsMax\":null,\"ownerMin\":null,\"ownerMax\":null,\"text\":\"Дільниці стоять напівпорожні: хвиля «сиди вдома» спрацювала, і найнижча явка серед молоді та переселенців. Ті, хто замовляв бойкот, досягли мети.\"},{\"imageRef\":\"img_election\",\"req\":null,\"ethicsMin\":null,\"ethicsMax\":null,\"ownerMin\":null,\"ownerMax\":null,\"text\":\"День виборів минає спокійно: черги без інцидентів, нудні брифінги, перші екзитполи ввечері. «Пульс» веде онлайн, країна робить свій вибір.\"}]},{\"id\":\"election_result\",\"order\":2,\"rows\":[{\"imageRef\":\"img_country_shlyakh\",\"req\":{\"flagsAll\":[\"election_shlyakh_won\",\"campaign_exposed\"],\"flagsNone\":[]},\"ethicsMin\":null,\"ethicsMax\":null,\"ownerMin\":null,\"ownerMax\":null,\"text\":\"«Шлях» перемагає. Вперше за повоєнний рік виборці знали, хто і як розганяв їхні страхи: викриття дезінформаційної кампанії зробило маніпуляції видимими. Угоду з «Ортусом» поставлено на паузу до перегляду умов.\"},{\"imageRef\":\"img_country_shlyakh\",\"req\":{\"flagsAll\":[\"election_shlyakh_won\"],\"flagsNone\":[]},\"ethicsMin\":null,\"ethicsMax\":null,\"ownerMin\":null,\"ownerMax\":null,\"text\":\"«Шлях» перемагає з мінімальним відривом. Замовники дезінформаційної кампанії лишилися в тіні: гроші, боти і «теми тижня» нікуди не зникли і просто чекають наступних виборів.\"},{\"imageRef\":\"img_country_ortus\",\"req\":{\"flagsAll\":[\"election_nv_won\",\"campaign_exposed\"],\"flagsNone\":[]},\"ethicsMin\":null,\"ethicsMax\":null,\"ownerMin\":null,\"ownerMax\":null,\"text\":\"«Народний вибір» утримує владу, але завдяки викриттям і журналістській роботі ці вибори минули прозоро: виборці знали, хто і як намагався ними керувати, і все одно зробили свій вибір. У жителів країни з'явився досвід розпізнавати маніпуляції.\"},{\"imageRef\":\"img_country_ortus\",\"req\":null,\"ethicsMin\":null,\"ethicsMax\":null,\"ownerMin\":null,\"ownerMax\":null,\"text\":\"«Народний вибір» утримує владу. Ніхто так і не дізнався, чиї гроші десять днів розганяли стрічку «Digicard». Дезінформаційна кампанія згортається до наступних виборів.\"}]},{\"id\":\"hero_fate\",\"order\":3,\"rows\":[{\"imageRef\":\"img_hero\",\"req\":{\"flagsAll\":[\"artina_published_d10\",\"election_shlyakh_won\"],\"flagsNone\":[]},\"ethicsMin\":null,\"ethicsMax\":40,\"ownerMin\":null,\"ownerMax\":null,\"text\":\"Вас випускають за кілька тижнів, коли нова влада закриває справу. Біля воріт чекають камери: людина, яку затримали за правду, тепер сама стала головною новиною країни.\"},{\"imageRef\":\"img_hero\",\"req\":{\"flagsAll\":[\"artina_published_d10\"],\"flagsNone\":[]},\"ethicsMin\":null,\"ethicsMax\":40,\"ownerMin\":null,\"ownerMax\":null,\"text\":\"Справу проти вас не закривають і не рухають, вона лишається як нагадування. Ви регулярно ходите на допити. Крісло редактора досі ваше, але ви стали значно обережнішим у публікаціях.\"},{\"imageRef\":\"img_hero\",\"req\":null,\"ethicsMin\":70,\"ethicsMax\":null,\"ownerMin\":null,\"ownerMax\":null,\"text\":\"Ваше ім'я тепер називають, коли говорять про журналістику, якій можна вірити. Дзвонять студенти, дзвонять чужі редакції, одного ранку дзвонить міжнародна премія. Ви вислуховуєте, дякуєте і повертаєтесь до ранкової летючки.\"},{\"imageRef\":\"img_hero\",\"req\":null,\"ethicsMin\":null,\"ethicsMax\":40,\"ownerMin\":null,\"ownerMax\":null,\"text\":\"Крісло ви втримали, і цифри у звітах пристойні. Тільки на професійних зустрічах колеги вітаються стримано, а молоді журналісти не просяться до вас на стажування.\"},{\"imageRef\":\"img_hero\",\"req\":null,\"ethicsMin\":null,\"ethicsMax\":null,\"ownerMin\":null,\"ownerMax\":null,\"text\":\"Ви лишаєтесь у кріслі. Після виборів робота не закінчилась, а просто стала звичною: ранкова летючка, стрічка, вечірній підсумок. Іноді ви згадуєте ці десять днів і питаєте себе, що зробили б інакше.\"}]},{\"id\":\"family\",\"order\":4,\"rows\":[{\"imageRef\":\"img_family\",\"req\":{\"flagsAll\":[\"dam_broke\"],\"flagsNone\":[]},\"ethicsMin\":null,\"ethicsMax\":null,\"ownerMin\":null,\"ownerMax\":null,\"text\":\"У Камінному тепер їздять повз затоплене селище під дамбою. Мама більше не переказує чуток: після тієї ночі вона називає імена постраждалих сусідів. Ви так і не наважилися розповісти їй, що листи будінспекції лежали у вашій редакції ще до дощів.\"},{\"imageRef\":\"img_family\",\"req\":{\"flagsAll\":[\"election_nv_won\"],\"flagsNone\":[]},\"ethicsMin\":null,\"ethicsMax\":null,\"ownerMin\":null,\"ownerMax\":null,\"text\":\"До Камінного заходить «Ортус»: жовті машини, чужі прапорці на в'їзді, обіцянки роботи. Батьки вагаються між надією і тривогою, як і все місто. Тато каже: «Хоч буде за що жити». Мама додає тихіше: «Аби було де».\"},{\"imageRef\":\"img_family\",\"req\":null,\"ethicsMin\":null,\"ethicsMax\":null,\"ownerMin\":null,\"ownerMax\":null,\"text\":\"Камінне чекає на План: переробний завод обіцяють будувати саме тут. Швидких грошей не буде, зате свої. Мама тепер щоранку читає «Пульс» уголос – сусідам. Каже, так спокійніше: коли розумієш, що діється, боїшся менше.\"}]},{\"id\":\"newsroom\",\"order\":5,\"rows\":[{\"imageRef\":\"img_newsroom\",\"req\":{\"flagsAll\":[\"solomiya_gone\"],\"flagsNone\":[]},\"ethicsMin\":null,\"ethicsMax\":null,\"ownerMin\":null,\"ownerMax\":null,\"text\":\"Фактчек-відділу більше немає: Соломія перевіряє чужі вибори в міжнародній мережі й зрідка пише «тримайтесь там». Ірма привезла з Краю практикантку і вчить її ставити незручні питання. Юрко повісив над столом графік трафіку і тепер дивиться на нього спокійніше.\"},{\"imageRef\":\"img_newsroom\",\"req\":null,\"ethicsMin\":null,\"ethicsMax\":null,\"ownerMin\":null,\"ownerMax\":null,\"text\":\"Ірма тепер пише з Камінного для місцевої газети, яку читає весь Край. Іноді її репортажі виходять і у вас, і це найкращі дні стрічки. Соломія тримає стандарти, як тримала: жодного неперевіреного слова. Юрко навчився казати «це почекає до перевірки».\"}]},{\"id\":\"kramar_pulse\",\"order\":6,\"rows\":[{\"imageRef\":\"img_kramar\",\"req\":null,\"ethicsMin\":null,\"ethicsMax\":null,\"ownerMin\":60,\"ownerMax\":null,\"text\":\"Крамар задоволений: «Пульс» слухняний, прибутковий і передбачуваний. На новорічному прийомі він знайомить вас із «потрібними людьми» і називає «своїм редактором». Редакційна політика тепер узгоджується з ним.\"},{\"imageRef\":\"img_kramar\",\"req\":null,\"ethicsMin\":null,\"ethicsMax\":null,\"ownerMin\":null,\"ownerMax\":30,\"text\":\"Терпіння Крамара скінчилося одразу після виборів: «Пульс» виставлено на продаж. Покупці ходять редакцією і оцінюють майно. Ким буде новий власник, ви дізнаєтесь із чужих новин.\"},{\"imageRef\":\"img_kramar\",\"req\":null,\"ethicsMin\":null,\"ethicsMax\":null,\"ownerMin\":null,\"ownerMax\":null,\"text\":\"Крамар викликає вас після виборів, довго мовчить і нарешті каже: «Працюй». Він не пробачив жодного заголовка, але видання приносить прибуток, і він лишає вас у кріслі. «Пульс» живе далі, між його інтересами і вашими принципами.\"}]}],\"strings\":{\"card_counter\":\"Картка {i}/{n}\",\"decision_title\":\"Рішення\",\"feedback_title\":\"Наслідки\",\"no_scale_change\":\"без змін шкал\",\"check_cost\":\"коштує {n}\",\"checks_hint\":\"На день у редакції {n} перевірки — на будь-які матеріали. Що не витратите до вечора, згорає.\",\"briefing_checks\":\"перевірок сьогодні: {n}\",\"check_done\":\"виконано\",\"check_partial_note\":\"Перевірка поверхова: правди вона не гарантує.\",\"check_label_factcheck\":\"Фактчек (Соломія)\",\"check_label_reporter\":\"Виїзд на місце (Ірма)\",\"check_label_source_call\":\"Дзвінок джерелу\",\"briefing_title\":\"Ранковий брифінг\",\"review_title\":\"Розбір дня\",\"truth_true\":\"Насправді це була правда\",\"truth_half_true\":\"Насправді це була напівправда\",\"truth_fake\":\"Насправді це був фейк\",\"truth_unknown\":\"Правда цього вечора ще невідома\",\"stamp_true\":\"правда\",\"stamp_half_true\":\"напівправда\",\"stamp_fake\":\"фейк\",\"stamp_unknown\":\"невідомо\",\"your_decision\":\"Ваше рішення\",\"checks_used\":\"перевірки\",\"no_checks_used\":\"без перевірок\",\"btn_start }\",\"scene_material_of\":\"Матеріал {i}/{n}\",\"stamp_published\":\"на головній\",\"stamp_spiked\":\"знято\",\"events_today\":\"Події дня\",\"new_event\":\"нова\",\"via_decision\":\"через ваше рішення дня {n}\",\"echo_ahead\":\"відлуння · день {n}\",\"turn_title\":\"План дня\",\"plan_events\":\"{n} подій на карті\",\"plan_events_one\":\"Одна подія на карті\",\"plan_team\":\"Бали на перевірки\",\"plan_team_hint\":\"фактчек {f} · виїзд {r} · дзвінок {c} · невитрачені згорають увечері\",\"plan_new\":\"Нових через ваші рішення\",\"plan_echo\":\"Відлуння минулих днів\",\"turn_events\":\"{n} подій\",\"turn_new\":\"{n} нових через ваші рішення\",\"turn_echo\":\"{n} відлунь попереду\",\"turn_resource\":\"перевірок сьогодні\",\"to_first_event\":\"До першої події\",\"to_next_event\":\"Наступна подія\",\"back_to_scene\":\"Назад до сцени\",\"yesterday\":\"Учора\",\"paths_title\":\"Шляхи країни\",\"front_waiting\":\"чекає #{n}\",\"og_description\":\"Десять днів у кріслі головного редактора напередодні виборів. Політичний трилер про фейки, тиск і ціну правди.\",\"game_title\":\"Крісло редактора\",\"game_tagline\":\"Політичний трилер\",\"disclaimer\":\"Соновія вигадана. Методи маніпуляцій – справжні.\",\"btn_start\":\"Почати\",\"btn_continue\":\"Продовжити\",\"checks_left\":\"Ресурс перевірок сьогодні\",\"day_summary_title\":\"Вечірній підсумок\",\"btn_next\":\"Далі\",\"btn_to_cards\":\"До стрічки новин\",\"btn_intro_next\":\"Далі\",\"btn_intro_enter\":\"До редакції\",\"btn_share\":\"Поділитися\",\"btn_play_again\":\"Зіграти ще раз\",\"btn_try_again\":\"Спробувати ще\",\"day_header\":\"День {n}\",\"warn_audience_shaky\":\"У редакційній пошті більшає листів зі словами «ви такі самі, як усі». Поки що таких листів небагато.\",\"warn_audience_critical\":\"Черговий дзвінок у редакцію починається зі слів «а, це ті, що брешуть». Сьогодні таких дзвінків уже три. Якщо так триватиме, видання втратить аудиторію остаточно.\",\"warn_traffic_shaky\":\"Юрко: «Графік повзе вниз третій день. Крамар такі графіки роздруковує і приносить на планірки».\",\"warn_traffic_critical\":\"Юрко блідий: «Ми випали з топ-5. Рекламники просять «переглянути умови». Нам терміново треба щось гучне».\",\"warn_owner_shaky\":\"Дзвінок Крамара: «Я не втручаюсь у редакційну політику. Просто нагадую, що вона в мене є».\",\"warn_owner_critical\":\"Асистент Крамара, крижаним тоном: «Пан Крамар чекає вас завтра о дев'ятій. Без запізнень».\",\"no_checks_note\":\"Перевірок на цій картці немає: факти вже відомі, і рішення стосується позиції редакції.\",\"share_end_clean\":\"Десять днів у кріслі головного редактора, і правду не продано. Спробуй і ти втриматись:\",\"share_end_compromise\":\"Десять днів у кріслі головного редактора: видання вціліло, ціну знаю лише я. А ти як упораєшся?\",\"share_end_survivor\":\"Крісло редактора вціліло, а все інше ні. Спробуй зіграти чесніше за мене:\"},\"glossary\":[{\"term\":\"Соновія\",\"forms\":[\"Соновія\",\"Соновії\",\"Соновію\",\"Соновією\"],\"text\":\"Мала гірська країна у Східній Європі, у якій відбувається гра. Рік тому виграла війну з Бакією за Рудний Край і за десять днів обирає новий парламент.\"},{\"term\":\"Біла Вежа\",\"forms\":[\"Біла Вежа\",\"Білої Вежі\",\"Білій Вежі\",\"Білу Вежу\",\"Білою Вежею\"],\"text\":\"Столиця Соновії. Тут розташовані парламент, уряд і редакція «Пульсу».\"},{\"term\":\"Бакія\",\"forms\":[\"Бакія\",\"Бакії\",\"Бакію\",\"Бакією\"],\"text\":\"Сусідня країна, з якою Соновія воювала за Рудний Край і перемогла. Стосунки між країнами лишаються ворожими.\"},{\"term\":\"Рудний Край\",\"forms\":[\"Рудний Край\",\"Рудного Краю\",\"Рудному Краї\",\"Рудним Краєм\",\"Край\",\"Краю\",\"Краї\",\"Краєм\"],\"text\":\"Прикордонний регіон Соновії з покладами рідкісноземельних металів, повернутий у війні з Бакією. Головне питання виборів: хто і на яких умовах видобуватиме його надра.\"},{\"term\":\"Камінне\",\"forms\":[\"Камінне\",\"Камінного\",\"Камінному\",\"Камінним\"],\"text\":\"Столиця Рудного Краю. У Камінному живуть батьки головного героя.\"},{\"term\":\"Тервія\",\"forms\":[\"Тервія\",\"Тервії\",\"Тервію\"],\"text\":\"Ще одна сусідка Соновії. З нею країна не воювала.\"},{\"term\":\"Сіра (річка)\",\"forms\":[\"Сірій\",\"Сіру\",\"Сірої\"],\"text\":\"Прикордонна річка між Соновією і Бакією.\"},{\"term\":\"«Народний вибір»\",\"forms\":[\"«Народний вибір»\",\"«Народного вибору»\",\"«Народним вибором»\"],\"text\":\"Правляча партія Соновії. Йде на вибори з обіцянкою угоди з «Ортусом»: швидкі гроші для відбудови в обмін на доступ до надр.\"},{\"term\":\"Стефан Крайц\",\"forms\":[\"Стефан Крайц\",\"Стефана Крайца\",\"Крайц\",\"Крайца\",\"Крайцу\",\"Крайцем\"],\"text\":\"Прем'єр-міністр Соновії, лідер партії «Народний вибір». Головний прихильник угоди з «Ортусом».\"},{\"term\":\"«Шлях»\",\"forms\":[\"«Шлях»\",\"«Шляху»\",\"«Шляхом»\"],\"text\":\"Опозиційна партія. Пропонує План розвитку власного виробництва: не віддавати надра іноземцям, а будувати власну переробку металів та високотехнологічну індустрію.\"},{\"term\":\"Дана Рева\",\"forms\":[\"Дана Рева\",\"Дани Реви\",\"Дану Реву\",\"Рева\",\"Реви\",\"Реві\",\"Реву\",\"Ревою\"],\"text\":\"Лідерка опозиційної партії «Шлях».\"},{\"term\":\"Петро Кесснер\",\"forms\":[\"Петро Кесснер\",\"Петра Кесснера\",\"Кесснер\",\"Кесснера\",\"Кесснеру\",\"Кесснером\"],\"text\":\"Міністр відбудови Соновії. Відповідає за відновлення Рудного Краю і розподіл міжнародних коштів.\"},{\"term\":\"Перший оборонний союз\",\"forms\":[\"Перший оборонний союз\",\"Першого оборонного союзу\",\"Першого оборонного Союзу\",\"Першому оборонному союзу\",\"Першим оборонним союзом\",\"Союз\",\"Союзу\",\"Союзом\",\"Союзі\"],\"text\":\"Блок країн, чия зброя допомогла Соновії виграти війну. Постачання було кредитом, і тепер Союз очікує розрахунку, зокрема металами Рудного Краю.\"},{\"term\":\"«Ортус»\",\"forms\":[\"«Ортус»\",\"«Ортуса»\",\"«Ортусу»\",\"«Ортусом»\",\"«Ортусі»\"],\"text\":\"Міжнародний видобувний консорціум. Домовляється з урядом Соновії про видобуток рідкісноземельних металів у Рудному Краї.\"},{\"term\":\"СБС\",\"forms\":[\"СБС\"],\"text\":\"Служба безпеки Соновії – спецслужба країни.\"},{\"term\":\"Фельдмаршал Чернега\",\"forms\":[\"Чернега\",\"Чернеги\",\"Чернезі\",\"Чернегу\",\"Чернегою\"],\"text\":\"Головнокомандувач армії Соновії у війні за Рудний Край, національний герой. Помер торік.\"},{\"term\":\"«Пульс»\",\"forms\":[\"«Пульс»\",\"«Пульсу»\",\"«Пульса»\",\"«Пульсі»\",\"«Пульсом»\"],\"text\":\"Найбільше онлайн-медіа Соновії. Ви його головний редактор і вирішуєте, що виходить на головній сторінці країни.\"},{\"term\":\"Данило Крамар\",\"forms\":[\"Данило Крамар\",\"Данила Крамара\",\"Крамар\",\"Крамара\",\"Крамару\",\"Крамаром\",\"Крамарові\"],\"text\":\"Олігарх, власник «Пульсу». Має бізнес-інтереси в металах і політиці, тому уважно стежить за редакційною політикою свого видання.\"},{\"term\":\"«Молнія Online»\",\"forms\":[\"«Молнія Online»\",\"«Молнії Online»\",\"«Молнію Online»\",\"«Молнії»\"],\"text\":\"Таблоїд, головний конкурент «Пульсу». Живе з гучних заголовків і сенсацій.\"},{\"term\":\"«Digicard»\",\"forms\":[\"«Digicard»\",\"„Digicard“\"],\"text\":\"Головна соціальна мережа країни, іноземна глобальна платформа. Тут народжуються тренди, хайп і вкиди.\"},{\"term\":\"«YouMessage»\",\"forms\":[\"«YouMessage»\"],\"text\":\"Популярний месенджер з анонімними каналами. Ним поширюються чутки та «інсайди».\"},{\"term\":\"«Артіна Груп»\",\"forms\":[\"«Артіна Груп»\",\"«Артіни Груп»\",\"«Артіна»\",\"«Артіни»\",\"«Артіну»\"],\"text\":\"Столична PR-агенція з дорогим офісом у центрі Білої Вежі. Досі про неї майже ніхто не писав.\"},{\"term\":\"«Меридіан-Капітал»\",\"forms\":[\"«Меридіан-Капітал»\",\"«Меридіан-Капіталу»\"],\"text\":\"Закордонний спекулятивний фонд. Скуповує борги проблемних країн за безцінь і вибиває повний розрахунок через суди.\"},{\"term\":\"Юрко Гук\",\"forms\":[\"Юрко Гук\",\"Юрка Гука\",\"Юрко\",\"Юрка\",\"Юркові\",\"Юрком\"],\"text\":\"SMM-редактор «Пульсу». Відповідає за трафік і соцмережі, щиро вірить, що перегляди – головний показник успіху.\"},{\"term\":\"Соломія Скальска\",\"forms\":[\"Соломія Скальска\",\"Соломії Скальскої\",\"Соломія\",\"Соломії\",\"Соломію\",\"Соломією\"],\"text\":\"Фактчекерка «Пульсу». Розбирає фото, документи й відео до найменших деталей і не пропускає в стрічку неперевіреного.\"},{\"term\":\"Ірма Волош\",\"forms\":[\"Ірма Волош\",\"Ірми Волош\",\"Ірма\",\"Ірми\",\"Ірмі\",\"Ірму\",\"Ірмою\"],\"text\":\"Репортерка «Пульсу» родом із Рудного Краю. Виїжджає на місця подій і каже правду в очі всім, включно з редактором.\"},{\"term\":\"Штаб у справах полонених\",\"forms\":[\"Штаб у справах полонених\",\"Штабу у справах полонених\",\"штаб у справах полонених\",\"штабу у справах полонених\"],\"text\":\"Державний орган, що займається обміном полонених і пошуком зниклих безвісти після війни з Бакією.\"},{\"term\":\"Відлуння\",\"forms\":[\"відлуння\",\"Відлуння\",\"відлунням\",\"відлунь\"],\"text\":\"Відкладений наслідок вашого рішення: історія не закінчується публікацією і за кілька днів повертається новою подією. Пунктирна позначка «д5» на карті — подія, яка чекає на день 5.\"}]}}],[\"$L5\"],\"$L6\"]}],{},null,false,null]},null,false,null],\"$L7\",false]],\"m\":\"$undefined\",\"G\":[\"$8\",[\"$L9\"]],\"S\":true,\"h\":null,\"r\":\"$undefined\",\"s\":\"$undefined\",\"a\":\"$undefined\",\"l\":\"$undefined\",\"p\":\"$undefined\",\"d\":\"$undefined\",\"b\":\"pZPVUjjNTJV92cRJxfTsE\"}\n"])</script><script>self.__next_f.push([1,"a:I[97367,[\"/redaktor-pages/_next/static/chunks/44oxwbh__ebkl.js\"],\"OutletBoundary\"]\nb:\"$Sreact.suspense\"\nd:I[97367,[\"/redaktor-pages/_next/static/chunks/44oxwbh__ebkl.js\"],\"ViewportBoundary\"]\nf:I[97367,[\"/redaktor-pages/_next/static/chunks/44oxwbh__ebkl.js\"],\"MetadataBoundary\"]\n11:I[27201,[\"/redaktor-pages/_next/static/chunks/44oxwbh__ebkl.js\"],\"IconMark\"]\n5:[\"$\",\"script\",\"script-0\",{\"src\":\"/redaktor-pages/_next/static/chunks/1zqhmyzp-m6ck.js\",\"async\":true,\"nonce\":\"$undefined\"}]\n6:[\"$\",
