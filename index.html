tep_team\",\"step_decide\",\"queue_title\",\"queue_in_work\",\"queue_after\",\"queue_done\",\"team_title\",\"team_resource\",\"team_none\",\"unit_factcheck_name\",\"unit_factcheck_desc\",\"unit_reporter_name\",\"unit_reporter_desc\",\"unit_source_call_name\",\"unit_source_call_desc\",\"unit_send\",\"unit_call\",\"unit_cost\",\"unit_cost_one\",\"unit_report_ready\",\"unit_unavailable\",\"skip_hint\",\"btn_to_decision\",\"decide_title\",\"fold_decide\",\"fold_team\",\"fold_team_done\",\"report_title\",\"front_now\",\"tab_scene\",\"tab_country\",\"tab_front\",\"tab_team\",\"line_next\",\"line_of\",\"your_reply\",\"narrator\",\"narrator_material\",\"narrator_briefing\",\"scene_material\",\"scene_material_of\",\"stamp_published\",\"stamp_spiked\",\"events_today\",\"new_event\",\"via_decision\",\"echo_ahead\",\"turn_title\",\"plan_events\",\"plan_events_one\",\"plan_team\",\"plan_team_hint\",\"plan_new\",\"plan_echo\",\"turn_events\",\"turn_new\",\"turn_echo\",\"turn_resource\",\"to_first_event\",\"to_next_event\",\"back_to_scene\",\"yesterday\",\"paths_title\",\"front_waiting\",\"og_description\"]},\"config\":{\"start\":{\"audience\":40,\"traffic\":40,\"owner\":40},\"ethicsStart\":50,\"checkPointsPerDay\":3,\"checkCosts\":{\"factcheck\":1,\"reporter\":2,\"source_call\":1},\"warnShaky\":30,\"warnCritical\":10,\"poll\":{\"startMargin\":3,\"displayBase\":37.5,\"flatThreshold\":0.8,\"driftStopFlag\":\"campaign_exposed\"},\"ethicsHighMin\":70,\"ethicsMidMin\":40,\"firing\":{\"audience\":\"fired_audience\",\"traffic\":\"fired_traffic\",\"owner\":\"fired_owner\"},\"scales\":{\"audience\":{\"label\":\"Довіра аудиторії\",\"states\":[\"міцна\",\"хитка\",\"критична\"]},\"traffic\":{\"label\":\"Трафік\",\"states\":[\"летить\",\"просідає\",\"обвал\"]},\"owner\":{\"label\":\"Лояльність власника\",\"states\":[\"задоволений\",\"насторожений\",\"лютує\"]}},\"departureDay\":8},\"intro\":[\"Соновія – невелика гірська країна. Її містечка і села стоять на схилах серед смерекових лісів, а потяги піднімаються до них серпантинами. Найцінніша земля країни лежить на сході і зветься Рудний Край. Десять років тому геологи знайшли в його надрах рідкісноземельні метали. Без цієї сировини не працює жодна технологія майбутнього. Це відкриття змінило життя Краю і всієї країни.\",\"Руду ще не встигли почати добувати, а сусідня країна Бакія вже оголосила Соновії війну. Бакія пояснювала це старою образою: на її думку, Рудний Край дістався Соновії «несправедливо». Війна тривала кілька років і була кривавою. Камінне, столиця Краю, впало за кілька тижнів. Тоді Соновія звернулася по допомогу до Першого оборонного союзу, наймогутнішого технологічного блоку континенту. Із союзною зброєю армія повернула Камінне і виграла війну. Перемогу святкувала вся країна. Про її ціну тоді ще не говорили.\",\"Відтоді минув рік. Поля ще розміновують, пошкоджені будівлі ще стоять у риштуванні, а країна вже сперечається про майбутнє, бо через десять днів відбудуться перші повоєнні вибори. Правлячий «Народний вибір», партія переможців, має зобов'язання перед Союзом за надану зброю і хоче впустити в Край іноземний видобувний консорціум «Ортус»: той забиратиме всю видобуту руду, лишаючи Соновії частину прибутку. Опозиційний «Шлях» йде на вибори із Планом розвитку власного виробництва: руда з Краю має перероблятися вдома, а високотехнологічну продукцію мають виробляти в самій Соновії. «Шлях» представляє тих, хто не хоче впускати «Ортус» у країну. Саме сьогодні ви виходите на нову роботу: після довгої співбесіди вам дісталося крісло головного редактора «Пульсу», найбільшого онлайн-видання країни. Хто знає, можливо, саме від ваших рішень залежить доля країни.\"],\"days\":[{\"day\":1,\"costs\":{},\"basePollShift\":-0.3,\"briefing\":[{\"order\":1,\"text\":\"До виборів десять днів. Країна обирає між Планом розвитку власного виробництва опозиційної партії «Шлях» і угодою чинного уряду на видобуток рідкісноземельних металів з міжнародним консорціумом «Ортус». Ви опинились у кріслі головного редактора «Пульсу». Головна сторінка країни тепер оновлюється за вашим рішенням. Власник видання – Данило Крамар, олігарх з інтересами у політиці та рідкоземельних металах.\",\"req\":null},{\"order\":2,\"text\":\"Ви працюєте з командою журналістів та цифрових спеціалістів.\",\"req\":null},{\"order\":3,\"text\":\"\u003cb\u003eЮрко Гук, SMM-редактор\u003c/b\u003e: він живе в стрічці головної соцмережі країни «Digicard», першим помічає вірусні теми і щиро вірить, що трафік на сайті і охоплення в соцмережах – головні показники успіху.\",\"req\":null},{\"order\":4,\"text\":\"\u003cb\u003eСоломія Скальска, фактчекерка\u003c/b\u003e: спокійна й уперта, вона розбирає фото, документи та діпфейки до найменших деталей і не пропустить у стрічку жодного неперевіреного слова.\",\"req\":null},{\"order\":5,\"text\":\"\u003cb\u003eІрма Волош, репортерка родом із Рудного Краю\u003c/b\u003e: пів життя провела на редакційних завданнях, знає всіх посадовців і каже правду в очі всім, включно з вами.\",\"req\":null},{\"order\":6,\"text\":\"Це ваш перший день на роботі. SMM-ник Юрко заходить до вас у кабінет, представляється і одразу переходить до справи: у «Digicard» зранку поширюється відео про отруєну воду, і вся країна вже його обговорює.\",\"req\":null}],\"personal\":[{\"order\":1,\"text\":\"Дзвінок від мами з Камінного: «У нас усі пересилають одне відео. Кажуть, що воду з крана пити не можна. Це правда?»\",\"req\":null}],\"poll\":null,\"summary\":[{\"order\":1,\"text\":\"Соломія перед виходом: «Завтра Міністерство охорони здоров'я вийде зі спростуванням. Просто щоб ви знали».\",\"req\":{\"flagsAll\":[\"published_water_fake\"],\"flagsNone\":[]}},{\"order\":2,\"text\":\"Ірма: «Брат пише з Камінного, що місто заспокоїлося. Дякую».\",\"req\":{\"flagsAll\":[\"debunked_water_fake\"],\"flagsNone\":[]}}],\"cards\":[\"d1_water_video\",\"d1_plane\",\"d1_star_cans\"]},{\"day\":2,\"costs\":{},\"basePollShift\":-0.3,\"briefing\":[{\"order\":1,\"text\":\"До виборів залишається дев'ять днів. Вночі штаб опозиційної партії «Шлях» обклеїв столицю білбордами з цифрою «400 мільйонів». Білборди стверджують: саме стільки щомісяця забиратиме з країни консорціум «Ортус», якщо уряд підпише угоду про видобуток металів корпорацією. Урядовий штаб уже назвав цю арифметику маніпуляцією.\",\"req\":null}],\"personal\":[{\"order\":1,\"text\":\"Мама пише вдруге за день: «Тепер пишуть, що вночі через кордон їдуть фури з токсичними відходами. Сусіди знову набирають воду в каністри. Що нам робити?»\",\"req\":null}],\"poll\":{\"up\":\"Перше опитування тижня: «Шлях» – {shlyakh}%, «Народний вибір» – {nv}%. Опозиція наростила відрив. Соціологи пояснюють це гучними публікаціями про ціну угоди з «Ортусом».\",\"down\":\"Перше опитування тижня: «Шлях» – {shlyakh}%, «Народний вибір» – {nv}%. Відрив опозиції виявився меншим, ніж очікували штаби. Аналітики кажуть, що паніка довкола Рудного Краю грає проти неї.\",\"flat\":\"Перше опитування тижня: «Шлях» – {shlyakh}%, «Народний вибір» – {nv}%. Цифри майже не змінилися. Соціологи кажуть, що більшість виборців давно визначилися зі своїм вибором.\"},\"summary\":[],\"cards\":[\"d2_billboard\",\"d2_wells\",\"d2_debt_metal\"]},{\"day\":3,\"costs\":{},\"basePollShift\":-0.3,\"briefing\":[{\"order\":1,\"text\":\"До виборів залишається вісім днів. Уночі блогер-мільйонник, який називає всіх політиків «однією бандою», оголосив, що йде в політику сам. Зранку про нього говорять більше, ніж про обидва передвиборчі штаби разом узяті.\",\"req\":null}],\"personal\":[{\"order\":1,\"text\":\"Мама: «Наш сусід, ветеран, поїхав у Білу Вежу і стоїть під парламентом. Його дружина питає, чи скажуть про них у новинах, чи знову ніхто не зверне уваги»\",\"req\":null}],\"poll\":null,\"summary\":[{\"order\":1,\"text\":\"Юрко: «Табір став головною новиною дня, туди їдуть знімальні групи з усієї країни».\",\"req\":{\"flagsAll\":[\"vets_frontpage\"],\"flagsNone\":[]}},{\"order\":2,\"text\":\"Ірма ввечері: «Люди на площі лишилися на ніч самі, всі журналісти поїхали. У мене погане передчуття».\",\"req\":{\"flagsAll\":[],\"flagsNone\":[\"vets_frontpage\"]}}],\"cards\":[\"d3_candidate\",\"d3_maintenance\",\"d3_witness\",\"d3_vets_camp\"]},{\"day\":4,\"costs\":{},\"basePollShift\":-0.3,\"briefing\":[{\"order\":1,\"text\":\"До виборів залишається сім днів. Уночі поліція «звільнила» площу перед парламентом від табору ветеранів. Офіційно це називають «завершенням несанкціонованої акції». Неофіційно відомо про травмованих, і серед них жінка з дитиною.\",\"req\":{\"flagsAll\":[],\"flagsNone\":[\"vets_frontpage\"]}},{\"order\":2,\"text\":\"До виборів залишається сім днів. Після вчорашнього гучного репортажу площу ніхто не чіпав: зранку уряд оголосив про переговори з табором ветеранів. Увага камер, яку ви привернули до площі своїм матеріалом, захистила табір від розгону.\",\"req\":{\"flagsAll\":[\"vets_frontpage\"],\"flagsNone\":[]}}],\"personal\":[{\"order\":1,\"text\":\"Мама: «Сусіда затримали вночі під парламентом. Його дружина обдзвонює всіх, кого знає. Ти можеш дізнатися, де він?»\",\"req\":{\"flagsAll\":[],\"flagsNone\":[\"vets_frontpage\"]}},{\"order\":2,\"text\":\"Мама: «Сусід дзвонив із площі. Каже, що приїхав міністр і вони щось підпишуть. Він у це не вірить. А ти віриш?»\",\"req\":{\"flagsAll\":[\"vets_frontpage\"],\"flagsNone\":[]}}],\"poll\":null,\"summary\":[{\"order\":1,\"text\":\"Ветеранські спільноти оголосили «Пульсу» бойкот за публікацію «зведення».\",\"req\":{\"flagsAll\":[\"published_smear\"],\"flagsNone\":[]}}],\"cards\":[\"d4_memorandum\",\"d4_smear\",\"d4_pumps\",\"d4_tranche\",\"d4_payments\"]},{\"day\":5,\"costs\":{},\"basePollShift\":-0.5,\"briefing\":[{\"order\":1,\"text\":\"До виборів залишається шість днів. Позаду половина передвиборчої гонки: країна втомлена і роздратована, а редакція працює майже без сну.\",\"req\":null}],\"personal\":[{\"order\":1,\"text\":\"Мама телефонує з Камінного: «Син сусідки зник торік під час фінального наступу. Їй сказали, що він є у якомусь списку на обмін. Вона всю ніч не спала. Скажи, це правда?»\",\"req\":null}],\"poll\":{\"up\":\"Свіже опитування: «Шлях» – {shlyakh}%, «Народний вибір» – {nv}%. Опозиція відіграє втрачене. Соціологи пояснюють це резонансними викриттями останніх днів.\",\"down\":\"Свіже опитування: «Шлях» – {shlyakh}%, «Народний вибір» – {nv}%. Відрив опозиції продовжує танути. Аналітики пов'язують це з хвилею панічних новин довкола Рудного Краю.\",\"flat\":\"Свіже опитування: «Шлях» – {shlyakh}%, «Народний вибір» – {nv}%. Суттєвих змін немає. Обидва штаби запевняють, що «все йде за планом», хоча помітно нервуються.\"},\"summary\":[{\"order\":1,\"text\":\"Крамар: «Юристи кажуть, що ти нічого не порушив. А я кажу, що ти забув, на кого працюєш».\",\"req\":{\"flagsAll\":[\"named_kramar_judge\"],\"flagsNone\":[]}}],\"cards\":[\"d5_dam_letters\",\"d5_permit_pendulum\",\"d5_marshal_archive\",\"d5_star_exclusives\",\"d5_hope_list\"]},{\"day\":6,\"costs\":{},\"basePollShift\":-0.5,\"briefing\":[{\"order\":1,\"text\":\"До виборів залишається п'ять днів. Зранку месенджери заповнені фотографіями білої води з річки під Камінним. Після тижня гучних фейків країна спершу питає, чи це знову вкид, і лише потім цікавиться, що сталося.\",\"req\":null}],\"personal\":[{\"order\":1,\"text\":\"Мама: «Цього разу сусіди не сміються, бо вода справді дивна, сірувата. Скажи чесно: минулого разу брехали, а тепер правда? Як ви це взагалі розрізняєте?»\",\"req\":null}],\"poll\":null,\"summary\":[{\"order\":1,\"text\":\"Штаб у справах полонених надіслав офіційну подяку редакції. Юрко вішає роздруківку над столом.\",\"req\":{\"flagsAll\":[\"warned_hope_scheme\"],\"flagsNone\":[]}}],\"cards\":[\"d6_white_river\",\"d6_report\",\"d6_apartment\",\"d6_sync_quote\",\"d6_two_bios\"]},{\"day\":7,\"costs\":{},\"basePollShift\":-0.5,\"briefing\":[{\"order\":1,\"text\":\"До виборів залишається чотири дні. Уночі на прикордонній річці Сірій хтось підірвав греблю. Обидва штаби на кілька годин замовкли. Навіть для передвиборчої гарячки ця подія виявилася надто важкою.\",\"req\":null}],\"personal\":[{\"order\":1,\"text\":\"Мама: «У прикордонних селах вода стоїть по вікна. Ми з сусідами збираємо речі для затоплених. Скажи чесно: це Бакія зробила чи ні?»\",\"req\":null}],\"poll\":null,\"summary\":[{\"order\":1,\"text\":\"Юрко приносить конверт від кур'єра. У ньому позов «Ортуса» на суму, що перевищує річний бюджет редакції. Соломія каже: «Зате нам не соромно».\",\"req\":{\"flagsAll\":[\"published_full_interview\"],\"flagsNone\":[]}}],\"cards\":[\"d7_dam_blast\",\"d7_institute\",\"d7_depot\",\"d7_tape\",\"d7_meridian\"]},{\"day\":8,\"costs\":{},\"basePollShift\":-0.5,\"briefing\":[{\"order\":1,\"text\":\"До виборів залишається три дні. Кампанія перейшла у фазу, коли новини не шукають: їх приносять до редакцій зацікавлені сторони, часто анонімно. Сьогодні доведеться з'ясувати, хто насправді керує інфополем.\",\"req\":null}],\"personal\":[{\"order\":1,\"text\":\"Мама: «Сусідка каже, що не піде голосувати, бо все одно все вже вирішили без нас. Я не знаю, що їй відповісти. А ти що скажеш?»\",\"req\":null}],\"poll\":{\"up\":\"Останнє опитування перед виборами: «Шлях» – {shlyakh}%, «Народний вибір» – {nv}%. Опозиція йде вгору. Соціологи кажуть, що країна втомилася від скандалів довкола угоди.\",\"down\":\"Останнє опитування перед виборами: «Шлях» – {shlyakh}%, «Народний вибір» – {nv}%. Влада доганяє. Аналітики пояснюють це страхом виборців перед різкими змінами.\",\"flat\":\"Останнє опитування перед виборами: «Шлях» – {shlyakh}%, «Народний вибір» – {nv}%. Розрив мінімальний. Соціологи попереджають, що все вирішить явка.\"},\"summary\":[{\"order\":90,\"text\":\"Ірма заходить попрощатись. «Я повертаюсь у Камінне. Там від мене більше користі, ніж тут, де мої репортажі лягають у сейф». Вона кладе на стіл перепустку і диктофон. Із завтрашнього дня виїздів у редакції немає.\",\"req\":{\"flagsAll\":[\"irma_gone\"],\"flagsNone\":[]}},{\"order\":91,\"text\":\"Соломія кладе на стіл заяву. «Мене кличуть у міжнародну фактчекінгову мережу. Там факти перевіряють, а не узгоджують нагорі». Із завтрашнього дня фактчеку в редакції немає.\",\"req\":{\"flagsAll\":[\"solomiya_gone\"],\"flagsNone\":[]}}],\"cards\":[\"d8_mine\",\"d8_humanitarian\",\"d8_spyware\",\"d8_boycott\",\"d8_artina\"]},{\"day\":9,\"costs\":{\"factcheck\":2,\"reporter\":3,\"source_call\":1},\"basePollShift\":-0.5,\"briefing\":[{\"order\":1,\"text\":\"До виборів залишається два дні. Завтра прем’єр-міністр Крайц має парафувати угоду з «Ортусом», і Біла Вежа переповнена зливами та чутками. Перевіряти їх сьогодні важче, ніж будь-коли: джерела замовкають, експерти раптом «зайняті», а за кожен документ просять удвічі більше.\",\"req\":null},{\"order\":2,\"text\":\"Стіл Ірми стоїть прибраний і порожній. Виїздів на місця більше немає, і про все, що діється за межами столиці, редакція тепер дізнається з чужих джерел.\",\"req\":{\"flagsAll\":[\"irma_gone\"],\"flagsNone\":[]}},{\"order\":3,\"text\":\"За столом Соломії темний монітор. Фактчеку більше немає, і кожен документ відтепер доводиться приймати або відкидати на віру.\",\"req\":{\"flagsAll\":[\"solomiya_gone\"],\"flagsNone\":[]}}],\"personal\":[{\"order\":1,\"text\":\"Мама: «По телевізору сказали, що за журналістами стежать. Я тепер щоночі погано сплю. Пообіцяй мені, що будеш обережним».\",\"req\":null}],\"poll\":null,\"summary\":[{\"order\":1,\"text\":\"Телефон редакції не замовкає: дзвонять іноземні кореспонденти, посольства і юристи. Юрко дивиться на графіки і мовчить, бо такого трафіку «Пульс» не бачив ніколи.\",\"req\":{\"flagsAll\":[\"artina_published_d9\"],\"flagsNone\":[]}}],\"cards\":[\"d9_dossier\",\"d9_plot\",\"d9_sellers\",\"d9_page14\",\"d9_artina_laugh\",\"d9_artina_payer\"]},{\"day\":10,\"costs\":{\"factcheck\":2,\"reporter\":3,\"source_call\":1},\"basePollShift\":-0.5,\"briefing\":[{\"order\":1,\"text\":\"Настав останній день перед виборами, день тиші. Агітація заборонена, білборди порожніють, але спокійним цей день не буде: саме сьогодні редакцію чекають найважчі рішення. Завтра країна голосуватиме.\",\"req\":null}],\"personal\":[{\"order\":1,\"text\":\"Мама: «Ми з батьком вирішили піти голосувати зранку, першими. Ти нам так і не сказав, за кого, і не кажи. Ми вже самі розібралися завдяки тому, що читали».\",\"req\":null}],\"poll\":null,\"summary\":[{\"order\":1,\"text\":\"В опенспейсі тихо. Юрко вимикає монітори, киває на порожній стіл колеги і каже: «Побачимось після виборів».\",\"req\":{\"flagsAll\":[\"artina_held_final\"],\"flagsNone\":[]}}],\"cards\":[\"d10_hospital\",\"d10_bribe\",\"d10_tervia\",\"d10_port_arrest\",\"d10_final_storm\",\"d10_final_ashes\",\"d10_final\"]}],\"cards\":{\"d1_water_video\":{\"id\":\"d1_water_video\",\"day\":1,\"order\":1,\"type\":\"news\",\"storyline\":\"campaign\",\"headline\":\"У соцмережі «Digicard» поширюється відео: «Стара шахта труїть річку під Камінним, столицею регіону Рудний Край»\",\"body\":\"Анонімний акаунт виклав відео, на якому видно каламутну буру воду і мертву рибу на березі. Підпис стверджує, що злив із затопленої шахти в Краї отруїв річку, а владі байдуже. За ніч відео зібрало 40 тисяч репостів. У коментарях паніка, люди скуповують воду в пляшках. Офіційних коментарів поки немає.\",\"truth\":\"fake\",\"revealText\":\"Відео виявилося монтажем: кадри хімічної аварії 2009 року з іншої країни, а «мертва риба» взята з третього ролика. Хтось перевіряв, як швидко паніка про Край поширюється без жодного факту.\",\"req\":null,\"checks\":{\"factcheck\":{\"reveal\":\"full\",\"text\":\"Соломія Скальска: «Пошук показує, що це хімічна аварія 2009 року в зовсім іншій країні. Мертва риба взагалі з третього відео. Це монтаж».\"},\"reporter\":{\"reveal\":\"full\",\"text\":\"Ірма Волош із Камінного: «Я стою на березі. Вода чиста, рибалки сидять тут з ранку і дивуються моїм питанням».\"},\"source_call\":{\"reveal\":\"partial\",\"text\":\"Еколог по телефону: «Теоретично витік можливий, бо шахти стоять затоплені ще з окупації. Але конкретних даних щодо цієї річки в мене немає».\"}},\"options\":[{\"id\":\"publish_asis\",\"order\":1,\"label\":\"Поставити як є: «Річку під Камінним труїть шахта?»\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":-12,\"traffic\":18,\"ethics\":-6},\"fxPoll\":0.3,\"setFlags\":[\"published_water_fake\"],\"counters\":{},\"feedback\":\"Юрко: «Матеріал уже в топі, двадцять тисяч переглядів за годину». Соломія мовчки дивиться на вас поверх окулярів.\",\"delayed\":[{\"afterDays\":2,\"text\":\"Міністерство охорони здоров'я офіційно спростувало «отруєну воду»: проби чисті, а відео виявилося монтажем. Під матеріалом «Пульсу» зібралися тисячі гнівних коментарів на кшталт «ви розігнали паніку».\",\"fx\":{\"audience\":-12},\"fxPoll\":0,\"setFlags\":[]}]},{\"id\":\"publish_debunk\",\"order\":2,\"label\":\"Опублікувати розбір: звідки взялося відео і чому це фейк\",\"reqTruthKnown\":true,\"req\":null,\"fx\":{\"audience\":12,\"traffic\":6,\"ethics\":6},\"fxPoll\":-0.2,\"setFlags\":[\"debunked_water_fake\"],\"counters\":{},\"feedback\":\"Соломія: «Так і треба працювати». Юрко зітхає: «Розбори теж читають, хоч і менше».\",\"delayed\":[{\"afterDays\":2,\"text\":\"На розбір «Пульсу» про фейкову «отруєну воду» посилаються інші редакції. У Камінному люди заспокоїлися.\",\"fx\":{\"audience\":6},\"fxPoll\":0,\"setFlags\":[]}]},{\"id\":\"publish_careful\",\"order\":3,\"label\":\"Опублікувати обережно: «У мережі поширюється відео», без висновків\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":-4,\"traffic\":10,\"ethics\":-3},\"fxPoll\":0.1,\"setFlags\":[\"spread_water_rumor\"],\"counters\":{},\"feedback\":\"Юрко: «Непогано, є репости». Ірма з порога: «Ми пишемо «у мережі пишуть», але ж ми і є та мережа».\",\"delayed\":[{\"afterDays\":2,\"text\":\"Міністерство охорони здоров'я спростувало «отруєну воду». Ваш обережний матеріал усе одно згадують серед тих, що розганяли паніку. Позначка «у мережі пишуть» нікого не врятувала.\",\"fx\":{\"audience\":-6},\"fxPoll\":0,\"setFlags\":[]}]},{\"id\":\"ignore\",\"order\":4,\"label\":\"Ігнорувати: не наша тема, поки нема фактів\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"traffic\":-10},\"fxPoll\":0,\"setFlags\":[],\"counters\":{},\"feedback\":\"Юрко показує дашборд: конкуренти зібрали пів мільйона переглядів на «отруті». Крамар поки мовчить.\",\"delayed\":[]}]},\"d1_plane\":{\"id\":\"d1_plane\",\"day\":1,\"order\":2,\"type\":\"news\",\"storyline\":\"\",\"headline\":\"До Білої Вежі, столиці Соновії, прилетіла делегація іноземного видобувного консорціуму «Ортус». Переговори про угоду щодо видобутку в Рудному Краї виходять на завершальний етап\",\"body\":\"Делегація приземлилась в аеропорту Білої Вежі в умовах повної секретності. Влада хоче зробити вигляд, що це просто протокольна зустріч, і не дає жодної конкретики. Пресслужба роздала однаковий реліз усім редакціям: «сторони обговорять інвестиційні перспективи». Юрко не бачить у ній трафіку. Саме з цією делегацією Крайц має парафувати угоду до виборів, і від цих переговорів залежить, чиїм буде Край.\",\"truth\":\"true\",\"revealText\":\"Делегація справжня, і переговори реальні. Саме ця угода вирішить, якою буде Соновія. Протокольна новина насправді була головною новиною дня.\",\"req\":null,\"checks\":{\"factcheck\":{\"reveal\":\"full\",\"text\":\"Соломія: «Реліз справжній, акредитації підтверджені. У списку делегації – перші особи «Ортуса» з правом підпису. Такі люди не літають заради протоколу, вони приїжджають ставити підписи».\"},\"source_call\":{\"reveal\":\"partial\",\"text\":\"Знайомий у міністерстві закордонних справ каже неофіційно: «Вони приїхали підписувати. Більше нічого не скажу, і на мене не посилайтесь».\"}},\"options\":[{\"id\":\"protocol\",\"order\":1,\"label\":\"Опублікувати протокольно, як усі: делегація прилетіла на переговори\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"traffic\":-3,\"owner\":3},\"fxPoll\":0,\"setFlags\":[],\"counters\":{},\"feedback\":\"Юрко: «Сто переглядів, зате безпечно». Пресслужба уряду ставить лайк.\",\"delayed\":[]},{\"id\":\"context\",\"order\":2,\"label\":\"Опублікувати з контекстом: що поставлено на кін у цій угоді\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":8,\"traffic\":5,\"ethics\":4},\"fxPoll\":0,\"setFlags\":[],\"counters\":{},\"feedback\":\"Читачі поширюють пояснення з коментарями «нарешті хтось пояснив, що вирішується». Юрко здивований, що матеріал працює і без клікбейту.\",\"delayed\":[]},{\"id\":\"clickbait\",\"order\":3,\"label\":\"Зробити клікбейт: «Вони прилетіли по наш Край»\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":-5,\"traffic\":12,\"owner\":-5,\"ethics\":-5},\"fxPoll\":0.3,\"setFlags\":[],\"counters\":{},\"feedback\":\"Трафік зростає, у коментарях проклинають «запроданців». Пресслужба «Ортуса» «просить уточнити заголовок». Юрко задоволений, а Соломія ні.\",\"delayed\":[]},{\"id\":\"ignore\",\"order\":4,\"label\":\"Ігнорувати: реліз без фактів не є новиною\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":-3,\"traffic\":-10,\"ethics\":-2},\"fxPoll\":0,\"setFlags\":[],\"counters\":{},\"feedback\":\"Стрічка прожила день без найважливішої угоди країни. Конкуренти зібрали перегляди навіть на «нудному протоколі».\",\"delayed\":[]}]},\"d1_star_cans\":{\"id\":\"d1_star_cans\",\"day\":1,\"order\":3,\"type\":\"news\",\"storyline\":\"\",\"headline\":\"Найпопулярніша співачка Соновії виклала в соцмережі «Digicard» фото з каністрами і підписом: «Запасаюсь водою на 5 днів і вам раджу»\",\"body\":\"Пост існує, фото справжнє, і за ранок вони зібрали пів мільйона вподобань. Співачка нічого не стверджує про причини і не згадує ні шахту, ні річку. Але в поєднанні з ранковим відео про «отруєну річку» в Рудному Краї це виглядає як накручування панічних настроїв. Юрко, SMM-редактор «Пульсу», задоволений: тема гаряча, і будь-який матеріал про воду сьогодні збере хвилю переглядів. Питання лише в тому, який це буде матеріал.\",\"truth\":\"half_true\",\"revealText\":\"Пост справжній, але співачка нічого не стверджувала, а лише злякалась, як і всі. Для багатьох її пост став підтвердженням, що відео правдиве.\",\"req\":null,\"checks\":{\"factcheck\":{\"reveal\":\"full\",\"text\":\"Соломія: «Пост справжній, акаунт верифікований. Але в ньому немає жодного твердження про причини, лише порада запастися водою. Новини я тут не бачу, лише паніку».\"},\"source_call\":{\"reveal\":\"partial\",\"text\":\"Менеджерка співачки: «Це особистий пост, коментарів не буде». На фоні чутно, як хтось диктує їй наступний пост.\"}},\"options\":[{\"id\":\"hype\",\"order\":1,\"label\":\"«Навіть зірки запасаються водою»: хайп на гарячій темі\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":-8,\"traffic\":15,\"owner\":3,\"ethics\":-6},\"fxPoll\":0.2,\"setFlags\":[],\"counters\":{},\"feedback\":\"Юрко задоволений: хайп спрацював, перегляди зростають. Соломія: «Ми щойно сказали країні, що зірка знає щось, чого не знаємо ми».\",\"delayed\":[]},{\"id\":\"debunk_smile\",\"order\":2,\"label\":\"Розбір: як один пост знаменитості розганяє паніку\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":9,\"traffic\":4,\"ethics\":5},\"fxPoll\":0,\"setFlags\":[],\"counters\":{},\"feedback\":\"Розбір поширюється повільно, зате його пересилають учителі й лікарі. Юрко: «Не топ, але його читатимуть довго».\",\"delayed\":[]},{\"id\":\"ask_star\",\"order\":3,\"label\":\"Попросити співачку про коментар: можливо, вона видалить пост\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":2,\"traffic\":-4,\"ethics\":3},\"fxPoll\":0,\"setFlags\":[],\"counters\":{},\"feedback\":\"Менеджерка співачки: «Це особистий пост». За годину пост тихо зникає, але скриншоти вже розійшлися.\",\"delayed\":[]},{\"id\":\"ignore\",\"order\":4,\"label\":\"Не чіпати: це звичайний пост\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"traffic\":-10},\"fxPoll\":0,\"setFlags\":[],\"counters\":{},\"feedback\":\"Пост живе без вас. Увечері його показують у телеефірі, і звичайний допис перетворюється на «новину про паніку».\",\"delayed\":[]}]},\"d2_billboard\":{\"id\":\"d2_billboard\",\"day\":2,\"order\":1,\"type\":\"news\",\"storyline\":\"\",\"headline\":\"Штаб опозиційної партії «Шлях» обклеїв столицю білбордами. Напис на них стверджує, що «Ортус» забиратиме в Соновії 400 мільйонів на місяць\",\"body\":\"За ніч у Білій Вежі, столиці Соновії, з'явилися сотні білбордів із написом «400 мільйонів щомісяця – ціна угоди з «Ортусом». Так опозиція оцінює угоду з іноземним консорціумом, якому уряд хоче віддати видобуток у Рудному Краї. Опозиційний передвиборчий штаб запевняє, що взяв цифру з проєкту угоди, але сам проєкт не поширювали у відкритому доступі, і в якому контексті згадується ця цифра, невідомо. Юрко, SMM-редактор «Пульсу», каже, що цифра вже живе своїм життям у соцмережі «Digicard»: нею діляться навіть прихильники угоди.\",\"truth\":\"half_true\",\"revealText\":\"Цифра справжня і взята з реального проєкту угоди. Але на білбордах немає другої колонки: інвестиційні зобов'язання і списання воєнного боргу повертають більшу частину цих грошей у бюджет.\",\"req\":null,\"checks\":{\"factcheck\":{\"reveal\":\"full\",\"text\":\"Соломія: «Цифра є в проєкті угоди. Поруч стоїть друга колонка: інвестиційні зобов'язання і списання боргу, які повертають більшу частину грошей у бюджет. Штаб цю колонку просто не показав».\"},\"source_call\":{\"reveal\":\"partial\",\"text\":\"Економіст по телефону: «400 мільйонів – цифра реальна, але валова. Рахувати треба сальдо, хоча перед виборами його ніхто не рахує».\"}},\"options\":[{\"id\":\"amplify\",\"order\":1,\"label\":\"Розтиражувати із заголовком: «400 мільйонів забиратимуть щомісяця, підрахунок опозиції»\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":-6,\"traffic\":15,\"owner\":-4,\"ethics\":-6},\"fxPoll\":0.4,\"setFlags\":[],\"counters\":{},\"feedback\":\"Юрко радіє: «Цифра в тренді, ми в топі». Увечері опозиційний телеканал відкриває цією цифрою ефір і посилається на «Пульс».\",\"delayed\":[]},{\"id\":\"factcheck_piece\",\"order\":2,\"label\":\"Опублікувати фактчек: звідки цифра і що вона ховає\",\"reqTruthKnown\":true,\"req\":null,\"fx\":{\"audience\":10,\"traffic\":6,\"owner\":3,\"ethics\":6},\"fxPoll\":-0.3,\"setFlags\":[],\"counters\":{},\"feedback\":\"Соломія задоволена: «Тепер чесно: і цифра, і друга колонка поруч». Штаб «Шляху» ображено мовчить, зате матеріал поширюють економісти.\",\"delayed\":[]},{\"id\":\"neutral\",\"order\":3,\"label\":\"Опублікувати нейтрально, навести цифру з позначкою «за даними штабу „Шляху“»\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":-3,\"traffic\":8,\"ethics\":-3},\"fxPoll\":0.2,\"setFlags\":[],\"counters\":{},\"feedback\":\"Це безпечний варіант. Однак у репостах позначка «за даними штабу» губиться першою, і читачам лишається сама цифра.\",\"delayed\":[]},{\"id\":\"ignore\",\"order\":4,\"label\":\"Проігнорувати: це їхня передвиборча математика\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"traffic\":-10},\"fxPoll\":0,\"setFlags\":[],\"counters\":{},\"feedback\":\"Цифра живе і без вас: до вечора вона розійшлася по всіх пабліках «Digicard». Юрко зітхає: «Ми єдина редакція, яка не отримала з неї трафіку».\",\"delayed\":[]}]},\"d2_wells\":{\"id\":\"d2_wells\",\"day\":2,\"order\":2,\"type\":\"news\",\"storyline\":\"campaign\",\"headline\":\"У месенджері «YouMessage» поширюється голосове повідомлення: консорціум «Ортус» уже звозить у Рудний Край чужі токсичні відходи\",\"body\":\"Анонімні канали месенджера переказують «інсайд від митника»: нібито вночі через кордон їдуть фури іноземного консорціуму «Ортус» з токсичними відходами, які ховають у старих штольнях під Камінним, столицею Рудного Краю, де живуть і ваші батьки. Голосове повідомлення переслали вже тисячі людей. Ваша мама телефонує вдруге за день і каже, що сусіди набирають воду про запас.\",\"truth\":\"fake\",\"revealText\":\"Фур із відходами не існує: штольні під Камінним закриті й затоплені ще з війни, і це легко перевірити в гірничому реєстрі. Це вже другий панічний вкид про Край за два дні.\",\"req\":null,\"checks\":{\"factcheck\":{\"reveal\":\"full\",\"text\":\"Соломія: «Гірничий реєстр каже однозначно: усі штольні під Камінним затоплені й опечатані ще з часів війни. Заїзд техніки туди неможливий фізично. Це вигадка».\"},\"reporter\":{\"reveal\":\"full\",\"text\":\"Ірма з прикордонного переїзду: «Стою тут пів дня. Проїхали лісовози й автобуси, але жодної фури з відходами. Митники з того голосового повідомлення сміються».\"},\"source_call\":{\"reveal\":\"partial\",\"text\":\"Знайомий митний брокер: «Уночі всяке їздить. Але про фури з токсичними відходами чую вперше, а такі речі на кордоні не приховаєш».\"}},\"options\":[{\"id\":\"publish_rumor\",\"order\":1,\"label\":\"Поставити: «У Край звозять чужі відходи? Що відомо»\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":-10,\"traffic\":12,\"ethics\":-8},\"fxPoll\":0.3,\"setFlags\":[],\"counters\":{},\"feedback\":\"Трафік ви отримали, але паніка подвоїлася: у Камінному стоять черги по воду в пляшках. Мама більше не передзвонює, бо читає ваші новини і вірить їм.\",\"delayed\":[{\"afterDays\":2,\"text\":\"Голосові повідомлення про «токсичні фури» повернулися новою хвилею, і тепер у них фігурує ваша публікація як «доказ». Спростувати чутку стало важче, бо вона посилається на вас.\",\"fx\":{\"audience\":-4},\"fxPoll\":0,\"setFlags\":[]}]},{\"id\":\"debunk\",\"order\":2,\"label\":\"Опублікувати спростування: штольні закриті ще з війни\",\"reqTruthKnown\":true,\"req\":null,\"fx\":{\"audience\":11,\"traffic\":4,\"owner\":2,\"ethics\":6},\"fxPoll\":-0.2,\"setFlags\":[],\"counters\":{},\"feedback\":\"Дані гірничого реєстру нудні, зате незаперечні. У коментарях уперше за день пишуть «дякую, заспокоїли». Соломія схвально киває.\",\"delayed\":[]},{\"id\":\"pro_gov_spin\",\"order\":3,\"label\":\"Випустити новину «Брехня в соцмережах зриває життєдайну угоду. Кому це вигідно?»\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":-5,\"traffic\":8,\"owner\":5,\"ethics\":-6},\"fxPoll\":-0.4,\"setFlags\":[],\"counters\":{},\"feedback\":\"Пресслужба уряду вдячно поширює ваш матеріал. Юрко здивований: «Ми щойно спростували фейк агітацією?»\",\"delayed\":[]},{\"id\":\"anti_gov_spin\",\"order\":4,\"label\":\"Використати паніку для матеріалу «Уряд втратив контроль над Краєм»\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":-8,\"traffic\":11,\"owner\":-6,\"ethics\":-9},\"fxPoll\":0.5,\"setFlags\":[],\"counters\":{},\"feedback\":\"Матеріал розлітається шалено: опозиційні пабліки цитують заголовок, паніка в Камінному подвоюється. Соломія нагадує: «А сам фейк ми так і не спростували».\",\"delayed\":[]}]},\"d2_debt_metal\":{\"id\":\"d2_debt_metal\",\"day\":2,\"order\":3,\"type\":\"story\",\"storyline\":\"campaign\",\"headline\":\"Перший оборонний союз уперше офіційно заявляє: «Постачання зброї Соновії було кредитом. Час говорити про рідкоземельні метали»\",\"body\":\"Посол Першого оборонного союзу, блоку країн, чия зброя допомогла Соновії виграти війну з Бакією, в інтерв'ю закордонному виданню вперше говорить прямо: воєнна допомога була надана у борг, і «найприродніша форма розрахунку – участь у видобутку». Уряд у Білій Вежі поки не коментує. Передвиборчий штаб прем'єр-міністра Стефана Крайца просить редакції «не загострювати». Дана Рева, лідерка опозиційного «Шляху», вже назвала інтерв'ю «кривавим рахунком». Юрко каже, що тема набирає перегляди, але власник просив писати «акуратно».\",\"truth\":\"true\",\"revealText\":\"Посол справді сказав усе це: воєнна допомога була боргом, а метали він назвав «формою розрахунку». Це незручна правда, яку всі просили «не загострювати».\",\"req\":null,\"checks\":{\"factcheck\":{\"reveal\":\"full\",\"text\":\"Соломія: «Звірила публікацію з оригіналом інтерв'ю: цитати точні, переклад коректний. Посол справді сказав і про кредит, і про «форму розрахунку».\"},\"source_call\":{\"reveal\":\"partial\",\"text\":\"Відставний дипломат: «Посол озвучив те, про що в кулуарах говорять уже рік. Важливіше питання, чому він сказав це саме зараз».\"}},\"options\":[{\"id\":\"full_quotes\",\"order\":1,\"label\":\"Перекласти й переповісти, з усіма гострими цитатами\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":10,\"traffic\":11,\"owner\":-14,\"ethics\":6},\"fxPoll\":0.4,\"setFlags\":[\"quoted_ambassador\"],\"counters\":{},\"feedback\":\"Цитата про «форму розрахунку» вибухає в мережі. Штаб Крайца дзвонить у редакцію тричі за годину. Крамар каже лише «Я ж просив акуратно» і кладе слухавку.\",\"delayed\":[]},{\"id\":\"soft\",\"order\":2,\"label\":\"Опублікувати стисло, без цитати про «форму розрахунку», як просить передвиборчий штаб прем'єра\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":-5,\"traffic\":3,\"owner\":6,\"ethics\":-6},\"fxPoll\":-0.2,\"setFlags\":[],\"counters\":{\"kramar_obeyed\":1},\"feedback\":\"Штаб прем'єра дякує вам «за виваженість». Увечері повну цитату публікує конкурент і забирає собі й трафік, і репутацію сміливої редакції.\",\"delayed\":[]},{\"id\":\"opposition_frame\",\"order\":3,\"label\":\"Подати очима опозиції: «Союз виставив рахунок за перемогу»\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":3,\"traffic\":10,\"owner\":-5,\"ethics\":-4},\"fxPoll\":0.5,\"setFlags\":[],\"counters\":{},\"feedback\":\"Дана Рева поширює матеріал з подякою. Половина коментаторів пише, що «Пульс» став виданням «Шляху». Юрко підсумовує: «Трафік є, але тепер нас вважають чиїмись».\",\"delayed\":[]},{\"id\":\"hold\",\"order\":4,\"label\":\"Притримати тему до офіційної реакції уряду\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":-4,\"traffic\":-6,\"owner\":3,\"ethics\":-3},\"fxPoll\":0,\"setFlags\":[],\"counters\":{},\"feedback\":\"Уряд мовчить перший день, потім другий. Тим часом цитату посла розносять інші видання. Ірма питає: «А чого ми, власне, чекали?»\",\"delayed\":[]}]},\"d3_candidate\":{\"id\":\"d3_candidate\",\"day\":3,\"order\":1,\"type\":\"story\",\"storyline\":\"campaign\",\"headline\":\"Блогер «проти всіх» за тиждень набрав мільйон підписників у соцмережі «Digicard» і оголосив, що йде в політику\",\"body\":\"Ніхто в редакції «Пульсу» не може пояснити зростання популярності нового кандидата: його середні перегляди більші, ніж у прем'єра Крайца і опозиціонерки Реви разом. Гасла прості: «і Союз, і «Шлях», і «Народний вибір» – одна банда». Аналітик, з яким дружить фактчекерка Соломія, показує дивну статистику: половина репостів походить з акаунтів, створених минулого місяця й активних лише вночі. Але мільйон підписників справжні. Крамар, власник «Пульсу» і впливовий олігарх, радить «не чіпати хлопця, бо народ його любить».\",\"truth\":\"half_true\",\"revealText\":\"Мільйон підписників справжній, але розганяли його штучно: половина репостів походить від нічних акаунтів-одноденок. Хтось навмисно розкручує «третього кандидата», який відбирає голоси в обох партій.\",\"req\":null,\"checks\":{\"factcheck\":{\"reveal\":\"full\",\"text\":\"Соломія разом з аналітиком: «Половина репостів іде з акаунтів минулого місяця, активних лише вночі, зареєстрованих пачками. Розгін штучний. Але аудиторія, яку він зібрав, жива».\"},\"reporter\":{\"reveal\":\"partial\",\"text\":\"Ірма із зустрічі з прихильниками блогера: «Люди справжні і дуже злі, причому на всіх одразу. Про ботів вони чути не хочуть».\"},\"source_call\":{\"reveal\":\"partial\",\"text\":\"Менеджер блогера: «Ми нікого не купуємо, людям просто набридли старі політики». Говорить він при цьому надто спокійно.\"}},\"options\":[{\"id\":\"expose_bots\",\"order\":1,\"label\":\"Опублікувати розслідування про нічні акаунти вже сьогодні\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":6,\"traffic\":12,\"owner\":-6,\"ethics\":4},\"fxPoll\":0,\"setFlags\":[],\"counters\":{},\"feedback\":\"Матеріал про нічні акаунти розносять усі. Блогер відповідає у сторіз, що «стара медіамафія злякалась». Його мільйон підписників приходить до вас у коментарі майже в повному складі.\",\"delayed\":[]},{\"id\":\"portrait_questions\",\"order\":2,\"label\":\"Опублікувати портрет із блоком про підозрілі акаунти: питання, а не вирок\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":8,\"traffic\":8,\"owner\":-3,\"ethics\":5},\"fxPoll\":0,\"setFlags\":[],\"counters\":{},\"feedback\":\"Ви показали і феномен, і дивну статистику, але не винесли вироку. Аналітики поширюють матеріал, фанати лають, але юристам блогера нема за що зачепитися.\",\"delayed\":[]},{\"id\":\"neutral_portrait\",\"order\":3,\"label\":\"Зробити нейтральний портрет феномена без згадки про ботів\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":-4,\"traffic\":10,\"owner\":3,\"ethics\":-5},\"fxPoll\":0,\"setFlags\":[],\"counters\":{},\"feedback\":\"Портрет збирає перегляди: пів мільйона людей читають про блогера, і в тексті немає жодного слова про ботів. Соломія сухо зауважує: «Ми його щойно легалізували».\",\"delayed\":[]},{\"id\":\"ignore\",\"order\":4,\"label\":\"Не чіпати: без доказів це виглядатиме як замовна атака\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"traffic\":-10,\"owner\":4,\"ethics\":-3},\"fxPoll\":0,\"setFlags\":[],\"counters\":{\"kramar_obeyed\":1},\"feedback\":\"Крамар задоволений вашою обережністю: «Розумно». Блогер тим часом росте далі, у нього вже мільйон двісті підписників. Знайомий аналітик Соломії питає, чи його графіки взагалі комусь потрібні.\",\"delayed\":[]}]},\"d3_maintenance\":{\"id\":\"d3_maintenance\",\"day\":3,\"order\":2,\"type\":\"news\",\"storyline\":\"economy\",\"headline\":\"Переробний хаб Першого оборонного союзу зупинив прийом руди з Соновії, пояснивши це «плановим техобслуговуванням»\",\"body\":\"Через день після різкого інтерв'ю прем’єра Соновії Стефана Крайца про «несправедливі умови» єдиний закордонний хаб, що переробляє соновійську руду, оголосив «планову зупинку на невизначений термін». Своєї переробки в країні немає, саме про її появу сперечаються партії на виборах. Офіційна причина – регламентні роботи. У галузі в це не вірять, бо «регламент» оголосили в п'ятницю ввечері. Два гірничі містечка Рудного Краю вже рахують, на скільки тижнів вистачить складів. Довести зв'язок зупинки з виборами неможливо, але збіг у часі очевидний.\",\"truth\":\"half_true\",\"revealText\":\"Зупинка хабу реальна, а от «плановість» вигадана: жодного регламенту в графіку робіт не було. Але прямих доказів зв'язку з інтерв'ю прем'єра не існує. Це тиск, який неможливо довести документально.\",\"req\":null,\"checks\":{\"factcheck\":{\"reveal\":\"partial\",\"text\":\"Соломія: «Реліз стандартний, а графіків ремонтів хаб не публікує. Формально перевірити «плановість» неможливо, і вони це чудово знають».\"},\"source_call\":{\"reveal\":\"full\",\"text\":\"Трейдер, що працює з хабом: «Жодного регламенту в графіку не було. Розпорядження прийшло «згори» наступного ранку після інтерв'ю вашого прем'єра».\"}},\"options\":[{\"id\":\"cut_oxygen\",\"order\":1,\"label\":\"Заголовок «Союз перекрив кисень»: відвертий випад проти Союзу\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":4,\"traffic\":12,\"owner\":-6,\"ethics\":-5},\"fxPoll\":0.4,\"setFlags\":[],\"counters\":{},\"feedback\":\"Заголовок про «перекритий кисень» підхоплюють усі. Прес-аташе посольства Першого оборонного Союзу дзвонить не вам, а одразу Крамару. Конфлікт із Союзом загострюється.\",\"delayed\":[]},{\"id\":\"two_facts\",\"order\":2,\"label\":\"Опублікувати обидва факти поруч без висновку: інтерв'ю прем'єра і «регламент» хабу\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":9,\"traffic\":8,\"owner\":-3,\"ethics\":5},\"fxPoll\":0,\"setFlags\":[],\"counters\":{},\"feedback\":\"Читачі зробили висновок самостійно: у коментарях звучить саме те, чого ви не писали. Юридично матеріал бездоганний.\",\"delayed\":[]},{\"id\":\"official_calm\",\"order\":3,\"label\":\"Взяти коментар міністерства і подати як «робочу ситуацію»\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":-5,\"traffic\":2,\"owner\":5,\"ethics\":-5},\"fxPoll\":-0.3,\"setFlags\":[],\"counters\":{},\"feedback\":\"Міністерство вдячне за спокійний тон. Мешканці гірничих містечок обурені: «У нас запасів на три тижні, а у вас це «робоча ситуація».\",\"delayed\":[]},{\"id\":\"skip\",\"order\":4,\"label\":\"Пропустити тему\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":-4,\"traffic\":-10,\"ethics\":-2},\"fxPoll\":0,\"setFlags\":[],\"counters\":{},\"feedback\":\"Тему розганяють інші видання. До вечора слово «регламент» стає мемом, а «Пульс» виявляється єдиною редакцією, яка «не помітила» зупинки.\",\"delayed\":[]}]},\"d3_witness\":{\"id\":\"d3_witness\",\"day\":3,\"order\":3,\"type\":\"news\",\"storyline\":\"campaign\",\"headline\":\"Підліток із Камінного, столиці Рудного Краю, розповів на камеру про розстріли цивільних у підвалах. Відео вже в топі «Digicard»\",\"body\":\"Хлопець років шістнадцяти тремтячим голосом розповідає страшні деталі: нібито він бачив, як солдати Бакії, країни, що окупувала Край під час війни, розстрілювали людей у підвалі школи. Відео зняте «волонтерським медіа», якого ніхто в редакції не знає. Ірма, репортерка родом із Краю, довго передивляється відео і каже: «Щось із цією школою не так. Якщо відпустите, я з'їжджу і перевірю». Але відео вже показали два телеканали. Тема болюча: того, хто сумнівається, одразу звинувачують у «виправданні ворога».\",\"truth\":\"fake\",\"revealText\":\"Розстрілів у тій школі не було, бо в будівлі немає підвалу. «Свідка» підготували заздалегідь, а відео зняв нікому не відомий продакшн. Вкид розрахований на найболючішу для країни тему.\",\"req\":null,\"checks\":{\"factcheck\":{\"reveal\":\"full\",\"text\":\"Соломія: «Відео зшите з трьох дублів, у «свідка» в зіницях відблиск суфлера. Продакшн ніде більше не згадується: акаунт створили під це одне відео».\"},\"reporter\":{\"reveal\":\"full\",\"text\":\"Ірма: «Я знаю цю школу, там плита на ґрунті. Підвалу немає і ніколи не було. Місцеві про «розстріли» чують уперше, і саме від журналістів».\"},\"source_call\":{\"reveal\":\"partial\",\"text\":\"Дитяча психологиня, подивившись відео: «Свідчення надто гладеньке, деталі кінематографічні. Але діти по-різному переживають травму, тому судити не берусь».\"}},\"options\":[{\"id\":\"publish_video\",\"order\":1,\"label\":\"Поставити відео: свідчення очевидця, країна має це бачити\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":5,\"traffic\":17,\"owner\":3,\"ethics\":-10},\"fxPoll\":-0.3,\"setFlags\":[\"spread_witness_video\"],\"counters\":{},\"feedback\":\"Трафік різко зростає, країна обурена. Ірма виходить з опенспейсу, грюкнувши дверима. Соломія каже: «Якщо це монтаж, то ми співавтори».\",\"delayed\":[{\"afterDays\":2,\"text\":\"Акаунт «волонтерського медіа» зник разом із відео про «розстріли в підвалах». Редакції, які встигли його розтиражувати, тепер не мають на що посилатися.\",\"fx\":{\"audience\":-8},\"fxPoll\":0,\"setFlags\":[]},{\"afterDays\":3,\"text\":\"Журналісти-розслідувачі знайшли «свідка розстрілів»: ним виявився підліток-актор з іншого міста. Продакшн-студія зникла, але замовник нікуди не подівся.\",\"fx\":{\"audience\":-12},\"fxPoll\":0,\"setFlags\":[]}]},{\"id\":\"publish_flagged\",\"order\":2,\"label\":\"Поставити з позначкою «не підтверджено, перевіряємо»\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"traffic\":11,\"owner\":2,\"ethics\":-6},\"fxPoll\":-0.2,\"setFlags\":[\"spread_witness_video\"],\"counters\":{},\"feedback\":\"Позначку «не підтверджено» ніхто не читає: скриншоти розлітаються без неї. У коментарях уже шукають «адреси причетних».\",\"delayed\":[{\"afterDays\":2,\"text\":\"Акаунт «волонтерського медіа» зник разом із відео про «розстріли в підвалах». Редакції, які встигли його розтиражувати, тепер не мають на що посилатися.\",\"fx\":{\"audience\":-5},\"fxPoll\":0,\"setFlags\":[]},{\"afterDays\":3,\"text\":\"Журналісти-розслідувачі знайшли «свідка розстрілів»: ним виявився підліток-актор з іншого міста. Продакшн-студія зникла, але замовник нікуди не подівся.\",\"fx\":{\"audience\":-8},\"fxPoll\":0,\"setFlags\":[]}]},{\"id\":\"debunk\",\"order\":3,\"label\":\"Опублікувати спростування: у тій школі немає підвалу\",\"reqTruthKnown\":true,\"req\":null,\"fx\":{\"audience\":10,\"traffic\":-4,\"owner\":-3,\"ethics\":10},\"fxPoll\":0.2,\"setFlags\":[\"debunked_witness\"],\"counters\":{},\"feedback\":\"Спростування іде проти емоцій більшості читачів. У редакційній пошті з'являються погрози, але три редакції передруковують ваш розбір.\",\"delayed\":[]},{\"id\":\"refuse\",\"order\":4,\"label\":\"Не ставити: без підтвердження не виходимо, якою б болючою не була тема\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":-5,\"traffic\":-8,\"ethics\":4},\"fxPoll\":0,\"setFlags\":[],\"counters\":{},\"feedback\":\"Два телеканали крутять відео весь день, а вам пишуть «продались Бакії». Ірма мовчки ставить перед вами чай і каже: «Правильно зробили».\",\"delayed\":[]}]},\"d3_vets_camp\":{\"id\":\"d3_vets_camp\",\"day\":3,\"order\":4,\"type\":\"story\",\"storyline\":\"veterans\",\"headline\":\"Ветерани війни за Рудний Край поставили намети під парламентом у Білій Вежі: «Нам обіцяли землю. Де вона?»\",\"body\":\"Кількасот ветеранів, дехто з родинами, розбили табір на площі перед парламентом Соновії. Вимога проста: виконати закон про наділи землі в Краї, ухвалений ще під час війни з Бакією. Уряд каже, що землю роздадуть після розмінування. Ветерани відповідають, що іноземному консорціуму «Ортус» ділянки вже нарізали, а їм лишили міни. Прем'єр Крайц мовчить. Дана Рева, лідерка опозиційного «Шляху», приїхала до табору з термосом, і камери це зняли. Табір росте.\",\"truth\":\"true\",\"revealText\":\"Табір справжній, а вимоги законні: закон про наділи ухвалили ще під час війни і досі не виконали. Від висвітлення залежало, чи побачить це країна і чи наважиться уряд на розгін.\",\"req\":null,\"checks\":{\"factcheck\":{\"reveal\":\"full\",\"text\":\"Соломія: «Закон про наділи чинний, його ухвалили в розпал війни і не видали за ним жодного гектара. Вимоги табору юридично бездоганні».\"},\"reporter\":{\"reveal\":\"full\",\"text\":\"Ірма з площі: «Це не проплачена акція. Тут люди з дітьми і з бойовими нагородами, багато хто плаче. Списки вимог у мене. Розганяти їх буде соромно і страшно».\"},\"source_call\":{\"reveal\":\"partial\",\"text\":\"Знайомий в апараті парламенту: «Нагорі сподіваються, що люди самі розійдуться. Інших рішень поки немає».\"}},\"options\":[{\"id\":\"big_report\",\"order\":1,\"label\":\"Яскравий репортаж із табору: люди, їхні вимоги і коментар опозиції\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":10,\"traffic\":10,\"owner\":-6,\"ethics\":8},\"fxPoll\":0.4,\"setFlags\":[\"vets_frontpage\"],\"counters\":{},\"feedback\":\"Обличчя ветеранів тепер скрізь: площа в топі «Digicard», до наметів везуть їжу й теплі речі. Пресслужба уряду просить редакцію «не нагнітати».\",\"delayed\":[]},{\"id\":\"balanced\",\"order\":2,\"label\":\"Подати спокійно і врівноважено: новина про табір і позиція уряду про розмінування\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":3,\"traffic\":4,\"owner\":2},\"fxPoll\":0,\"setFlags\":[],\"counters\":{},\"feedback\":\"Матеріал вийшов коректним, але його мало хто помітив: новина про табір загубилася серед інших. Ірма нагадує: «Там кількасот людей».\",\"delayed\":[]},{\"id\":\"minister_interview\",\"order\":3,\"label\":\"«Зараз не до істерики»: надрукувати інтерв'ю з міністром, який показує мапу замінованих територій\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":-5,\"traffic\":3,\"owner\":6,\"ethics\":-6},\"fxPoll\":-0.3,\"setFlags\":[],\"counters\":{},\"feedback\":\"Мапа замінованих земель в інтерв'ю виглядає переконливо. Ветерани називають такі матеріали спробою заспокоїти суспільство. Уряд вдячний редакції.\",\"delayed\":[]},{\"id\":\"ignore\",\"order\":4,\"label\":\"Не висвітлювати: передвиборча акція, нам це не потрібно\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":-6,\"traffic\":-10,\"owner\":3,\"ethics\":-6},\"fxPoll\":0,\"setFlags\":[],\"counters\":{\"irma_shelved\":1},\"feedback\":\"Площа живе без вас: у «Digicard» табір цілий день у топі. Юрко дивується: «Ми що, єдині в країні, хто цього не бачить?»\",\"delayed\":[]}]},\"d4_memorandum\":{\"id\":\"d4_memorandum\",\"day\":4,\"order\":1,\"type\":\"story\",\"storyline\":\"veterans\",\"headline\":\"Уряд сів за стіл переговорів із ветеранами з табору під парламентом. «Історичну угоду про землю» обіцяють уже сьогодні ввечері\",\"body\":\"Після вчорашнього репортажу «Пульсу» уряд не ризикнув розганяти табір під камерами. Зранку до наметів приїхав міністр відбудови Петро Кесснер, і пресслужба вже анонсує «історичну угоду про землю». Ексклюзивний текст меморандуму пропонують саме вам «за конструктивну позицію». Ірма встигла лише мигцем побачити чернетку через плече ветерана і тепер сумнівається: формулювання здалися їй розмитими, але цитувати з пам'яті вона не береться. Табір вагається: одні пакують намети, інші кажуть, що їх купують порожніми обіцянками.\",\"truth\":\"half_true\",\"revealText\":\"Меморандум виявився порожнім папером: у ньому є «розглянути можливість», але немає жодної дати чи суми. Уряд купував тишу до виборів, а не забезпечував ветеранів обіцяним.\",\"req\":{\"flagsAll\":[\"vets_frontpage\"],\"flagsNone\":[]},\"checks\":{\"factcheck\":{\"reveal\":\"full\",\"text\":\"Соломія разом з юристкою: «Розглянути можливість» і «за наявності фінансування» юридично дорівнюють нулю зобов'язань. У тексті немає жодної дати, суми чи відповідального».\"},\"reporter\":{\"reveal\":\"partial\",\"text\":\"Ірма з табору: «Половина вірить і пакується, половина називає це «папірцем для камер». Старші мовчать: вони таке вже підписували».\"},\"source_call\":{\"reveal\":\"partial\",\"text\":\"Пресслужба міністерства: «Це історичний документ доброї волі». На питання про дати відповідають «уточнюється».\"}},\"options\":[{\"id\":\"sell_deal\",\"order\":1,\"label\":\"Опублікувати ексклюзив як є: «Уряд і ветерани домовились»\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":-5,\"traffic\":15,\"owner\":8,\"ethics\":-8},\"fxPoll\":-0.4,\"setFlags\":[\"sold_memorandum\"],\"counters\":{},\"feedback\":\"Заголовок про «історичну угоду» летить у топи, пресслужба уряду вдячна вам. Ірма мовчки кладе на стіл фото, на якому видно: намети пакують далеко не всі.\",\"delayed\":[{\"afterDays\":2,\"text\":\"Ветерани перечитали меморандум і не знайшли в ньому жодної дати чи суми. Табір повертається під парламент, і тепер серед плакатів є й такі, що згадують «Пульс».\",\"fx\":{\"audience\":-10},\"fxPoll\":0,\"setFlags\":[]}]},{\"id\":\"dissect\",\"order\":2,\"label\":\"Розібрати меморандум по пунктах: обіцянки без дат і грошей\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":10,\"traffic\":8,\"owner\":-6,\"ethics\":9},\"fxPoll\":0.3,\"setFlags\":[],\"counters\":{},\"feedback\":\"Розбір вийшов точним: «розглянути можливість» не означає «дати землю». Пресслужба ображена, зате табір поширює матеріал зі словами «хоч хтось прочитав документ».\",\"delayed\":[]},{\"id\":\"both_voices\",\"order\":3,\"label\":\"Опублікувати обидві позиції: уряд анонсує угоду, табір не вірить\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":5,\"traffic\":8,\"ethics\":3},\"fxPoll\":0,\"setFlags\":[],\"counters\":{},\"feedback\":\"Ви поставили поруч анонс уряду і недовіру табору. Уряд і табір однаково незадоволені матеріалом, зате жодна сторона не може закинути вам упередженість.\",\"delayed\":[]},{\"id\":\"protocol\",\"order\":4,\"label\":\"Коротка протокольна новина: переговори тривають\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":-3,\"traffic\":-4,\"owner\":2,\"ethics\":-2},\"fxPoll\":0,\"setFlags\":[],\"counters\":{},\"feedback\":\"Новина вийшла непомітною. Ексклюзив, від якого ви відмовилися, вранці надрукує «Молнія Online» без жодних запитань до уряду.\",\"delayed\":[]}]},\"d4_smear\":{\"id\":\"d4_smear\",\"day\":4,\"order\":1,\"type\":\"news\",\"storyline\":\"veterans\",\"headline\":\"Джерело в поліції: тиснява під парламентом почалася, «бо п'яні ветерани кинулися на кордон охорони»\",\"body\":\"Уночі табір ветеранів під парламентом Соновії розганяли. У тисняві травмовано людей, серед них жінка з дитиною. Ще до ранку перевірений роками контакт у поліції надсилає «внутрішнє зведення»: ветерани нібито були п'яні й напали першими, а «серед них були провокатори Бакії». На переможеного ворога тепер зручно списувати все. Контакт пропонує ексклюзив, документ, якого «ні в кого нема». Часу мало: за годину конкуренти вийдуть зі своєю версією.\",\"truth\":\"fake\",\"revealText\":\"«Зведення» виявилося прикриттям: ветерани не були п'яні, а кордон охорони рушив першим. Документ згодували редакціям, щоб перекласти вину на постраждалих.\",\"req\":{\"flagsAll\":[],\"flagsNone\":[\"vets_frontpage\"]},\"checks\":{\"factcheck\":{\"reveal\":\"partial\",\"text\":\"Соломія: «Бланк і підписи справжні, номер зведення існує. Але справжній бланк не означає правдивий зміст. З паперу цього не перевірити».\"},\"reporter\":{\"reveal\":\"full\",\"text\":\"Ірма з лікарні: «Опитала шістьох травмованих і зібрала відео очевидців з таймкодами. Кордон охорони рушив першим, і ніхто з ветеранів не був п'яний».\"},\"source_call\":{\"reveal\":\"full\",\"text\":\"Лікар швидкої, анонімно: «Ми брали кров у затриманих, алкоголю немає. Нас просили цього не коментувати».\"}},\"options\":[{\"id\":\"exclusive_smear\",\"order\":1,\"label\":\"Ексклюзив: «Офіційне зведення: хто насправді почав» (опублікувати злитий нам документ)\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":-10,\"traffic\":15,\"owner\":5,\"ethics\":-10},\"fxPoll\":-0.4,\"setFlags\":[\"published_smear\"],\"counters\":{},\"feedback\":\"Ексклюзив дістався вам, але разом із ним і гнів читачів: очевидці викладають відео, на яких усе відбувалося навпаки. Хештег «Пульс бреше» стає новим трендом.\",\"delayed\":[{\"afterDays\":1,\"text\":\"Адвокати ветеранів оприлюднили хронометраж ночі розгону: кордон охорони рушив першим. «Зведення», яке ви поставили, більше нічим не підтверджене.\",\"fx\":{\"audience\":-12},\"fxPoll\":0,\"setFlags\":[]}]},{\"id\":\"police_version\",\"order\":2,\"label\":\"Опублікувати зведення з позначкою «версія поліції» поруч з коментарями учасників\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":-4,\"traffic\":10,\"owner\":3,\"ethics\":-5},\"fxPoll\":-0.2,\"setFlags\":[],\"counters\":{},\"feedback\":\"Формально ви чисті. Однак «версія поліції» у верстці стоїть першою, і саме її скриншотять. Ветерани це запам'ятали.\",\"delayed\":[]},{\"id\":\"witnesses\",\"order\":3,\"label\":\"Відмовитися від зливу, вийти зі свідченнями очевидців\",\"reqTruthKnown\":true,\"req\":null,\"fx\":{\"audience\":11,\"traffic\":8,\"owner\":-8,\"ethics\":10},\"fxPoll\":0.4,\"setFlags\":[],\"counters\":{},\"feedback\":\"Ви вийшли зі свідченнями очевидців проти «зведення», яке поставили всі інші. Половина мережі на вашому боці, силовики проти вас. Контакт у поліції більше не пише.\",\"delayed\":[]},{\"id\":\"hold\",\"order\":4,\"label\":\"Притримати все до офіційного розслідування\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":-5,\"traffic\":-6,\"ethics\":-3},\"fxPoll\":0,\"setFlags\":[],\"counters\":{},\"feedback\":\"Поки ви мовчите, говорять інші: конкуренти пишуть про «п'яних ветеранів», пабліки про «криваве побоїще». До вечора ці версії витісняють свідчення очевидців.\",\"delayed\":[]}]},\"d4_pumps\":{\"id\":\"d4_pumps\",\"day\":4,\"order\":2,\"type\":\"news\",\"storyline\":\"\",\"headline\":\"«Чорні копачі» розмивають схили над затопленими шахтами Рудного Краю. Патрулі щоразу приїжджають на годину пізніше\",\"body\":\"Ірма привезла з Рудного Краю зйомку: десятки помп день і ніч миють породу з рідкісноземельними металами в закритій зоні, і техніка не ховається. Місцеві кажуть, що інспекція дзвонить копачам перед кожним виїздом. Руду скуповують перекупники «на сірий кордон», тобто в бік ворожої Бакії. У місцевих пабліках винних уже знайшли: «бакійські комерсанти забирають наші метали за безцінь». Про те, хто насправді прикриває схему, там не пише ніхто.\",\"truth\":\"true\",\"revealText\":\"Усе підтвердилося: копачі працюють у закритій зоні під прикриттям місцевої влади, а руда йде на сірий кордон. Про схему знали всі місцеві, але публічно її ніхто не називав.\",\"req\":null,\"checks\":{\"factcheck\":{\"reveal\":\"full\",\"text\":\"Соломія: «Реєстри дають чіткий доказ: три «фермерські» фірми кума і небожа голови районної префектури орендують саме ті схили. Оренду підписали одразу після його призначення».\"},\"reporter\":{\"reveal\":\"full\",\"text\":\"Ірма: «Маю додаткову зйомку з номерами техніки і накладними перекупників. Місцеві вперше говорять під запис».\"},\"source_call\":{\"reveal\":\"partial\",\"text\":\"Пресслужба поліції: «Реагуємо в межах повноважень». Графік патрулів назвати відмовляються, бо це «службова інформація».\"}},\"options\":[{\"id\":\"names\",\"order\":1,\"label\":\"Розслідування з іменами тих, хто прикриває схему\",\"reqTruthKnown\":true,\"req\":null,\"fx\":{\"audience\":11,\"traffic\":10,\"owner\":-5,\"ethics\":9},\"fxPoll\":0.3,\"setFlags\":[],\"counters\":{},\"feedback\":\"Родичі голови префектури і їхні «фермерські» фірми тепер названі публічно. Районна префектура не коментує. Увечері Ірмі дзвонять з погрозами. Вона каже, що не вперше.\",\"delayed\":[]},{\"id\":\"phenomenon\",\"order\":2,\"label\":\"Репортаж про копачів як явище, без прізвищ\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":5,\"traffic\":6,\"ethics\":2},\"fxPoll\":0,\"setFlags\":[],\"counters\":{},\"feedback\":\"Вийшло обережно, але помітно: тему підхопили інші видання. Щоправда, покровителі схеми так і лишилися безіменними, тому організаторам нічого не загрожує.\",\"delayed\":[]},{\"id\":\"police_comment\",\"order\":3,\"label\":\"Взяти в поліції коментар про «посилення контролю» і закрити тему\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":-4,\"owner\":3,\"ethics\":-5},\"fxPoll\":0,\"setFlags\":[],\"counters\":{\"irma_shelved\":1},\"feedback\":\"Поліція пообіцяла «посилити контроль». Місцеві в коментарях сміються, що про посилення копачам розкажуть заздалегідь.\",\"delayed\":[]},{\"id\":\"hold\",\"order\":4,\"label\":\"Притримати: без відповіді районної префектури не виходимо\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"traffic\":-5,\"owner\":2,\"ethics\":-3},\"fxPoll\":0,\"setFlags\":[],\"counters\":{\"irma_shelved\":1},\"feedback\":\"Префектура відповість на запит «у встановлений термін», тобто вже після виборів. Зйомка Ірми тим часом старіє в сейфі.\",\"delayed\":[]}]},\"d4_tranche\":{\"id\":\"d4_tranche\",\"day\":4,\"order\":3,\"type\":\"story\",\"storyline\":\"tranche\",\"headline\":\"Зі 180 мільйонів траншу Союзу на відбудову Рудного Краю до підрядників дійшло 96. Де решта?\",\"body\":\"Джерело в казначействі передало розпис руху коштів першого траншу Першого оборонного союзу на відбудову зруйнованого війною Краю: майже половина грошей «зависла» на рахунках трьох посередницьких структур, створених за місяць до тендера. Одна зареєстрована на адресу перукарні в Білій Вежі. Документ виглядає справжнім, але другого підтвердження немає. Міністр відбудови Петро Кесснер сьогодні якраз звітує в парламенті про «прозорість як ніколи».\",\"truth\":\"true\",\"revealText\":\"Розпис справжній: половина траншу справді осіла на трьох посередницьких фірмах, і одна з них зареєстрована за адресою перукарні. Але публікувати на основі одного непідтвердженого джерела – ризик.\",\"req\":null,\"checks\":{\"factcheck\":{\"reveal\":\"partial\",\"text\":\"Соломія: «Печатки, коди платежів, формат – усе схоже на справжнє. Але це копія, і підтвердити оригінал без другого джерела неможливо».\"},\"reporter\":{\"reveal\":\"partial\",\"text\":\"Ірма з адреси «перукарні»: «Жодного офісу тут немає, лише звичайна перукарня і здивована майстриня. Фірма з мільйонними оборотами тут ніколи не працювала».\"},\"source_call\":{\"reveal\":\"full\",\"text\":\"Друге джерело в казначействі, неохоче: «Так, ці три рахунки існують, рух за ними заморожений «до з'ясування». Ви цього від мене не чули».\"}},\"options\":[{\"id\":\"publish_now\",\"order\":1,\"label\":\"Публікувати сьогодні, під виступ Кесснера\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":10,\"traffic\":14,\"owner\":-8,\"ethics\":5},\"fxPoll\":0.6,\"setFlags\":[\"published_tranche\"],\"counters\":{},\"feedback\":\"Кесснер на трибуні саме вимовляє слово «прозорість», коли зала починає гортати ваш матеріал. Публікація стає головною новиною вечора, а юристи Кесснера готують позов.\",\"delayed\":[{\"afterDays\":1,\"text\":\"Кесснер назвав ваш розпис «фальшивкою ворогів відбудови» і пообіцяв «юридичну відповідь». Джерело в казначействі мовчить другий день.\",\"fx\":{\"owner\":-4},\"fxPoll\":0,\"setFlags\":[]},{\"afterDays\":4,\"text\":\"До редакції завітав «представник благодійників» із пропозицією гранта на відновлення офісу – за єдиної умови «зваженіше писати про відбудову». Ви попросили лишити візитівку. Візитівки в нього не виявилося.\",\"fx\":{},\"fxPoll\":0,\"setFlags\":[]}]},{\"id\":\"hold\",\"order\":2,\"label\":\"Притримати: одного джерела без підтвердження недостатньо для публікації\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"traffic\":-5,\"owner\":2,\"ethics\":2},\"fxPoll\":0,\"setFlags\":[],\"counters\":{},\"feedback\":\"Джерело в казначействі розчароване: «Я думав, вам це потрібно». Документ лишається в редакції без руху.\",\"delayed\":[]},{\"id\":\"public_question\",\"order\":3,\"label\":\"Поставити Кесснеру питання на брифінгу публічно і чекати реакції\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":6,\"traffic\":6,\"owner\":-3,\"ethics\":4},\"fxPoll\":0.3,\"setFlags\":[],\"counters\":{},\"feedback\":\"Питання пролунало публічно: Кесснер зблід і пообіцяв «перевірити». Сам документ ви не показували, тому він лишається у вас як резерв.\",\"delayed\":[]},{\"id\":\"auditors\",\"order\":4,\"label\":\"Передати документи аудиторам Союзу і чекати\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"traffic\":-4,\"owner\":3,\"ethics\":3},\"fxPoll\":0,\"setFlags\":[],\"counters\":{},\"feedback\":\"Аудитори Союзу підтвердили, що отримали документи. Далі тиша, бо розгляд у Союзі триває місяцями.\",\"delayed\":[]}]},\"d4_payments\":{\"id\":\"d4_payments\",\"day\":4,\"order\":4,\"type\":\"story\",\"storyline\":\"campaign\",\"headline\":\"Анонім із виборчого органу повідомляє: «Стихійні» мітинги проти опозиції оплачують три фірми. Більше нічого не скажу»\",\"body\":\"Після опівночі дзвонить невідомий номер. Людина, що представилась працівником апарату Центрального виборчого органу Соновії, каже: «Мітинги «обурених громадян» проти Дани Реви та її партії «Шлях» не стихійні. Подивіться на платежі за сцену, автобуси і наліпки: за все платять три фірми. Далі шукайте самі». І кладе слухавку, не назвавши ані імен, ані документів. Соломія за ніч знаходить перший слід: сцену на останньому мітингу справді орендувала фірма, зареєстрована лише два місяці тому.\",\"truth\":\"true\",\"revealText\":\"Дзвінок не був розіграшем: «стихійні» мітинги справді оплачують три фірми-одноденки. Це перший слід ланцюга платежів, який ще повернеться в наступні дні.\",\"req\":null,\"checks\":{\"factcheck\":{\"reveal\":\"full\",\"text\":\"Соломія: «Знайшла другу фірму: та сама схема, реєстрація два місяці тому і один спільний бухгалтер. Двічі поспіль такі збіги не трапляються, хтось працює за шаблоном».\"},\"reporter\":{\"reveal\":\"partial\",\"text\":\"Ірма з мітингу «обурених»: «Людям платять готівкою після акції, це кажуть двоє. Під запис не скаже ніхто».\"},\"source_call\":{\"reveal\":\"partial\",\"text\":\"Номер, з якого дзвонили вночі, вимкнений. Виборчий орган на офіційний запит відповідає, що «інформація не відповідає дійсності».\"}},\"options\":[{\"id\":\"publish_source\",\"order\":1,\"label\":\"Опублікувати «за словами джерела у виборчому органі» вже зараз\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":-5,\"traffic\":10,\"owner\":-3,\"ethics\":-5},\"fxPoll\":0.3,\"setFlags\":[],\"counters\":{},\"feedback\":\"Вийшло гучно, але без доказів: виборчий орган усе заперечує, вас називають панікерами. Замовники мітингів тим часом просто поміняють фірми.\",\"delayed\":[]},{\"id\":\"safe_keep\",\"order\":2,\"label\":\"Мовчати і зберегти наводку в сейфі, щоб не сполохати замовників\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"traffic\":-3,\"ethics\":3},\"fxPoll\":0,\"setFlags\":[\"payments_lead_kept\"],\"counters\":{},\"feedback\":\"Соломія за ніч знаходить другу фірму з тих трьох. Ланцюжок платежів довшає, і замовники поки не знають, що за ними стежать.\",\"delayed\":[]},{\"id\":\"verified_only\",\"order\":3,\"label\":\"Опублікувати лише перевірене: сцену орендувала фірма-одноденка\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":6,\"traffic\":5,\"owner\":-2,\"ethics\":5},\"fxPoll\":0.2,\"setFlags\":[\"payments_lead_kept\"],\"counters\":{},\"feedback\":\"Ви завдали точкового удару: новина про фірму-одноденку, яка орендувала сцену, вийшла бездоганно доведеною. Але мало хто зрозумів, що за цією фірмою стоїть ширша схема.\",\"delayed\":[]},{\"id\":\"give_agency\",\"order\":4,\"label\":\"Злити наводку дружньому розслідувальному агентству\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"traffic\":-4,\"ethics\":2},\"fxPoll\":0,\"setFlags\":[],\"counters\":{},\"feedback\":\"Агентство дякує за наводку і зникає в роботі. Якщо розслідування вистрелить, тріумф буде їхнім.\",\"delayed\":[]}]},\"d5_dam_letters\":{\"id\":\"d5_dam_letters\",\"day\":5,\"order\":1,\"type\":\"news\",\"storyline\":\"dam\",\"headline\":\"Злиті листи: будінспекція мала сумніви щодо дамби водосховища у Рудному Краї, але все одно підписала сертифікат безпеки\",\"body\":\"Ексінженер будінспекції передав внутрішнє листування: за тиждень до видачі сертифіката безпеки колеги пишуть одне одному і-мейли про «незадовільний дренаж» і «тиск замовника на терміни». Сертифікат при цьому підписаний. Дамба стоїть над робочим селищем у Краї: під нею їдальня, де щодня обідає зміна. Адміністрація дамби відповідає редакції: «листування вирване з контексту, об'єкт безпечний». Синоптики обіцяють дощі вже завтра.\",\"truth\":\"true\",\"revealText\":\"Листи справжні, дренаж справді в аварійному стані, а дощі вже зовсім близько. Якщо роботи на дамбі не зупинити, прорив станеться за кілька днів.\",\"req\":null,\"checks\":{\"factcheck\":{\"reveal\":\"full\",\"text\":\"Соломія: «Метадані чисті, імена й внутрішні номери протоколів збігаються зі службовим реєстром будінспекції. Такі деталі неможливо вигадати. Листування справжнє».\"},\"reporter\":{\"reveal\":\"full\",\"text\":\"Ірма з-під дамби: «Дренажні канави забиті намулом, по нижньому схилу вже сочиться вода. Їдальня працює, зміна обідає. Фото я надіслала в редакцію».\"},\"source_call\":{\"reveal\":\"partial\",\"text\":\"Незалежний гідротехнік: «Проблеми з дренажем типові для таких дамб, а дощі стають головним ризиком. Але чи справжні ваші листи і чи впаде саме ця дамба, по телефону не скажу».\"}},\"options\":[{\"id\":\"publish_now\",\"order\":1,\"label\":\"Публікувати листи негайно, хай зупиняють роботу і перевіряють\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":10,\"traffic\":12,\"owner\":-10,\"ethics\":10},\"fxPoll\":0.4,\"setFlags\":[\"dam_published\"],\"counters\":{},\"feedback\":\"Ірма каже: «Нарешті хтось сказав уголос». Адміністрація дамби погрожує позовом, але роботи зупинено до перевірки.\",\"delayed\":[{\"afterDays\":1,\"text\":\"Роботи біля дамби зупинено, прокуратура вилучила документи будінспекції. Дощі вже почалися, але дамбу перевіряють.\",\"fx\":{},\"fxPoll\":0,\"setFlags\":[]}]},{\"id\":\"careful\",\"order\":2,\"label\":\"Поставити обережний матеріал: «В інспекції були сумніви». Без сканів, із закликом перевірити дамбу\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":4,\"traffic\":5,\"owner\":-4,\"ethics\":4},\"fxPoll\":0.2,\"setFlags\":[],\"counters\":{},\"feedback\":\"Соломія оцінює: «М'яко, але чесно». Люди з селища самі поїхали оглядати дренаж. Скани листів лишаються в редакції.\",\"delayed\":[]},{\"id\":\"prosecutor\",\"order\":3,\"label\":\"Тихо передати документи прокуратурі без публікації\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"traffic\":-4,\"owner\":3,\"ethics\":2},\"fxPoll\":0,\"setFlags\":[\"dam_handover\"],\"counters\":{},\"feedback\":\"Прокуратура підтвердила отримання. Ірма питає, чи не відкладуть документи без розгляду, як торік.\",\"delayed\":[{\"afterDays\":2,\"text\":\"Із прокуратури щодо дамби відповіді немає. Дощі не вщухають, і Ірма питає, чи не час діставати з сейфа копії листів.\",\"fx\":{},\"fxPoll\":0,\"setFlags\":[]},{\"afterDays\":3,\"text\":\"Уночі дамба над робочим селищем не витримала дощів. Людей встигли евакуювати, але селище затоплене, двоє робітників у лікарні. Прокуратура, якій ви передали листи, так і не встигла відкрити провадження.\",\"fx\":{\"ethics\":-8},\"fxPoll\":0,\"setFlags\":[\"dam_broke\"]}]},{\"id\":\"system_piece\",\"order\":4,\"label\":\"Матеріал «про систему сертифікації» без назв і без дамби\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":-3,\"traffic\":-3,\"owner\":4,\"ethics\":-5},\"fxPoll\":0,\"setFlags\":[],\"counters\":{\"irma_shelved\":1},\"feedback\":\"Юрко каже, що матеріал «про систему» майже ніхто не прочитав. Соломія мовчить довше, ніж зазвичай.\",\"delayed\":[{\"afterDays\":3,\"text\":\"Уночі дамба над робочим селищем не витримала дощів. Людей встигли евакуювати, але селище затоплене, двоє робітників у лікарні. Листи будінспекції досі лежать у вашому сейфі.\",\"fx\":{\"ethics\":-12},\"fxPoll\":0,\"setFlags\":[\"dam_broke\"]}]}]},\"d5_permit_pendulum\":{\"id\":\"d5_permit_pendulum\",\"day\":5,\"order\":2,\"type\":\"news\",\"storyline\":\"\",\"headline\":\"Уряд під тиском протестів зупинив розширення видобувного кар'єру корпорації «Ортус». Через три дні суд усе повернув\",\"body\":\"Тисячі людей з навколишніх містечок три дні стояли перед регіональною префектурою. Після протесту уряд гучно «призупинив» дозвіл на розширення кар'єру. Сьогодні апеляційний суд поновив дозвіл «через процедурні порушення при скасуванні». Суддя є однокурсником юриста Крамара, олігарха і власника «Пульсу», і це знає вся столиця. Протестувальники кажуть «нас обдурили», а «Ортус» коментує, що «верховенство права перемогло». Провладні канали тим часом запустили третю версію: протести під префектурою «розхитує Бакія», якій вигідно зірвати угоду.\",\"truth\":\"half_true\",\"revealText\":\"Обидва факти правдиві. Рішення суду законне за формою, але колегію підбирали вручну, і суддя пов'язаний із юристами вашого власника.\",\"req\":null,\"checks\":{\"factcheck\":{\"reveal\":\"full\",\"text\":\"Соломія: «Рішення законне за формою, скасування справді було кострубате. А ще торік суддя їздив на конференцію коштом фонду, який обслуговує юристів Крамара. Забагато збігів».\"},\"reporter\":{\"reveal\":\"partial\",\"text\":\"Ірма з-під регіональної префектури: «Це не масовка, люди справді бояться за воду й городи. Є ще одна деталь: юрист «Ортуса» виходив із суду через чорний хід, і я це зняла».\"},\"source_call\":{\"reveal\":\"partial\",\"text\":\"Суддя у відставці по телефону: «Формально апеляція має рацію. Але саме ця колегія і саме за три дні означає, що хтось дуже поспішав».\"}},\"options\":[{\"id\":\"side_protest\",\"order\":1,\"label\":\"«Обурливе рішення»: стати на бік протесту редакційно\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":9,\"traffic\":10,\"owner\":-14,\"ethics\":2},\"fxPoll\":0.4,\"setFlags\":[],\"counters\":{},\"feedback\":\"Коментарі палають, протестувальники поширюють матеріал. Пресслужба «Ортуса» вимагає спростування. Власник «Пульсу» і ваш начальник Крамар поки мовчить.\",\"delayed\":[]},{\"id\":\"legal_frame\",\"order\":2,\"label\":\"«Верховенство права»: опублікувати юридичну рамку без емоцій\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":-3,\"traffic\":3,\"owner\":6,\"ethics\":-3},\"fxPoll\":-0.2,\"setFlags\":[],\"counters\":{\"kramar_obeyed\":1},\"feedback\":\"Юристи задоволені, а читачі пишуть «і ці продались». Юрко знизує плечима: «Суха юридична мова, жодних емоцій».\",\"delayed\":[]},{\"id\":\"name_judge\",\"order\":3,\"label\":\"Нагадати, хто суддя: однокурсник юриста Крамара. Це головна новина\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":10,\"traffic\":11,\"owner\":-15,\"ethics\":8},\"fxPoll\":0.2,\"setFlags\":[\"named_kramar_judge\"],\"counters\":{},\"feedback\":\"В опенспейсі стає тихо. Юрко питає пошепки: «Ми щойно вийшли проти начальства?» Телефон вібрує: на екрані напис «КРАМАР».\",\"delayed\":[{\"afterDays\":1,\"text\":\"Юристи Крамара запросили редактора на «зустріч щодо редакційних стандартів». Усі в редакції розуміють, що це не про стандарти.\",\"fx\":{\"owner\":-4},\"fxPoll\":0,\"setFlags\":[]}]},{\"id\":\"balanced\",\"order\":4,\"label\":\"Розповісти збалансовано, щоб читач зробив висновок сам\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":3,\"traffic\":4,\"ethics\":-2},\"fxPoll\":0,\"setFlags\":[],\"counters\":{},\"feedback\":\"Обидва штаби незадоволені матеріалом. Топ-коментар під текстом питає: «А чому не написали, чий однокурсник суддя?»\",\"delayed\":[]}]},\"d5_marshal_archive\":{\"id\":\"d5_marshal_archive\",\"day\":5,\"order\":3,\"type\":\"pressure\",\"storyline\":\"\",\"headline\":\"Крамар знайшов сенсацію, «таємні щоденники» фельдмаршала Чернеги, і хоче ексклюзив уже сьогодні\",\"body\":\"Власник «Пульсу» викликає особисто: колекціонер продає «щоденники» маршала Чернеги, головнокомандувача армії Соновії у війні за Край, національного героя, що помер торік. У відсканованих файлах містяться записи про зраду в генштабі й «реальну ціну» перемоги. Крамар уже бачить заголовки і каже, що таблоїд «Молнія Online» дає за них удвічі більше. Запрошений оцінщик обережний: каже, що папір «схожий на автентичний», але чорнило і почерк він радить перевірити, а це два тижні. Стільки часу у вас немає.\",\"truth\":\"fake\",\"revealText\":\"«Щоденники» виявилися підробкою на справжньому папері: дати не збігаються з хронікою війни, а після поранення Чернега не писав від руки, лише диктував. Підробку хтось виготовив спеціально на продаж, а замовник невідомий.\",\"req\":null,\"checks\":{\"factcheck\":{\"reveal\":\"partial\",\"text\":\"Соломія: «Папір того часу, почерк схожий. Але дві дати нарад не збігаються з офіційною хронікою. Щоб довести підробку чорнила, потрібні тижні, яких у нас немає».\"},\"reporter\":{\"reveal\":\"full\",\"text\":\"Ірма: «Колекціонер плутається в поясненнях: каже «від родини», а родина маршала чує про щоденники вперше. Слід веде до галереї, яку вже ловили на «воєнних реліквіях».\"},\"source_call\":{\"reveal\":\"full\",\"text\":\"Ад'ютант маршала: «У ті дати він був на південному фронті, а не в столиці. І після поранення він не писав від руки, лише диктував. Це не його щоденники».\"}},\"options\":[{\"id\":\"publish_owner\",\"order\":1,\"label\":\"Публікувати, як хоче власник\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":-6,\"traffic\":15,\"owner\":12,\"ethics\":-10},\"fxPoll\":0.3,\"setFlags\":[\"published_marshal_fake\"],\"counters\":{\"kramar_obeyed\":1},\"feedback\":\"Крамар задоволено: «Так треба працювати». Соломія попереджає, що напише заяву про звільнення, якщо таке повториться.\",\"delayed\":[{\"afterDays\":2,\"text\":\"Військові історики завершили розбір «щоденників Чернеги» і назвали їх підробкою: дати не збігаються з хронікою війни. Скриншоти публікації «Пульсу» тепер ілюструють кожен матеріал про фальшивку.\",\"fx\":{\"audience\":-15},\"fxPoll\":0,\"setFlags\":[]}]},{\"id\":\"refuse_kramar\",\"order\":2,\"label\":\"Відмовити Крамару: без повної експертизи жодних публікацій\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"owner\":-18,\"ethics\":10},\"fxPoll\":0,\"setFlags\":[\"refused_kramar_marshal\"],\"counters\":{},\"feedback\":\"Крамар довго мовчить у слухавку, каже «Я почув» і кладе слухавку. Юрко співчутливо приносить каву.\",\"delayed\":[]},{\"id\":\"publish_hedged\",\"order\":3,\"label\":\"Ставити на сайт з великим «автентичність перевіряється»\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":-4,\"traffic\":10,\"owner\":8,\"ethics\":-5},\"fxPoll\":0.2,\"setFlags\":[\"published_marshal_hedged\"],\"counters\":{},\"feedback\":\"Заголовок збирає перегляди, а плашка «автентичність перевіряється» губиться під третім абзацом, як завжди.\",\"delayed\":[{\"afterDays\":2,\"text\":\"Військові історики завершили розбір «щоденників Чернеги» і назвали їх підробкою: дати не збігаються з хронікою війни. Скриншоти публікації «Пульсу» тепер ілюструють кожен матеріал про фальшивку.\",\"fx\":{\"audience\":-10},\"fxPoll\":0,\"setFlags\":[]}]},{\"id\":\"leak_rival\",\"order\":4,\"label\":\"Тихо злити конкурентам, щоб ризикували вони\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"traffic\":-3,\"owner\":-8,\"ethics\":-6},\"fxPoll\":0,\"setFlags\":[\"leaked_marshal_rival\"],\"counters\":{},\"feedback\":\"За годину «Молнія Online» анонсує «сенсацію століття». Крамар дзвонить: «Чому вони, а не ми?»\",\"delayed\":[{\"afterDays\":1,\"text\":\"«Молнія Online» тоне у спростуваннях істориків: «щоденники Чернеги» виявилися підробкою. Крамар лютує: «Це мали бути наші перегляди».\",\"fx\":{\"owner\":-5},\"fxPoll\":0,\"setFlags\":[]}]}]},\"d5_star_exclusives\":{\"id\":\"d5_star_exclusives\",\"day\":5,\"order\":4,\"type\":\"news\",\"storyline\":\"\",\"headline\":\"Конкуренти публічно питають: звідки у зіркового автора «Пульсу» стенограми закритих нарад передвиборчого штабу прем'єр-міністра?\",\"body\":\"Три останні ексклюзиви вашого автора стали найпопулярнішими матеріалами в «Digicard»: у них були цитати із закритих нарад, подробиці і діалоги. Сьогодні ваш конкурент «Молнія Online» опублікував розбір сенсацій: у «стенограмі» нарада датована днем, коли прем'єр був за кордоном. Автор запевняє, що джерело існує, але розкрити його не може. Юрко просить не чіпати автора, бо його тексти дали третину трафіку редакції за останній місяць. Соломія мовчки кладе на стіл роздруківки з усіма розбіжностями.\",\"truth\":\"fake\",\"revealText\":\"Джерела не існує: автор домальовував деталі до реальних чуток. Третина вашого трафіку трималась на вигадці.\",\"req\":null,\"checks\":{\"factcheck\":{\"reveal\":\"full\",\"text\":\"Соломія: «Звірила три «стенограми» з відкритим графіком прем
