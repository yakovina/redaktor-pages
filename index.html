'єра: дві наради припадають на дні, коли він був за кордоном, одна – на неробочий для штабу день. Тексти писані заднім числом».\"},\"source_call\":{\"reveal\":\"partial\",\"text\":\"Автор запевняє, що джерело існує, але «на дзвінок воно не вийде». Знайомий у штабі Крайца додає: «Витоків такого рівня в нас не було. Або криза у нас, або у вас».\"}},\"options\":[{\"id\":\"defend_author\",\"order\":1,\"label\":\"Публічно стати на бік автора: «Це атака конкурентів»\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":-5,\"traffic\":6,\"owner\":5,\"ethics\":-8},\"fxPoll\":0,\"setFlags\":[\"defended_fake_author\"],\"counters\":{},\"feedback\":\"Автор розчулено дякує в загальному чаті. Соломія виходить з чату.\",\"delayed\":[{\"afterDays\":2,\"text\":\"Міжнародна мережа фактчекерів розібрала «стенограми» вашого зіркового автора і назвала їх вигадкою. Суперечка з таблоїдом переросла в питання до самого «Пульсу».\",\"fx\":{\"audience\":-18},\"fxPoll\":0,\"setFlags\":[]}]},{\"id\":\"suspend_quiet\",\"order\":2,\"label\":\"Тихо відсторонити автора без заяв, тексти поки лишити\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"traffic\":-5,\"owner\":-3,\"ethics\":3},\"fxPoll\":0,\"setFlags\":[],\"counters\":{},\"feedback\":\"Автор ображено пише заяву «за власним». Юрко дивиться на графік трафіку і мовчить.\",\"delayed\":[]},{\"id\":\"remove_quiet\",\"order\":3,\"label\":\"Непомітно зняти сумнівні тексти з сайту без заяв\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":-3,\"traffic\":-8,\"owner\":-2,\"ethics\":-3},\"fxPoll\":0,\"setFlags\":[],\"counters\":{},\"feedback\":\"Тексти зникли з сайту без пояснень. У «Digicard» уже поширюються скриншоти з питанням «а куди поділись ексклюзиви «Пульсу»?»\",\"delayed\":[{\"afterDays\":1,\"text\":\"Скриншоти зниклих «ексклюзивів» розлетілися по «Digicard» з підписом «Пульс» приховує сліди». Мовчання редакції виглядає як визнання провини.\",\"fx\":{\"audience\":-8},\"fxPoll\":0,\"setFlags\":[]}]},{\"id\":\"admit_public\",\"order\":4,\"label\":\"Визнати проблему публічно і відсторонити автора до перевірки\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":12,\"traffic\":-10,\"owner\":-6,\"ethics\":10},\"fxPoll\":0,\"setFlags\":[\"admitted_author_problem\"],\"counters\":{},\"feedback\":\"Це болючий удар по трафіку. Але вперше за день Соломія усміхається, а кілька редакцій пишуть вам: «Повага».\",\"delayed\":[]}]},\"d5_hope_list\":{\"id\":\"d5_hope_list\",\"day\":5,\"order\":5,\"type\":\"news\",\"storyline\":\"\",\"headline\":\"Редакції передали «список наступного обміну полоненими». Родини благають опублікувати\",\"body\":\"Біля входу в редакцію стоять три жінки з роздруківкою на 74 прізвища. Вони кажуть: «Нам передали список тих, кого Бакія обмінює наступними. Опублікуйте його, і тоді від обміну вже не відмовляться». Хто передав список, вони не кажуть, лише запевняють, що джерело надійне.\",\"truth\":\"fake\",\"revealText\":\"«Списку обміну» не існує: прізвища взяті з відкритих реєстрів зниклих. Схема стара: спершу людям дають надію, а потім просять гроші «за місце». Розголос працював на шахраїв.\",\"req\":null,\"checks\":{\"factcheck\":{\"reveal\":\"partial\",\"text\":\"Соломія: «Частина прізвищ справжня, вони є у відкритих реєстрах зниклих. Саме так такі схеми і працюють: беруть справжні імена і складають вигаданий список. Але це ще не доказ».\"},\"reporter\":{\"reveal\":\"partial\",\"text\":\"Ірма поговорила з родинами: «Посередника ніхто не бачив у очі, все йде через «знайому знайомої». Мати мого однокласника вірить кожному слову».\"},\"source_call\":{\"reveal\":\"full\",\"text\":\"Штаб у справах полонених: «Жодного «списку обміну» не існує. Це відома схема: далі у родин проситимуть гроші «за місце». Благаємо, не публікуйте».\"}},\"options\":[{\"id\":\"publish_list\",\"order\":1,\"label\":\"Опублікувати список: розголос захистить людей\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":5,\"traffic\":12,\"owner\":3,\"ethics\":-12},\"fxPoll\":0,\"setFlags\":[\"published_hope_list\"],\"counters\":{},\"feedback\":\"Список набирає пів мільйона переглядів за дві години. У приймальні жінки плачуть від надії. Соломія тихо каже: «Сподіваюсь, що я помиляюсь».\",\"delayed\":[{\"afterDays\":1,\"text\":\"Штаб у справах полонених офіційно заявив, що «списку обміну» не існує. У двох родин уже вимагали гроші «за місце», посилаючись на публікацію «Пульсу».\",\"fx\":{\"audience\":-18},\"fxPoll\":0,\"setFlags\":[]}]},{\"id\":\"publish_warning\",\"order\":2,\"label\":\"Опублікувати попередження про схему замість списку\",\"reqTruthKnown\":true,\"req\":null,\"fx\":{\"audience\":10,\"traffic\":8,\"ethics\":10},\"fxPoll\":0,\"setFlags\":[\"warned_hope_scheme\"],\"counters\":{},\"feedback\":\"Мати однокласника Ірми дякує крізь сльози: «Ми ледь не заплатили». Штаб у справах полонених публічно дякує редакції.\",\"delayed\":[{\"afterDays\":1,\"text\":\"«Посередник» зі списком зник після вашого попередження. Штаб публічно подякував редакції. Жінки з приймальні передали записку: «Пробачте. І дякуємо».\",\"fx\":{\"audience\":6},\"fxPoll\":0,\"setFlags\":[]}]},{\"id\":\"handover_hq\",\"order\":3,\"label\":\"Передати все штабу і поліції, родинам пояснити особисто\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":3,\"traffic\":-5,\"ethics\":6},\"fxPoll\":0,\"setFlags\":[],\"counters\":{},\"feedback\":\"Жінки йдуть мовчки. Ірма проводжає їх до дверей і потім довго стоїть у коридорі.\",\"delayed\":[]},{\"id\":\"publish_nothing\",\"order\":4,\"label\":\"Не публікувати нічого: будь-який розголос небезпечний для родин\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":-3,\"traffic\":-6,\"ethics\":2},\"fxPoll\":0,\"setFlags\":[],\"counters\":{},\"feedback\":\"Юрко мовчки закриває дашборд: головна тема дня пройшла повз редакцію. Жінки в приймальні ображені: «Вам просто байдуже».\",\"delayed\":[]}]},\"d6_white_river\":{\"id\":\"d6_white_river\",\"day\":6,\"order\":1,\"type\":\"news\",\"storyline\":\"\",\"headline\":\"Річка під Камінним побіліла за ніч. Цього разу це не монтаж\",\"body\":\"Фото приходять із трьох різних сіл: молочно-біла вода, мертва риба на берегах. Місцеві вказують на стару дамбу технічної води на закинутій збагачувальній фабриці, яка, за їхніми словами, не витримала дощів. Після фейків минулого тижня половина «Digicard» пише «знову вкид, не ведіться». Прессекретар «Ортуса» вже назвав фото «черговою інформаційною атакою Бакії».\",\"truth\":\"true\",\"revealText\":\"Цього разу все виявилося правдою: стара дамба технічної води не витримала дощів. Після тижня фейків у це мало хто повірив без перевірки.\",\"req\":null,\"checks\":{\"factcheck\":{\"reveal\":\"full\",\"text\":\"Соломія: «Фото з трьох сіл зняли різні люди, метадані незалежні, геолокація збігається. Це не монтаж і не «атака».\"},\"reporter\":{\"reveal\":\"full\",\"text\":\"Ірма з берега: «Стою в цій воді в чоботях. Пролом у дамбі фабрики видно неозброєним оком. Я взяла проби і надіслала фото в редакцію».\"},\"source_call\":{\"reveal\":\"partial\",\"text\":\"Гідролог: «Схоже на скид технічної води зі старого відстійника. Але точно скажу лише після лабораторії, днів за три».\"}},\"options\":[{\"id\":\"frontpage\",\"order\":1,\"label\":\"Головна сторінка: «Цього разу це правда. Ось докази»\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":11,\"traffic\":15,\"owner\":-4,\"ethics\":9},\"fxPoll\":0.3,\"setFlags\":[],\"counters\":{},\"feedback\":\"Головна сторінка працює: волонтери везуть людям воду, лабораторії їдуть по проби. «Ортус» повторює слово «атака», але вже без підтримки.\",\"delayed\":[]},{\"id\":\"careful\",\"order\":2,\"label\":\"Публікувати стримано: «вода побіліла, причини з'ясовуються», без висновків\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":3,\"traffic\":6,\"ethics\":2},\"fxPoll\":0.1,\"setFlags\":[],\"counters\":{},\"feedback\":\"Вийшло точно, але тихо. Поки ви «з'ясовуєте причини», у «Digicard» перемагає версія «знову вкид, не ведіться».\",\"delayed\":[]},{\"id\":\"both_sides\",\"order\":3,\"label\":\"Опублікувати фото і заперечення «Ортуса» поруч, без висновків\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":-4,\"traffic\":8,\"owner\":3,\"ethics\":-4},\"fxPoll\":0,\"setFlags\":[],\"counters\":{},\"feedback\":\"Вийшов формальний «баланс»: всю увагу забирають фотографії, а заперечення «Ортуса» губиться під ними. Коментатори питають: «То правда чи ні?»\",\"delayed\":[]},{\"id\":\"name_owners\",\"order\":4,\"label\":\"Назвати відповідальних: чия дамба і хто мав її обслуговувати\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":10,\"traffic\":10,\"owner\":-6,\"ethics\":8},\"fxPoll\":0.4,\"setFlags\":[],\"counters\":{},\"feedback\":\"Імена власників дамби названі в тексті. Їхні юристи вже пишуть претензію, а місцеві вже дякують. Ірма схвалює: «Так і треба».\",\"delayed\":[]}]},\"d6_report\":{\"id\":\"d6_report\",\"day\":6,\"order\":2,\"type\":\"news\",\"storyline\":\"\",\"headline\":\"Ексінженер хімічної корпорації, яка належить місцевому олігарху, приніс внутрішній звіт: норми по важких металах у ґрунтових водах перевищені роками\",\"body\":\"Чоловік передпенсійного віку кладе на стіл теку: внутрішній екологічний моніторинг за чотири роки. Перевищення стабільні, а ділянки саме ті, де компанія «щедро викуповувала землю за ринковою ціною». Він підписував ці заміри сам. Каже: «Мене звільнили за скороченням. Хай тепер пояснюють ці цифри». Юристи корпорації одні з найдорожчих у країні, а у вас лише один документ і одне ображене джерело.\",\"truth\":\"true\",\"revealText\":\"Звіт справжній: перевищення норм тривали роками, і компанія про це знала. Джерело виявилося надійним, попри особисту образу на компанію.\",\"req\":null,\"checks\":{\"factcheck\":{\"reveal\":\"full\",\"text\":\"Соломія: «Форми звітів, підписи й методика справжні, цифри внутрішньо узгоджені. Такий масив підробити неможливо. Це справжній моніторинг».\"},\"reporter\":{\"reveal\":\"partial\",\"text\":\"Ірма з викуплених ділянок: «Сади стоять сухі, люди скаржаться на воду роками. Прямого доказу це не дає, але картина сходиться».\"},\"source_call\":{\"reveal\":\"partial\",\"text\":\"Пресслужба корпорації: «Дані некоректні, колишній працівник зводить рахунки». Про власні заміри кажуть лише «комерційна таємниця».\"}},\"options\":[{\"id\":\"publish_asis\",\"order\":1,\"label\":\"Публікувати звіт як є: документ говорить сам за себе\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":9,\"traffic\":11,\"owner\":-5,\"ethics\":6},\"fxPoll\":0,\"setFlags\":[],\"counters\":{},\"feedback\":\"Документ викликає резонанс. Корпорація відповідає, що «звільнений за розкрадання зводить рахунки». Інженер поки тримається.\",\"delayed\":[{\"afterDays\":1,\"text\":\"Корпорація виконала обіцянку: у мережі з'явився «компромат» на вашого інженера. Його звинувачують у розкраданні, і він просить у редакції захисту.\",\"fx\":{\"audience\":-5},\"fxPoll\":0,\"setFlags\":[]}]},{\"id\":\"right_reply\",\"order\":2,\"label\":\"Опублікувати з правом на відповідь: звіт + відповідь корпорації на наш запит\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":10,\"traffic\":8,\"owner\":-3,\"ethics\":9},\"fxPoll\":0,\"setFlags\":[],\"counters\":{},\"feedback\":\"Ви поставили звіт і відповідь корпорації «дані некоректні» поруч. Юристам нема за що зачепитися, бо слово отримали всі.\",\"delayed\":[{\"afterDays\":1,\"text\":\"Корпорація виконала обіцянку: у мережі з'явився «компромат» на вашого інженера. Його звинувачують у розкраданні, і він просить у редакції захисту.\",\"fx\":{},\"fxPoll\":0,\"setFlags\":[]}]},{\"id\":\"hold\",\"order\":3,\"label\":\"Притримати: одного документа і одного ображеного джерела замало\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":-3,\"traffic\":-5,\"owner\":3,\"ethics\":-4},\"fxPoll\":0,\"setFlags\":[],\"counters\":{},\"feedback\":\"Інженер збирає теку назад: «Я думав, ви інші». Документи він забирає із собою, можливо, до конкурентів.\",\"delayed\":[]},{\"id\":\"refuse\",\"order\":4,\"label\":\"Відмовити інженеру: це справа для держінспекції, не для преси\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"traffic\":-4,\"owner\":2,\"ethics\":-3},\"fxPoll\":0,\"setFlags\":[],\"counters\":{},\"feedback\":\"Ви відправили його до держінспекції. Ірма наздоганяє його на сходах і «про всяк випадок» бере копію теки.\",\"delayed\":[]}]},\"d6_apartment\":{\"id\":\"d6_apartment\",\"day\":6,\"order\":3,\"type\":\"news\",\"storyline\":\"\",\"headline\":\"Родина повернулась у Камінне з евакуації, а в їхній квартирі четвертий рік живуть переселенці з прифронтового села\",\"body\":\"Обидві родини мають папери: в одних право власності, в інших ордер від військової канцелярії «на час бойових дій». Бойові дії скінчились, але третина житлового фонду Камінного лежить у руїнах, і відселяти людей нікуди. Під дверима квартири вже билися. Таких справ у Краї сотні, і суди уникають рішень по них. Міськрада не має рішення і чекає програму відбудови, тобто гроші Союзу, які надійдуть після угоди з консорціумом «Ортус».\",\"truth\":\"true\",\"revealText\":\"У цій історії немає винних: обидві родини мають законні папери, а держава четвертий рік не має рішення. Таких квартир у Краї сотні, і всі вони чекають «грошей Союзу».\",\"req\":null,\"checks\":{\"factcheck\":{\"reveal\":\"full\",\"text\":\"Соломія: «Право власності чинне, ордер військової канцелярії теж: закон про його припинення досі не ухвалили. Юридичний глухий кут».\"},\"reporter\":{\"reveal\":\"full\",\"text\":\"Ірма: «Обидві родини говорять на камеру, документи справжні в обох. Жодна сторона не порушила закон, а держава просто не вирішила, як їх розселити».\"},\"source_call\":{\"reveal\":\"partial\",\"text\":\"Міськрада Камінного: «Чекаємо програму відбудови». На питання, скільки таких квартир у місті, відповідають «облік триває».\"}},\"options\":[{\"id\":\"both_families\",\"order\":1,\"label\":\"Репортаж з обома родинами, без «правильної» сторони\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":10,\"traffic\":6,\"ethics\":8},\"fxPoll\":0.1,\"setFlags\":[],\"counters\":{},\"feedback\":\"Обидві родини вам дякують. У коментарях рідкісна картина: люди сперечаються без образ.\",\"delayed\":[{\"afterDays\":3,\"text\":\"Перший суд у справі квартири в Камінному відклали, але сталося інше: після вашого репортажу обидві родини прийшли на засідання разом і сіли поруч. Юристи кажуть, що це може стати прецедентом для сотень схожих справ.\",\"fx\":{\"audience\":5},\"fxPoll\":0,\"setFlags\":[]}]},{\"id\":\"blame_gov\",\"order\":2,\"label\":\"«Провал житлової політики»: бити по уряду\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":4,\"traffic\":10,\"owner\":-5,\"ethics\":-3},\"fxPoll\":0.4,\"setFlags\":[],\"counters\":{},\"feedback\":\"«Провал житлової політики» збирає перегляди. Щоправда, переселенці з ордером вийшли в тексті «проблемою», і їм це читати.\",\"delayed\":[]},{\"id\":\"owners_only\",\"order\":3,\"label\":\"Історія лише власників: право є право\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":-4,\"traffic\":8,\"ethics\":-5},\"fxPoll\":0,\"setFlags\":[],\"counters\":{},\"feedback\":\"Власники вдячні за позицію «право є право». Пабліки переселенців відповідають: «Пульс» пропонує викинути нас на вулицю».\",\"delayed\":[]},{\"id\":\"ignore\",\"order\":4,\"label\":\"Не чіпати: надто вибухово перед виборами\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":-3,\"traffic\":-10,\"owner\":2,\"ethics\":-4},\"fxPoll\":0,\"setFlags\":[],\"counters\":{\"irma_shelved\":1},\"feedback\":\"Ви промовчали. Конфлікт нікуди не зник: наступного тижня під тими дверима битимуться знову, уже з відео.\",\"delayed\":[{\"afterDays\":3,\"text\":\"Під дверима тієї квартири в Камінному знову билися – тепер із відео у «Digicard». Коментатори звинувачують то одну родину, то іншу, а контексту так ніхто й не пояснив.\",\"fx\":{\"audience\":-5},\"fxPoll\":0,\"setFlags\":[]}]}]},\"d6_sync_quote\":{\"id\":\"d6_sync_quote\",\"day\":6,\"order\":4,\"type\":\"news\",\"storyline\":\"campaign\",\"headline\":\"Три видання одночасно пишуть: «Комісар Союзу звинуватив Соновію у приховуванні воєнних злочинів». Знайти цитату в оригіналі поки не вдалося\",\"body\":\"Вранці «Молнія Online» і ще два сайти вийшли з ідентичною цитатою комісара Першого оборонного союзу, слово в слово і з однаковою помилкою в назві посади. Хвиля обурення вже піднялася: читачі пишуть, що союзники їх зраджують і приписують країні злочини. Прессекретар комісара недоступний. Синхронність трьох «незалежних» публікацій сама по собі є новиною.\",\"truth\":\"fake\",\"revealText\":\"Цитати не існує: в оригінальному відео комісар цього не казав. Три сайти отримали однакову заготовку з однаковою помилкою, а це означає координовану розсилку.\",\"req\":null,\"checks\":{\"factcheck\":{\"reveal\":\"full\",\"text\":\"Соломія: «Передивилась оригінальне звернення двічі: цитати там немає. У трьох публікаціях – однакова помилка в назві посади. Їм розіслали готовий текст».\"},\"source_call\":{\"reveal\":\"full\",\"text\":\"Редактор одного з трьох сайтів, пошепки: «Текст прийшов «згори» готовим, з проханням поставити о дев'ятій ранку. Я вам цього не казав».\"}},\"options\":[{\"id\":\"debunk\",\"order\":1,\"label\":\"Спростувати: ось відео, цитати не існує\",\"reqTruthKnown\":true,\"req\":null,\"fx\":{\"audience\":10,\"traffic\":5,\"ethics\":9},\"fxPoll\":-0.2,\"setFlags\":[\"debunked_sync_quote\"],\"counters\":{},\"feedback\":\"Спростування вийшло точним: ось оригінальне відео, і цитати в ньому немає. Хвиля обурення не спадає, але ваше спростування стає джерелом для інших редакцій.\",\"delayed\":[]},{\"id\":\"sync_story\",\"order\":2,\"label\":\"Зробити новиною саму синхронність: три сайти з однією помилкою\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":9,\"traffic\":9,\"owner\":-3,\"ethics\":6},\"fxPoll\":0,\"setFlags\":[],\"counters\":{},\"feedback\":\"Питання «хто розіслав заготовку?» стає новою темою дня. Три редакції відмовляються коментувати.\",\"delayed\":[]},{\"id\":\"reprint\",\"order\":3,\"label\":\"Передрукувати «за повідомленнями ЗМІ», усі ж поставили вже\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":-9,\"traffic\":10,\"ethics\":-9},\"fxPoll\":0.3,\"setFlags\":[],\"counters\":{},\"feedback\":\"Передрук «за повідомленнями ЗМІ» не знімає з вас відповідальності. Увечері комісар усе спростує, і ви опинитеся в списку тих, хто розганяв.\",\"delayed\":[{\"afterDays\":1,\"text\":\"Комісар Союзу офіційно спростував «цитату». Видання, які поставили її «за повідомленнями ЗМІ», потрапили до списку розповсюджувачів фейку, і «Пульс» серед них.\",\"fx\":{\"audience\":-10},\"fxPoll\":0,\"setFlags\":[]}]},{\"id\":\"wait\",\"order\":4,\"label\":\"Дочекатися офіційної реакції комісара\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"traffic\":-5},\"fxPoll\":0,\"setFlags\":[],\"counters\":{},\"feedback\":\"Комісар мовчить до вечора. Хвиля росте без вас, але й без вашого підпису. Соломія тим часом звіряє оригінальне відео.\",\"delayed\":[]}]},\"d6_two_bios\":{\"id\":\"d6_two_bios\",\"day\":6,\"order\":5,\"type\":\"news\",\"storyline\":\"\",\"headline\":\"Лідер громади переселенців іде в депутати. У Бакії його досі називають «нашим партнером воєнних часів»\",\"body\":\"Він організував повернення сотень родин у Край, а його табори перевалки допомоги працювали без збоїв. Водночас за всю війну його фірми жодного разу не обстріляли, і бакійська преса тоді писала про «прагматичного партнера по той бік». Прямих доказів колаборації немає, але є багато звинувачень. Його список іде на вибори у зв'язці з «Народним вибором», і переселенці його активно підтримують.\",\"truth\":\"half_true\",\"revealText\":\"Довоєнна торгівля його фірм із Бакією реальна, а доказів колаборації не існує. Єдина чесна відповідь тут звучить як «доказів немає», і саме її найважче подати як новину.\",\"req\":null,\"checks\":{\"factcheck\":{\"reveal\":\"partial\",\"text\":\"Соломія: «Публікації Бакії справжні, але це газетні тексти, а не документи. Торгівля була до війни і була легальною. Далі документів немає».\"},\"reporter\":{\"reveal\":\"partial\",\"text\":\"Ірма з таборів переселенців: «Люди його підтримують, він справді вивозив родини. Про «той бік» ніхто говорити не хоче».\"},\"source_call\":{\"reveal\":\"partial\",\"text\":\"Бакійський журналіст у відставці: «Його тут звали прагматиком. Чи він колаборант, не скажу: усі, хто торгував через кордон, були гнучкими».\"}},\"options\":[{\"id\":\"smoke\",\"order\":1,\"label\":\"Вийти з тим, що є: архіви Бакії і питання без відповідей\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":-4,\"traffic\":11,\"owner\":-3,\"ethics\":-6},\"fxPoll\":0.3,\"setFlags\":[],\"counters\":{},\"feedback\":\"Матеріал «багато диму» читається як вирок без суду. Штаб кандидата обіцяє позов, переселенці ображені, а конкуренти вдячно передруковують.\",\"delayed\":[{\"afterDays\":3,\"text\":\"На лідера переселенців вилили новий пакет «архівів», а на його критиків – симетричний контрпакет. Обидві сторони цитують ваш матеріал як першоджерело.\",\"fx\":{\"audience\":-3},\"fxPoll\":0,\"setFlags\":[]}]},{\"id\":\"portrait\",\"order\":2,\"label\":\"Опублікувати портрет з усіма «але» і правом на відповідь\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":9,\"traffic\":6,\"ethics\":8},\"fxPoll\":0,\"setFlags\":[],\"counters\":{},\"feedback\":\"Портрет вийшов з усіма «але» і з його різкою відповіддю, яка стала найцікавішою частиною тексту. Це чесно з усіх боків.\",\"delayed\":[]},{\"id\":\"program_only\",\"order\":3,\"label\":\"Написати лише про програму для переселенців, минуле не чіпати\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":2,\"traffic\":3,\"owner\":2,\"ethics\":-2},\"fxPoll\":-0.1,\"setFlags\":[],\"counters\":{},\"feedback\":\"Матеріал про програму добрий, але питання «хто він насправді» ви лишили іншим. Вони не будуть делікатними.\",\"delayed\":[]},{\"id\":\"leak_rival\",\"order\":4,\"label\":\"Злити зачіпки конкурентам: хай вони ризикують\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"traffic\":-3,\"ethics\":-4},\"fxPoll\":0,\"setFlags\":[],\"counters\":{},\"feedback\":\"Зачіпки поїхали до конкурентів. Якщо вони щось знайдуть, слава буде їхньою. Якщо історія виявиться помстою, увесь бруд теж дістанеться їм.\",\"delayed\":[]}]},\"d7_dam_blast\":{\"id\":\"d7_dam_blast\",\"day\":7,\"order\":1,\"type\":\"news\",\"storyline\":\"\",\"headline\":\"Уночі хтось підірвав греблю на Сірій, прикордонній річці між Соновією і Бакією. Села затоплені по обидва боки кордону, країни звинувачують одна одну\",\"body\":\"Вибух пролунав о четвертій ранку на ділянці, яку після перемир'я контролює міжнародна моніторингова місія. Саме цієї ночі камери спостереження місії «не працювали». Генштаб Соновії називає вибух бакійською диверсією, що має зірвати запуск копалень. Бакія відповідає, що «Соновія топить власних людей заради гучної історії перед виборами». Нижче за течією затоплено двадцять вулиць, люди чекають порятунку на дахах, і Ірма вже їде туди. Інженери кажуть, що можуть встановити, з якого боку заклали заряд, але така експертиза триває тижнями.\",\"truth\":\"half_true\",\"revealText\":\"Гребля справді була підірвана зсередини конструкції, а не зруйнована ударом іззовні. Хто заклав заряд, не з'ясовано досі: камери місії «не працювали», а експертиза триває довше, ніж лишалося до виборів.\",\"req\":null,\"checks\":{\"factcheck\":{\"reveal\":\"partial\",\"text\":\"Соломія: «За відео руйнувань видно напрямок вибуху, але якість зйомки погана. Однозначної атрибуції з цього не буде».\"},\"reporter\":{\"reveal\":\"partial\",\"text\":\"Ірма із затоплених вулиць: «Тут зараз не до версій: людей знімають із дахів. Місцеві кажуть, що вночі біля греблі не було ані наших, ані чужих патрулів».\"},\"source_call\":{\"reveal\":\"full\",\"text\":\"Військовий сапер у відставці, подивившись зйомку: «Заряд заклали в тіло греблі, зсередини конструкції. Це не удар іззовні. А хто мав туди доступ, це питання до місії».\"}},\"options\":[{\"id\":\"genstab_version\",\"order\":1,\"label\":\"Опублікувати версію нашого генштабу як основну\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":-5,\"traffic\":14,\"owner\":5,\"ethics\":-7},\"fxPoll\":-0.4,\"setFlags\":[],\"counters\":{},\"feedback\":\"Ви поставили версію генштабу як основну. Половина країни вам аплодує, а міжнародна місія «висловлює стурбованість поспішними висновками». Якщо експертиза покаже інше, змінити заголовок заднім числом не вийде.\",\"delayed\":[]},{\"id\":\"both_versions_rescue\",\"order\":2,\"label\":\"Обидві версії з акцентом на порятунку людей\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":8,\"traffic\":8,\"ethics\":6},\"fxPoll\":0,\"setFlags\":[],\"counters\":{},\"feedback\":\"Ви дали обидві версії і вивели наперед людей на дахах. Гарячі коментатори називають це «беззубістю», рятувальники мовчки поширюють ваші карти підтоплення.\",\"delayed\":[]},{\"id\":\"rescue_only\",\"order\":3,\"label\":\"Лише порятунок: карти підтоплення і контакти штабів, жодних версій\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":10,\"traffic\":-4,\"ethics\":10},\"fxPoll\":0,\"setFlags\":[],\"counters\":{},\"feedback\":\"Жодних версій, лише карти підтоплення і телефони штабів порятунку. Трафік скромний, зате волонтери координуються по вашому матеріалу. Ірма пише з місця: «Дякують».\",\"delayed\":[]},{\"id\":\"ask_mission\",\"order\":4,\"label\":\"Публічно спитати місію: чому вночі «не працювали» камери?\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":6,\"traffic\":6,\"owner\":-3,\"ethics\":5},\"fxPoll\":0.2,\"setFlags\":[],\"counters\":{},\"feedback\":\"Питання «чому не працювали камери?» пролунало голосно. Місія обіцяє «внутрішню перевірку», обидва штаби незадоволені, що ви зіпсували їм чисті версії.\",\"delayed\":[]}]},\"d7_institute\":{\"id\":\"d7_institute\",\"day\":7,\"order\":2,\"type\":\"news\",\"storyline\":\"\",\"headline\":\"Незалежний «Інститут гірничої екології», що заперечує шкоду від видобутку, фінансує сам «Ортус»\",\"body\":\"Щоразу, коли хтось пише про брудну воду чи пил від видобутку, в ефірах з'являється той самий «Інститут гірничої екології» з висновком «дані не остаточні, паніка передчасна». Соломія підняла реєстри і з'ясувала: інститут на дев'яносто відсотків живе з грантів фонду, який зареєстрували юристи «Ортуса». Той самий фонд оплачує «екологічну рубрику» в «Молнії Online». Є і незручна деталь: минулого року цей фонд спонсорував конференцію, на яку їздив Юрко.\",\"truth\":\"true\",\"revealText\":\"Все підтвердилося: «незалежний» інститут живе з грошей «Ортуса» і виготовляє потрібні висновки на замовлення. Конференція Юрка теж була частиною цієї схеми, хоч сам він про це не здогадувався.\",\"req\":null,\"checks\":{\"factcheck\":{\"reveal\":\"full\",\"text\":\"Соломія: «Дістала банківські проводки грантів: суми, дати, призначення платежів. Зв'язок інституту з «Ортусом» тепер доведений документально, з таким можна йти до суду».\"},\"reporter\":{\"reveal\":\"partial\",\"text\":\"Ірма з адреси інституту: «Тут дві кімнати, секретарка і жодної лабораторії. Уся «наукова установа» вміщається в одну шафу».\"},\"source_call\":{\"reveal\":\"partial\",\"text\":\"Директор інституту: «Ми абсолютно незалежні, а джерела фінансування не розголошуємо з етичних міркувань».\"}},\"options\":[{\"id\":\"expose_with_yurko\",\"order\":1,\"label\":\"Публікувати розслідування, включно з конференцією Юрка\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":12,\"traffic\":8,\"owner\":-6,\"ethics\":12},\"fxPoll\":0.4,\"setFlags\":[\"institute_exposed\"],\"counters\":{},\"feedback\":\"Розслідування вийшло повним, включно з конференцією Юрка. Він блідне, але каже: «Правильно. Інакше ми нічим не кращі за них». Читачі відзначають чесність про самих себе.\",\"delayed\":[]},{\"id\":\"expose_without_yurko\",\"order\":2,\"label\":\"Публікувати розслідування про інститут, про Юрка змовчати\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":8,\"traffic\":8,\"owner\":-4,\"ethics\":-4},\"fxPoll\":0.4,\"setFlags\":[\"institute_exposed\"],\"counters\":{},\"feedback\":\"Розслідування гримить, але в коментарях уже питають: «А ваш SMM-редактор туди не їздив?» Тепер питання про Юрка доведеться пояснювати окремо.\",\"delayed\":[]},{\"id\":\"director_interview\",\"order\":3,\"label\":\"Випустити інтерв'ю з директором інституту, без гострих питань\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":-8,\"traffic\":4,\"owner\":4,\"ethics\":-8},\"fxPoll\":-0.4,\"setFlags\":[],\"counters\":{},\"feedback\":\"Директор інституту в вашому ефірі звучить переконливо і спокійно. Соломія кладе роздруківки грантів на стіл і виходить. Інститут отримав ще одну трибуну.\",\"delayed\":[]},{\"id\":\"postpone\",\"order\":4,\"label\":\"Відкласти «до слушного моменту» після виборів\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":-4,\"traffic\":-4,\"owner\":4,\"ethics\":-6},\"fxPoll\":0,\"setFlags\":[],\"counters\":{\"kramar_obeyed\":1},\"feedback\":\"Тему відкладено «до слушного моменту». Слушний момент настане після виборів, коли вона вже нічого не змінить.\",\"delayed\":[]}]},\"d7_depot\":{\"id\":\"d7_depot\",\"day\":7,\"order\":3,\"type\":\"news\",\"storyline\":\"\",\"headline\":\"Вибух на військовому складі в Білій Вежі, столиці Соновії: у «Digicard» вже «знайшли» бакійських диверсантів\",\"body\":\"Пів міста чуло вибух на військовому складі, серед охорони є загиблі. Уже за годину мережа повна «інсайдів»: одні пишуть про диверсантів, інші про ракетний удар, третя версія стверджує, що війна почалася знову. Найстрашніші версії збирають найбільше репостів. Штаб оборони просить редакції «не сіяти паніку», але сам не називає жодної причини. Мовчання військових лише посилює чутки: що довше немає офіційної причини, то впевненіше мережа тримається своїх версій.\",\"truth\":\"true\",\"revealText\":\"Диверсії не було. Склад визнали аварійним ще торік, попередження проігнорували, а версію про «бакійський слід» запустили в мережу ще до того, як пожежу загасили.\",\"req\":null,\"checks\":{\"factcheck\":{\"reveal\":\"full\",\"text\":\"Соломія: «Джерело в держнагляді передало торішній акт: склад визнали аварійним, селітру зберігали з порушеннями, а лист із попередженням відправили керівництву, і там він зник».\"},\"reporter\":{\"reveal\":\"partial\",\"text\":\"Ірма з-під оточення: «Пожежники між собою говорять про стару селітру. Офіцери не коментують».\"},\"source_call\":{\"reveal\":\"partial\",\"text\":\"Військовий експерт: «На удар іззовні не схоже, немає характерної вирви. Але це моя приватна думка, не для запису».\"}},\"options\":[{\"id\":\"diversion_question\",\"order\":1,\"label\":\"Опублікувати мережеві версії з питанням «Диверсія?» у заголовку\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":-6,\"traffic\":16,\"owner\":2,\"ethics\":-8},\"fxPoll\":-0.4,\"setFlags\":[\"depot_diversion_hyped\"],\"counters\":{},\"feedback\":\"Заголовок із питанням зібрав рекордний трафік і подвоїв паніку. Штаб оборони офіційно просить редакції «не спекулювати на загиблих».\",\"delayed\":[{\"afterDays\":1,\"text\":\"Штаб оборони оприлюднив попередні висновки: вибух на складі стався через порушення зберігання. Заголовок «Диверсія?» тепер згадують як приклад паніки.\",\"fx\":{\"audience\":-8},\"fxPoll\":0,\"setFlags\":[]}]},{\"id\":\"wait_official\",\"order\":2,\"label\":\"Тримати паузу до офіційної причини\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":-3,\"traffic\":-6,\"owner\":2,\"ethics\":2},\"fxPoll\":0,\"setFlags\":[],\"counters\":{},\"feedback\":\"Ви мовчите до офіційної причини. Мережа тим часом «знає» все сама, і ваша стриманість виглядає як розгубленість.\",\"delayed\":[]},{\"id\":\"publish_act\",\"order\":3,\"label\":\"Публікувати акт: склад був аварійний, попередження ігнорували\",\"reqTruthKnown\":true,\"req\":null,\"fx\":{\"audience\":12,\"traffic\":10,\"owner\":-6,\"ethics\":10},\"fxPoll\":0.5,\"setFlags\":[\"depot_act_published\"],\"counters\":{},\"feedback\":\"Торішній акт держнагляду на вашій головній сторінці. Слово «диверсія» зникає з трендів за годину, натомість з'являються прізвища тих, хто поховав попередження.\",\"delayed\":[]},{\"id\":\"both_versions\",\"order\":4,\"label\":\"Опублікувати відкрито обидві версії, диверсію і недбалість, без вироку\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":6,\"traffic\":6,\"ethics\":6},\"fxPoll\":0,\"setFlags\":[],\"counters\":{},\"feedback\":\"Ви чесно тримаєте обидві версії відкритими. Це не збирає рекордів, але коли з'явиться офіційна причина, вам не доведеться нічого стирати.\",\"delayed\":[]}]},\"d7_tape\":{\"id\":\"d7_tape\",\"day\":7,\"order\":4,\"type\":\"news\",\"storyline\":\"\",\"headline\":\"Юристи Крамара вимагають вирізати з інтерв'ю інсайдера «Ортуса» шість хвилин, інакше «видання не переживе позову»\",\"body\":\"«Пульс» взяв інтерв'ю в менеджера спільного з «Ортусом» державного видобувного підприємства. На камеру він розповів, як на виробництві роками «оптимізували» звіти про відходи: цифри занижували, а про перевірки знали заздалегідь. Юристи Крамара переглянули чорновий монтаж і винесли вердикт: ключові шість хвилин треба вирізати, бо «прямі звинувачення без другого джерела – це позов на суму річного бюджету редакції». Крамар додає особисто: «У мене з ними незабаром угода. Опублікуєш після неї». Інсайдер дзвонить щогодини: «Ви ж мене не видасте?»\",\"truth\":\"true\",\"revealText\":\"Менеджер казав правду: звіти про відходи роками «оптимізували». Але і юристи не брехали: без другого джерела такий позов справді загрожував існуванню редакції.\",\"req\":null,\"checks\":{\"factcheck\":{\"reveal\":\"partial\",\"text\":\"Соломія: «Відкриті звіти підприємства підозріло гладенькі: жодного відхилення за чотири роки. Так не буває, але самі по собі гарні цифри ще не доказ».\"},\"source_call\":{\"reveal\":\"full\",\"text\":\"Ще один працівник спільного підприємства, анонімно: «Усе, що він розповів на камеру, правда. Звіти «малювали» щокварталу. Якщо треба, я підтверджу це вашим юристам».\"}},\"options\":[{\"id\":\"cut_version\",\"order\":1,\"label\":\"Вийти з вирізаною версією: краще щось, ніж нічого\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":-5,\"traffic\":6,\"owner\":6,\"ethics\":-6},\"fxPoll\":0,\"setFlags\":[],\"counters\":{\"kramar_obeyed\":1},\"feedback\":\"Інтерв'ю вийшло без шести ключових хвилин. Глядачі відчувають недоказаність, інсайдер дзвонить: «Це все, на що ви здатні?» Крамар задоволений.\",\"delayed\":[{\"afterDays\":1,\"text\":\"Вирізані шість хвилин інтерв'ю з'явилися на анонімному каналі. Питання «хто ще мав запис?» тепер ставлять вам.\",\"fx\":{\"audience\":-6},\"fxPoll\":0,\"setFlags\":[]}]},{\"id\":\"full_interview\",\"order\":2,\"label\":\"Відмовитись різати: або повністю, або ніяк. Виходимо з повним інтерв'ю\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":12,\"traffic\":12,\"owner\":-14,\"ethics\":12},\"fxPoll\":0.5,\"setFlags\":[\"published_full_interview\"],\"counters\":{},\"feedback\":\"Ви випустили все. Юристи «Ортуса» надсилають позов до вечора, Крамар не бере слухавку. Інсайдер пише одне слово: «Дякую».\",\"delayed\":[]},{\"id\":\"pressure_news\",\"order\":3,\"label\":\"Опублікувати сам факт тиску юристів як окрему новину\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":8,\"traffic\":8,\"owner\":-8,\"ethics\":6},\"fxPoll\":0,\"setFlags\":[],\"counters\":{},\"feedback\":\"Ви не вийшли з інтерв'ю, зате розповіли про тиск юристів. Тепер усі знають, що у вас щось є, і питання «що саме?» працює на вас.\",\"delayed\":[]},{\"id\":\"hold_all\",\"order\":4,\"label\":\"Притримати інтерв'ю повністю: не виходити, поки ризик такий\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":-4,\"traffic\":-6,\"owner\":4,\"ethics\":-6},\"fxPoll\":0,\"setFlags\":[],\"counters\":{\"kramar_obeyed\":1,\"irma_shelved\":1},\"feedback\":\"Інтерв'ю лягло в сейф. Інсайдер перестає дзвонити. Ірма питає, скільки ще матеріалів у тому сейфі поміститься.\",\"delayed\":[{\"afterDays\":1,\"text\":\"Вирізані шість хвилин інтерв'ю з'явилися на анонімному каналі. Питання «хто ще мав запис?» тепер ставлять вам.\",\"fx\":{\"audience\":-6},\"fxPoll\":0,\"setFlags\":[]}]}]},\"d7_meridian\":{\"id\":\"d7_meridian\",\"day\":7,\"order\":5,\"type\":\"news\",\"storyline\":\"\",\"headline\":\"Чверть воєнного боргу Соновії скупив приватний фонд. Тепер він вимагає розрахунку не грошима, а часткою родовищ\",\"body\":\"Поки країна стежила за переговорами з Союзом, закордонний спекулятивний фонд «Меридіан-Капітал» тихо викупив на вторинному ринку чверть боргових зобов'язань Соновії. Заплатив він за них третину від вартості. Тепер юристи фонду вимагають у закордонному суді «натуральної компенсації», тобто часток у родовищах Рудного Краю. Міністерство фінансів називає позов «юридично нікчемним обґрунтуванням». Три роки тому так само казав уряд однієї південної країни, а потім її літаки почали арештовувати в чужих аеропортах.\",\"truth\":\"true\",\"revealText\":\"Позов фонду реальний і небезпечний, прецеденти арештів активів існують. Питання «хто дозволив продати борг» так і залишилося без відповіді.\",\"req\":null,\"checks\":{\"factcheck\":{\"reveal\":\"full\",\"text\":\"Соломія: «Позов є у відкритому реєстрі закордонного суду: номер справи, вимоги, суми. Все, що заявляє фонд, задокументовано».\"},\"source_call\":{\"reveal\":\"partial\",\"text\":\"Юрист-міжнародник: «Шанси фонду реальні, прецеденти арештів активів були. Скільки це триватиме, не скаже ніхто: від місяців до десятиліття».\"}},\"options\":[{\"id\":\"explainer\",\"order\":1,\"label\":\"Пояснювальний матеріал: як працюють фонди-стерв'ятники\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":10,\"traffic\":8,\"ethics\":8},\"fxPoll\":0,\"setFlags\":[],\"counters\":{},\"feedback\":\"Ваш розбір про фонди-стерв'ятники читають навіть ті, хто ніколи не відкривав економічних новин. Складне стало зрозумілим, і читачі вперше усвідомлюють масштаб загрози.\",\"delayed\":[]},{\"id\":\"calm_minfin\",\"order\":2,\"label\":\"Опублікувати заспокійливий коментар мінфіну без деталей\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":-5,\"traffic\":2,\"owner\":4,\"ethics\":-5},\"fxPoll\":0,\"setFlags\":[\"calmed_meridian\"],\"counters\":{},\"feedback\":\"Мінфін вдячний за «виваженість». Через три дні, коли арештують перший вантаж, читачі згадають, хто їх заспокоював.\",\"delayed\":[]},{\"id\":\"warn_arrests\",\"order\":3,\"label\":\"Попередити: активи Соновії за кордоном під загрозою арешту\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":6,\"traffic\":10,\"owner\":-4,\"ethics\":4},\"fxPoll\":0,\"setFlags\":[],\"counters\":{},\"feedback\":\"Ви попередили про загрозу арештів прямим текстом. Мінфін звинувачує редакцію в «розхитуванні ринку», банкіри мовчки додають ваш матеріал у ранкові дайджести.\",\"delayed\":[]},{\"id\":\"who_allowed\",\"order\":4,\"label\":\"Спитати прямо: хто дозволив продати наш борг спекулянтам?\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":6,\"traffic\":8,\"owner\":-2,\"ethics\":4},\"fxPoll\":0.3,\"setFlags\":[],\"counters\":{},\"feedback\":\"Питання «хто дозволив продати борг спекулянтам?» лишається без відповіді, зате тепер його ставлять депутати.\",\"delayed\":[]}]},\"d8_mine\":{\"id\":\"d8_mine\",\"day\":8,\"order\":1,\"type\":\"news\",\"storyline\":\"\",\"headline\":\"«Молнія Online»: «Наша головна шахта всі роки війни працювала на Бакію». Що з цього правда?\",\"body\":\"Таблоїд вийшов із «розслідуванням»: флагманська шахта Рудного Краю, символ «нашого металу», нібито роками продавала майже всю руду трейдеру, кінцевим покупцем якого були переробники Бакії. Заголовок уже спрацював: під шахтою збирається мітинг, а робітників, які ще вчора були героями відбудови, у коментарях називають «зрадниками».\",\"truth\":\"half_true\",\"revealText\":\"Торгівля була: до війни, через біржу, легально. Частка бакійського капіталу становила сім відсотків, а не «контроль». Таблоїд склеїв правдиві цифри в брехливу картину.\",\"req\":null,\"checks\":{\"factcheck\":{\"reveal\":\"full\",\"text\":\"Соломія: «Біржові дані відкриті: торгівля була до війни і через біржу, а частка бакійського капіталу в шахті – сім відсотків, не «контроль». Таблоїд склеїв правдиві цифри в брехливу картину».\"},\"reporter\":{\"reveal\":\"partial\",\"text\":\"Ірма з-під шахти: «Мітинг справжній і злий. Половина людей навіть не читала те «розслідування», їм переказали».\"},\"source_call\":{\"reveal\":\"partial\",\"text\":\"Директор шахти тремтячим голосом: «Ми все спростуємо». На питання, коли саме, кладе слухавку.\"}},\"options\":[{\"id\":\"ride_wave\",\"order\":1,\"label\":\"Підхопити хвилю: «Шахта ворога» з нашими деталями\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":-10,\"traffic\":16,\"owner\":2,\"ethics\":-10},\"fxPoll\":-0.3,\"setFlags\":[],\"counters\":{},\"feedback\":\"«Шахта ворога» з вашими деталями летить у топ. Під шахтою вже б'ють вікна в конторі. Соломія кладе на стіл біржові виписки, які ви не подивилися.\",\"delayed\":[]},{\"id\":\"debunk_math\",\"order\":2,\"label\":\"Розкласти маніпуляцію таблоїда по цифрах\",\"reqTruthKnown\":true,\"req\":null,\"fx\":{\"audience\":12,\"traffic\":6,\"ethics\":10},\"fxPoll\":0.3,\"setFlags\":[],\"counters\":{},\"feedback\":\"Ви розклали «розслідування» таблоїда по цифрах: сім відсотків – не контроль. Мітинг під шахтою рідшає, «Молнія» мовчить.\",\"delayed\":[]},{\"id\":\"workers_voice\",\"order\":3,\"label\":\"Дати слово робітникам шахти, яких цькують\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":10,\"traffic\":8,\"ethics\":8},\"fxPoll\":0,\"setFlags\":[],\"counters\":{},\"feedback\":\"Шахтарі з вашого матеріалу дивляться в камеру і питають: «Ми чотири роки давали метал на оборону. Хто з нас зрадник?» Цькування вщухає.\",\"delayed\":[]},{\"id\":\"stay_out\",\"order\":4,\"label\":\"Промовчати: це не наша суперечка з таблоїдом\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":-4,\"traffic\":-10,\"ethics\":-4},\"fxPoll\":0,\"setFlags\":[],\"counters\":{},\"feedback\":\"Ви не втрутились. Увечері під шахтою чергують автобуси з «активістами», і місцева поліція розводить руками.\",\"delayed\":[]}]},\"d8_humanitarian\":{\"id\":\"d8_humanitarian\",\"day\":8,\"order\":2,\"type\":\"news\",\"storyline\":\"\",\"headline\":\"Продовольча програма Союзу для Краю: третина контрактів дісталася фірмам, створеним за тиждень до тендерів\",\"body\":\"Розслідування, яке редакція вела два тижні, нарешті готове. Постачання продуктів і матеріалів у Край за програмою Союзу йшло через ланцюжок фірм-прокладок, і націнка на шляху від порту до Камінного сягала 240%. Сліди корупційної схеми ведуть до апарату міністра Кесснера, а також, що значно гірше, до менеджера гуманітарної місії з боку самого Союзу. Публікація вдарить по допомозі, на яку Край чекає щодня, і по переговорах напередодні виборів.\",\"truth\":\"true\",\"revealText\":\"Кожна цифра розслідування підтвердилася: прокладки, націнка 240 відсотків, сліди в апараті Кесснера і в офісі Союзу.\",\"req\":null,\"checks\":{\"factcheck\":{\"reveal\":\"full\",\"text\":\"Соломія: «Фінальна звірка завершена: тендерна документація, накладні і свідчення сходяться. Кожна цифра розслідування стоїть на документі».\"},\"reporter\":{\"reveal\":\"partial\",\"text\":\"Ірма зі складів у Камінному: «Полиці напівпорожні, людям кажуть «підвезуть». Ціни на базарі поруч удвічі вищі за програмні».\"},\"source_call\":{\"reveal\":\"partial\",\"text\":\"Міністерство відбудови: «Програма працює у штатному режимі». Про посередників відповідають, що «інформація перевіряється».\"}},\"options\":[{\"id\":\"publish_full\",\"order\":1,\"label\":\"Публікувати повністю: і про Кесснера, і про людину Союзу\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":12,\"traffic\":14,\"owner\":-10,\"ethics\":12},\"fxPoll\":0.6,\"setFlags\":[\"humanitarian_published\"],\"counters\":{},\"feedback\":\"Розслідування виходить повним: Кесснер і людина Союзу в одному тексті. Посольство скасовує «дружню зустріч» із редакцією, а в Камінному матеріал читають з тривогою за допомогу.\",\"delayed\":[{\"afterDays\":1,\"text\":\"Союз призупинив продовольчу програму «до завершення внутрішнього аудиту». Біля складів у Камінному черги, і частина коментаторів звинувачує не крадіїв, а вас.\",\"fx\":{\"audience\":-6,\"owner\":-4},\"fxPoll\":0,\"setFlags\":[]}]},{\"id\":\"sonovia_only\",\"order\":2,\"label\":\"Публікувати лише «соновійську» частину схеми\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":6,\"traffic\":10,\"owner\":-4,\"ethics\":-4},\"fxPoll\":0.4,\"setFlags\":[],\"counters\":{},\"feedback\":\"Ви вдарили по Кесснеру, але змовчали про людину Союзу. Матеріал сильний, але замовчана частина може спливти пізніше.\",\"delayed\":[]},{\"id\":\"give_bureau\",\"order\":3,\"label\":\"Передати матеріали антикорупційному бюро без публікації\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"traffic\":-5,\"owner\":2,\"ethics\":2},\"fxPoll\":0,\"setFlags\":[],\"counters\":{},\"feedback\":\"Антикорупційне бюро підтвердило отримання матеріалів. Два тижні роботи редакції передано в бюро, а коли і чи буде результат, невідомо.\",\"delayed\":[]},{\"id\":\"hold\",\"order\":4,\"label\":\"Притримати до завершення переговорів з Союзом\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":-4,\"traffic\":-6,\"owner\":4,\"ethics\":-6},\"fxPoll\":0,\"setFlags\":[],\"counters\":{\"kramar_obeyed\":1},\"feedback\":\"Розслідування чекає «завершення переговорів». Ірма нагадує: після виборів воно вже нікого не зацікавить.\",\"delayed\":[]}]},\"d8_spyware\":{\"id\":\"d8_spyware\",\"day\":8,\"order\":3,\"type\":\"news\",\"storyline\":\"\",\"headline\":\"У телефонах трьох журналістів «Пульсу» знайшли шпигунський модуль\",\"body\":\"Знайомий фахівець із кібербезпеки перевірив редакційні телефони після підозріло швидких розрядів батареї. У трьох апаратах він знайшов комерційне шпигунське програмне забезпечення того рівня, який зазвичай купують спецслужби. Коли і як воно потрапило в телефони, попередній огляд не показує. Хто саме стежить: уряд, «Ортус», Союз чи Бакія, технічно встановити неможливо. Зрозуміло інше: всі контакти джерел, чернетки і пошта редакції зламані. Ірма перша каже вголос: «Мої джерела в Краї тепер у небезпеці».\",\"truth\":\"true\",\"revealText\":\"Стеження реальне, а замовника технічно встановити неможливо. Єдиний надійний висновок: стеження почалося після ваших розслідувань про гроші.\",\"req\":null,\"checks\":{\"factcheck\":{\"reveal\":\"full\",\"text\":\"Соломія з експертом: «Звіт готовий: зараження через фішинговий лист під виглядом прес-запиту. І дата в усіх трьох телефонах одна – ранок після нашої публікації про транш Союзу. Це цілеспрямована атака».\"},\"source_call\":{\"reveal\":\"partial\",\"text\":\"Представник виробника ПЗ, офіційно: «Ми продаємо продукт лише державним структурам». Яким саме, «розголошенню не підлягає».\"}},\"options\":[{\"id\":\"publish_now\",\"order\":1,\"label\":\"Опублікувати негайно: «За „Пульсом“ стежать»\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":10,\"traffic\":12,\"owner\":-5,\"ethics\":6},\"fxPoll\":0,\"setFlags\":[\"spyware_published\"],\"counters\":{},\"feedback\":\"«За «Пульсом» стежать» – головна новина ранку. Читачі обурені, конкуренти перевіряють власні телефони, а той, хто стежив, тепер знає, що ви знаєте.\",\"delayed\":[{\"afterDays\":1,\"text\":\"Після матеріалу про стеження два джерела розірвали контакт із редакцією. Інші пишуть із нових номерів: «Тепер зрозуміло, чому ви питали дивне».\",\"fx\":{\"audience\":-4},\"fxPoll\":0,\"setFlags\":[]}]},{\"id\":\"feed_disinfo\",\"order\":2,\"label\":\"Мовчати і згодувати прослуховувачам дезінформацію\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"ethics\":-6},\"fxPoll\":0,\"setFlags\":[\"spy_feeding\"],\"counters\":{},\"feedback\":\"Ви лишили «жучок» жити і почали годувати його фальшивками. Це гра на нервах: один необережний рядок у робочому чаті, і постраждають справжні джерела.\",\"delayed\":[]},{\"id\":\"protect_quiet\",\"order\":3,\"label\":\"Тихо перевести джерела на захищені канали, публікацію відкласти\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"traffic\":-5,\"ethics\":8},\"fxPoll\":0,\"setFlags\":[],\"counters\":{},\"feedback\":\"Джерела переведені на захищені канали, публікації немає. Безпека людей коштувала вам гучної новини.\",\"delayed\":[]}]},\"d8_boycott\":{\"id\":\"d8_boycott\",\"day\":8,\"order\":4,\"type\":\"news\",\"storyline\":\"campaign\",\"headline\":\"«Digicard» заполонили заклики бойкотувати вибори: «вони вже все поділили». Хвиля здійнялася за одну ніч\",\"body\":\"«Digicard» накрила хвиля однотипних дописів: «не легітимізуй цирк», «твій голос нічого не змінює», «вони вже поділили Край». Меми зроблені якісно, а таргетинг налаштований точно: на молодь, мешканців Краю і родини зниклих. Найгірше, що заклики резонують: після всього, що країна побачила за ці дні, заклик «сиди вдома» багатьом здається розумним.\",\"truth\":\"half_true\",\"revealText\":\"Кампанія бойкоту була керованою: більшість розгону давали свіжі акаунти. Але втома людей справжня, і саме на ній грав таргетинг.\",\"req\":null,\"checks\":{\"factcheck\":{\"reveal\":\"full\",\"text\":\"Соломія: «Шістдесят відсотків розгону дають акаунти, створені цього місяця, з однаковими патернами активності. Розгін керований, але підхоплюють його вже справжні люди».\"},\"reporter\":{\"reveal\":\"partial\",\"text\":\"Ірма з вуличного опитування: «Молодь каже, що і без ботів не бачить, за кого голосувати. Це найгірша частина цієї історії».\"},\"source_call\":{\"reveal\":\"partial\",\"text\":\"Пресслужба «Digicard»: «Ми розслідуємо скоординовану неавтентичну поведінку». Термінів і деталей не називають.\"}},\"options\":[{\"id\":\"expose_network\",\"order\":1,\"label\":\"Викрити мережу: хто і як розганяє «бойкот»\",\"reqTruthKnown\":true,\"req\":null,\"fx\":{\"audience\":10,\"traffic\":10,\"owner\":-4,\"ethics\":10},\"fxPoll\":0.5,\"setFlags\":[\"boycott_exposed\"],\"counters\":{},\"feedback\":\"Ви показали анатомію «бойкоту»: акаунти, патерни, таргетинг. Частина молоді злиться, частина вперше бачить, як нею керують.\",\"delayed\":[]},{\"id\":\"neutral_turnout\",\"order\":2,\"label\":\"Нейтрально: «соціологи фіксують ризик низької явки»\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"traffic\":2,\"owner\":2,\"ethics\":-4},\"fxPoll\":-0.2,\"setFlags\":[\"boycott_ignored\"],\"counters\":{},\"feedback\":\"«Соціологи фіксують ризик низької явки» – коректно, але без ефекту. Хвиля «сиди вдома» котиться далі, ніби вашого матеріалу не було.\",\"delayed\":[]},{\"id\":\"turnout_campaign\",\"order\":3,\"label\":\"Редакційна кампанія «Прийди і вирішуй», відкрита агітація за явку\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":6,\"traffic\":6,\"owner\":-2,\"ethics\":4},\"fxPoll\":0.4,\"setFlags\":[\"turnout_campaign\"],\"counters\":{},\"feedback\":\"«Прийди і вирішуй» на головній сторінці. Журналістика тут закінчується і починається громадянська кампанія. Межа між ними сьогодні тонша, ніж будь-коли.\",\"delayed\":[]},{\"id\":\"ignore\",\"order\":4,\"label\":\"Ігнорувати: будь-яка згадка лише розганяє хвилю\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":-3,\"traffic\":-10,\"ethics\":-4},\"fxPoll\":-0.3,\"setFlags\":[\"boycott_ignored\"],\"counters\":{},\"feedback\":\"Ви не дали хвилі жодного приводу згадати «Пульс». Але хвиля і без вас робить свою справу: у розмовах дедалі частіше звучить «а сенс іти?».\",\"delayed\":[]}]},\"d8_artina\":{\"id\":\"d8_artina\",\"day\":8,\"order\":5,\"type\":\"news\",\"storyline\":\"campaign\",\"headline\":\"Анонім передав редакції архів пошти столичної PR-фірми. Це замовна атака на вибори в Соновії\",\"body\":\"Анонім передав редакції пів гігабайта внутрішньої пошти піар-агенції «Артіна Груп». Це непублічна компанія з дорогим офісом у центрі Білої Вежі, про яку досі ніхто не писав. В архіві лежать медіаплани «стихійних» кампаній, розцінки на блогерів і розклад «тем» по тижнях. Серед них є отруєна вода, «свідок звірств» і запланований на фінал бойкот виборів. У кожного плану є колонка «на кого показуємо», і всюди в ній стоїть одне слово: Бакія. Багато з того, що країна пережила за ці дні, розписане в таблицях із бюджетами та KPI. Підписи виконавців є. Замовника немає: гроші приходять від офшорної прокладки. Якщо архів справжній, це найбільше викриття в історії редакції. Якщо він підроблений, публікація знищить «Пульс».\",\"truth\":\"unknown\",\"revealText\":\"Архів виявився справжнім, що згодом підтвердила експертиза. Того дня цього не знав ніхто, і рішення доводилося приймати без гарантій.\",\"req\":null,\"checks\":{\"factcheck\":{\"reveal\":\"partial\",\"text\":\"Соломія: «Заголовки листів і стиль виглядають справжніми. Але пів гігабайта пошти за один день не перевіряє ніхто. Потрібна повна технічна експертиза, а це щонайменше доба».\"},\"reporter\":{\"reveal\":\"partial\",\"text\":\"Ірма з-під офісу «Артіни»: «Охорона, дорогі авто, жодної вивіски. Люди заходять і виходять, на питання не відповідають».\"},\"source_call\":{\"reveal\":\"partial\",\"text\":\"Знайомий піарник: «Артіна» працює тихо, бере дорого і ніколи не називає клієнтів. Якщо їхню пошту справді злили, у когось будуть дуже серйозні проблеми. Можливо, у вас».\"}},\"options\":[{\"id\":\"publish_raw\",\"order\":1,\"label\":\"Публікувати найгучніші листи сьогодні: країна має право знати до виборів\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":6,\"traffic\":20,\"owner\":-6,\"ethics\":-8},\"fxPoll\":0.5,\"setFlags\":[\"artina_published_d8\"],\"counters\":{},\"feedback\":\"Найгучніші листи «Артіни» на головній. Країна кипить, «Артіна» мовчить, а Соломія повторює: «Ми не встигли перевірити. Сподіваюсь, що це не пастка».\",\"delayed\":[{\"afterDays\":1,\"text\":\"Учорашня сенсація за ніч перетворилася на мішень: найняті «незалежні експерти» оголосили архів «Артіни» підробкою, провладні канали сміються з «Пульсу», і кожен ваш заголовок тепер зустрічають словом «фейк».\",\"fx\":{\"audience\":-12},\"fxPoll\":-1,\"setFlags\":[]}]},{\"id\":\"expertise_hold\",\"order\":2,\"label\":\"Не публікувати сьогодні: віддати архів на технічну експертизу\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"traffic\":-5,\"ethics\":8},\"fxPoll\":0,\"setFlags\":[\"artina_expertise\"],\"counters\":{},\"feedback\":\"Архів поїхав на технічну експертизу. Це доба чи дві тиші, поки конкуренти можуть вийти першими. Зате якщо архів справжній, ваша публікація буде неспростовною.\",\"delayed\":[]},{\"id\":\"request_comment\",\"order\":3,\"label\":\"Надіслати «Артіні» запит на коментар і тим самим показати, що архів у нас\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"ethics\":2},\"fxPoll\":0,\"setFlags\":[\"artina_tipped\"],\"counters\":{},\"feedback\":\"Ви надіслали «Артіні» офіційний запит. Відповіді немає, але тепер вони знають, що архів у вас. Соломія вважає, що ви щойно попередили їх про викриття.\",\"delayed\":[{\"afterDays\":1,\"text\":\"Офіс «Артіни Груп» спорожнів за одну ніч: меблі, сервери і таблички вивезли до ранку. Ваш запит дав їм час підготуватися.\",\"fx\":{},\"fxPoll\":0,\"setFlags\":[]}]},{\"id\":\"share_intl\",\"order\":4,\"label\":\"Поділитися архівом із міжнародною мережею розслідувачів\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"traffic\":-3,\"ethics\":4},\"fxPoll\":0,\"setFlags\":[\"artina_shared_intl\"],\"counters\":{},\"feedback\":\"Ви поділилися архівом із міжнародними розслідувачами. Тепер історією займаються кілька редакцій, і зупинити її вже неможливо.\",\"delayed\":[]}]},\"d9_dossier\":{\"id\":\"d9_dossier\",\"day\":9,\"order\":1,\"type\":\"news\",\"storyline\":\"\",\"headline\":\"За день до парафування угоди: у трьох сусідніх країнах «Ортус» фігурує у справах про хабарі чиновникам\",\"body\":\"З-за кордону до редакції надійшов пакет судових документів. У двох сусідніх державах менеджери «Ортуса» вже перебувають під слідством за «плату за вхід»: хабарі міністрам за створення підприємств там оформлювали через «консультаційні угоди» з фірмами родичів, і схема повторюється скрізь. Завтра Крайц має парафувати з «Ортусом» рамкову угоду. Посольство Союзу «рекомендує» не загострювати ситуацію перед підписанням.\",\"truth\":\"true\",\"revealText\":\"Справи проти менеджерів «Ортуса» справжні, схема «плати за вхід» задокументована судами двох країн. Питання було лише в тому, чи дізнається про це Соновія до підписів.\",\"req\":null,\"checks\":{\"factcheck\":{\"reveal\":\"full\",\"text\":\"Соломія: «Судові реєстри двох країн відкриті: справи існують, номери збігаються, менеджери «Ортуса» фігурують поіменно. Досьє справжнє».\"},\"source_call\":{\"reveal\":\"partial\",\"text\":\"Посольство однієї з країн: «Ми не коментуємо чужі судові процеси». Знайомий журналіст звідти: «У нас про це писали ще навесні, справа гучна».\"}},\"options\":[{\"id\":\"publish_today\",\"order\":1,\"label\":\"Публікувати досьє сьогодні, до парафування\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":14,\"traffic\":16,\"owner\":-18,\"ethics\":12},\"fxPoll\":0.8,\"setFlags\":[\"dossier_published\"],\"counters\":{},\"feedback\":\"Досьє на «Ортуса» виходить за день до парафування. Посольство Союзу викликає посла Соновії «для консультацій», Крамар досі не дзвонить.\",\"delayed\":[{\"afterDays\":1,\"text\":\"Парафування угоди з «Ортусом» перенесли «з технічних причин». У кулуарах кажуть, що після вашого досьє двоє міністрів відмовилися ставити підписи.\",\"fx\":{\"audience\":6},\"fxPoll\":0,\"setFlags\":[]}]},{\"id\":\"hold_after\",\"order\":2,\"label\":\"Притримати: вийти після парафування, коли спаде тиск\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":-6,\"traffic\":-8,\"owner\":6,\"ethics\":-8},\"fxPoll\":-0.4,\"setFlags\":[],\"counters\":{\"kramar_obeyed\":1},\"feedback\":\"Ви вирішили зачекати, поки спаде тиск. Парафування відбудеться завтра, і після нього досьє вже нічого не змінить.\",\"delayed\":[]},{\"id\":\"give_bureau\",\"order\":3,\"label\":\"Передати досьє антикорупційному бюро без публікації\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"traffic\":-6,\"owner\":4,\"ethics\":2},\"fxPoll\":0,\"setFlags\":[],\"counters\":{},\"feedback\":\"Досьє поїхало в антикорупційне бюро. Формально ви зробили все правильно. Фактично країна проголосує, не знаючи того, що знали ви.\",\"delayed\":[]},{\"id\":\"evening_with_reply\",\"order\":4,\"label\":\"Вийти ввечері: з відповіддю «Ортуса» або поміткою «відмовились коментувати»\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":12,\"traffic\":12,\"owner\":-8,\"ethics\":14},\"fxPoll\":0.6,\"setFlags\":[\"dossier_published\"],\"counters\":{},\"feedback\":\"Ви дали «Ортусу» день на відповідь і вийшли ввечері з їхнім «звинувачення безпідставні» поруч із судовими номерами справ. Юридично бездоганно, і від того ще переконливіше.\",\"delayed\":[]}]},\"d9_plot\":{\"id\":\"d9_plot\",\"day\":9,\"order\":2,\"type\":\"news\",\"storyline\":\"\",\"headline\":\"Служба безпеки Соновії (СБС) заявляє: викрито групу, що готувала замах на Крайца в день виборів. Опозиція називає це виборчою виставою\",\"body\":\"За два дні до голосування спецслужба скликає брифінг: затримано трьох осіб, у схованці знайдено зброю, «слід веде за кордон». Провладні коментатори одразу підхоплюють: «почерк бакійських диверсантів». Деталей немає. Імена засекречені, адвокатів до затриманих не пускають, а фото зброї виявилося стоковим: Соломія знайшла таке саме у фотобанку за кілька хвилин. Рева називає все це «виставою для мобілізації електорату страху». Влада відповідає, що опозиціонерка «сміється зі справжньої загрози».\",\"truth\":\"half_true\",\"revealText\":\"Що це було, не з'ясовано досі: справу засекретили, затриманих ніхто не бачив, а стокове фото так і лишилося єдиним «доказом». Незалежно від правди, повідомлення про змову підняло рівень страху напередодні виборів.\",\"req\":null,\"checks\":{\"factcheck\":{\"reveal\":\"partial\",\"text\":\"Соломія: «Перевірила більше, ніж стокове фото: реквізити брифінгу справжні, протокол затримання існує. Але справа під грифом: ані підтвердити змову, ані спростувати її ззовні неможливо».\"},\"reporter\":{\"reveal\":\"partial\",\"text\":\"Ірма з-під суду: «Адвокатів не пускають, родичів затриманих ніхто не бачив. Або їх дуже добре ховають, або їх не існує».\"},\"source_call\":{\"reveal\":\"partial\",\"text\":\"Відставний офіцер СБС: «Так роблять і для піару, і для реальних загроз. Ззовні ці два випадки не відрізнити».\"}},\"options\":[{\"id\":\"sbs_headline\",\"order\":1,\"label\":\"«Замах на прем'єра»: опублікувати версію з брифінгу СБС і зробити головною подією дня\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":-8,\"traffic\":18,\"owner\":6,\"ethics\":-10},\"fxPoll\":-0.8,\"setFlags\":[],\"counters\":{},\"feedback\":\"«Замах на прем'єра» вашими літерами на пів екрана. Якщо змова справжня, ви першими про неї сказали. Якщо це вистава, ви допомогли її розіграти.\",\"delayed\":[]},{\"id\":\"stock_photo_story\",\"order\":2,\"label\":\"Написати про брифінг, стокове фото, питання без відповідей\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":10,\"traffic\":10,\"owner\":-4,\"ethics\":10},\"fxPoll\":0,\"setFlags\":[],\"counters\":{},\"feedback\":\"Ви показали все як є: заяву СБС і стокове фото зброї поруч. Читачі розділилися: одні сміються зі стокового фото, інші обурені недовірою до спецслужби.\",\"delayed\":[]},{\"id\":\"opposition_version\",\"order\":3,\"label\":\"Поставити на сайт версію опозиції як основну: «Вистава напередодні виборів»\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":-4,\"traffic\":12,\"owner\":-8,\"ethics\":-6},\"fxPoll\":0.6,\"setFlags\":[],\"counters\":{},\"feedback\":\"«Вистава напередодні» як рівноцінна версія. Влада публічно називає «Пульс» «рупором Реви» і заносить у відповідні списки.\",\"delayed\":[]},{\"id\":\"minimal\",\"order\":4,\"label\":\"Мінімальна новина до появи хоч одного факту\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"traffic\":-8,\"ethics\":4},\"fxPoll\":0,\"setFlags\":[],\"counters\":{},\"feedback\":\"Три абзаци сухих фактів. На тлі галасу конкурентів матеріал майже не помітили.\",\"delayed\":[]}]},\"d9_sellers\":{\"id\":\"d9_sellers\",\"day\":9,\"order\":3,\"type\":\"news\",\"storyline\":\"campaign\",\"headline\":\"Посередник пропонує «Пульсу» купити докази: «Ми робили кампанію проти Реви. Замовника назвемо за гроші»\",\"body\":\"Через посередника на редакцію виходить людина, яка представляється співвласником «бутіка політичних послуг». За її словами, фірма продає ботів, зламані акаунти і підготовлених «свідків». Усе це до дрібниць збігається з листами піар-агенції «Артіна», які ви отримали вчора, і навіть доповнює їх. Незнайомець пропонує повний пакет доказів разом з іменем замовника. Ціна дорівнює річному бюджету відділу розслідувань, а «завтра буде вдвічі дорожче». Соломія категорично проти купівлі доказів. Юрко тихо питає: «А якщо це правда?»\",\"truth\":\"fake\",\"revealText\":\"«Продавець» був підставою: та сама людина вже двічі продавала редакціям «докази», які потім не витримували перевірки. Куплений доказ отруїв би все майбутнє викриття.\",\"req\":null,\"checks\":{\"factcheck\":{\"reveal\":\"partial\",\"text\":\"Соломія: «Акаунти й номер посередника чисті. Занадто чисті для торговця компроматом: так виглядає підготовлена легенда».\"},\"reporter\":{\"reveal\":\"partial\",\"text\":\"Ірма після зустрічі на нейтральній території: «Він нервує, але тримається професійно, а його охорона має військову поставу. Для дрібного афериста це забагато: за ним, схоже, стоїть організація».\"},\"source_call\":{\"reveal\":\"full\",\"text\":\"Знайомий міжнародний розслідувач: «За вашим описом це людина, яка вже двічі продавала редакціям «докази з іменем замовника». Обидва рази публікації не витримали перевірки, а редакції втратили репутацію».\"}},\"options\":[{\"id\":\"pay\",\"order\":1,\"label\":\"Заплатити: до виборів доба, потім буде пізно\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"owner\":-6,\"ethics\":-12},\"fxPoll\":0,\"setFlags\":[\"bought_evidence\"],\"counters\":{},\"feedback\":\"Гроші передані, пакет отримано. У редакції його відмовляються навіть відкривати: куплений доказ не має цінності в суді. Про купівлю знаєте лише ви, і будь-який витік знищить довіру до редакції.\",\"delayed\":[{\"afterDays\":1,\"text\":\"«Продавець доказів» зник разом із грошима. Половина «пакета» виявилася копіями листів «Артіни», які у вас уже були.\",\"fx\":{\"owner\":-4},\"fxPoll\":0,\"setFlags\":[]}]},{\"id\":\"protection_offer\",\"order\":2,\"label\":\"Відмовитись платити, запропонувати стандартний журналістський захист джерела: ніхто не дізнається, що це він\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"ethics\":8},\"fxPoll\":0,\"setFlags\":[],\"counters\":{},\"feedback\":\"Ви запропонували не гроші, а захист і легалізацію свідчень. «Продавець» вагається: схоже, гроші його цікавили більше за викриття.\",\"delayed\":[]},{\"id\":\"hidden_recording\",\"order\":3,\"label\":\"Прихована зустріч під запис і публікація самої пропозиції\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":8,\"traffic\":12,\"owner\":-4,\"ethics\":2},\"fxPoll\":0.4,\"setFlags\":[],\"counters\":{},\"feedback\":\"Прихована зустріч записана, і сама пропозиція «купити замовника» стає новиною. Ви не отримали доказів, зате показали ринок, на якому ними торгують.\",\"delayed\":[]},{\"id\":\"give_investigators\",\"order\":4,\"label\":\"Передати контакт міжнародним розслідувачам\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"traffic\":-4,\"ethics\":6},\"fxPoll\":0,\"setFlags\":[],\"counters\":{},\"feedback\":\"Контакт переданий людям, у яких є час і юристи. Якщо там правда, вона випливе. Якщо це пастка, ризикуватимуть вони, а не ви.\",\"delayed\":[]}]},\"d9_page14\":{\"id\":\"d9_page14\",\"day\":9,\"order\":4,\"type\":\"news\",\"storyline\":\"campaign\",\"headline\":\"У редакції з'явився витяг із закритого додатку до угоди з «Ортусом». Він не збігається з тим, що уряд каже публічно\",\"body\":\"Хтось із апарату уряду передав редакції чотирнадцяту сторінку закритого додатку до угоди. У ній прописані гарантії «пріоритетного повернення інвестицій» Союзу під заставу самих родовищ і пункт про арбітражний розгляд суперечок поза юрисдикцією Соновії. Публічно Крайц клянеться, що «жодних застав і жодних чужих судів» в угоді немає. Документ прийшов без печаток: це витяг, а не оригінал. Влада вже попередила редакції, що публікація «краденого фрагмента» означатиме кримінальну справу й обшук.\",\"truth\":\"true\",\"revealText\":\"Сторінка 14 справжня: застава на родовища і чужий арбітраж в угоді є. Уряд публічно казав неправду.\",\"req\":null,\"checks\":{\"factcheck\":{\"reveal\":\"partial\",\"text\":\"Соломія: «Шрифт, реквізити і нумерація збігаються з форматом урядових документів. Але це копія без печаток: формальним доказом вона не стане».\"},\"source_call\":{\"reveal\":\"full\",\"text\":\"Друге джерело в апараті уряду, дуже тихо: «Сторінка справжня, я бачив оригінал додатка. Якщо назвете мене, я все заперечу».\"}},\"options\":[{\"id\":\"publish_excerpt\",\"order\":1,\"label\":\"Публікувати витяг з усіма застереженнями: люди голосують саме за це\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":12,\"traffic\":18,\"owner\":-18,\"ethics\":10},\"fxPoll\":1,\"setFlags\":[\"page14_published\"],\"counters\":{},\"feedback\":\"Сторінка 14 опублікована з усіма застереженнями. Уряд обіцяє кримінальну справу, а опозиція друкує сторінку на банерах. Почалося все з документа, а тепер йдеться про довіру до редакції.\",\"delayed\":[{\"afterDays\":1,\"text\":\"Зранку під редакцією стояли слідчі з ордером. Обшук тривав дві години і завершився нічим, бо оригіналів у вас ніколи й не було. Але сигнал усі зрозуміли.\",\"fx\":{\"audience\":6,\"owner\":-6},\"fxPoll\":0,\"setFlags\":[]}]},{\"id\":\"safe_keep\",\"order\":2,\"label\":\"Не публікувати без повного документа: витяг покласти в сейф\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":-4,\"traffic\":-6,\"owner\":4,\"ethics\":-6},\"fxPoll\":0,\"setFlags\":[],\"counters\":{},\"feedback\":\"Витяг без печаток лягає в сейф до появи повного документа.\",\"delayed\":[]},{\"id\":\"questions_only\",\"order\":3,\"label\":\"Опублікувати лише питання до уряду, без документа\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":8,\"traffic\":8,\"owner\":-4,\"ethics\":8},\"fxPoll\":0.4,\"setFlags\":[],\"counters\":{},\"feedback\":\"Ви публікуєте самі питання: «Чи є в угоді застава? Чи є чужий арбітраж?» Уряд не відповідає, і читачі роблять висновки з його мовчання.\",\"delayed\":[]},{\"id\":\"foreign_journalist\",\"order\":4,\"label\":\"Передати незалежному журналісту за кордоном, щоб матеріал вийшов не у вас\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":4,\"traffic\":-4,\"ethics\":8},\"fxPoll\":0.5,\"setFlags\":[\"page14_abroad\"],\"counters\":{},\"feedback\":\"Сторінка виходить у закордонному виданні з поміткою «документи отримані від соновійських колег». Обшук їм не загрожує, а інформація оприлюднена.\",\"delayed\":[]}]},\"d9_artina_laugh\":{\"id\":\"d9_artina_laugh\",\"day\":9,\"order\":5,\"type\":\"news\",\"storyline\":\"campaign\",\"headline\":\"«Артіна» відповіла на вчорашню публікацію заявою: «Пульс» надрукував фейк напередодні виборів». Влада вимагає вибачень\",\"body\":\"Учорашні листи розійшлися мільйонними переглядами, але без експертизи протрималися недовго. «Артіна» виставила гучних «незалежних експертів», які оголосили архів «грубою підробкою», провладні канали висміюють «Пульс», а штаб Крайца вимагає публічних вибачень «за спробу зірвати вибори». Ваша власна експертиза нарешті готова і підтверджує справжність листів. Але тепер будь-яку її публікацію сприймуть як спробу виправдатися.\",\"truth\":\"true\",\"revealText\":\"Листи були справжніми, і запізніла експертиза це довела. Але викриття, опубліковане без доказів, більшість уже сприймала як фейк, і повторна публікація нічого не змінила.\",\"req\":{\"flagsAll\":[\"artina_published_d8\"],\"flagsNone\":[]},\"checks\":{},\"options\":[{\"id\":\"expertise_stand\",\"order\":1,\"label\":\"Опублікувати експертизу і стояти на своєму: пізно, але правда\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":6,\"traffic\":4,\"owner\":-4,\"ethics\":8},\"fxPoll\":0.6,\"setFlags\":[],\"counters\":{},\"feedback\":\"Експертиза опублікована. Прихильники заспокоїлися, а скептики кажуть, що «тепер кожен може намалювати папірець».\",\"delayed\":[]},{\"id\":\"apologize\",\"order\":2,\"label\":\"Публічно вибачитись «за поспіх», не відкликаючи суті\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":-4,\"owner\":6,\"ethics\":-4},\"fxPoll\":-0.6,\"setFlags\":[],\"counters\":{},\"feedback\":\"Вибачення «за поспіх» штаб Крайца цитує як «визнання фейку». Ви цього не казали, але тепер у це мало хто вникатиме.\",\"delayed\":[]},{\"id\":\"remove_quiet\",\"order\":3,\"label\":\"Тихо прибрати матеріал із сайту\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"audience\":-8,\"traffic\":-6,\"owner\":4,\"ethics\":-8},\"fxPoll\":-0.4,\"setFlags\":[],\"counters\":{},\"feedback\":\"Матеріал зник із сайту. Скриншоти лишилися, і тепер вас звинувачують не лише у фейку, а й у тому, що ви злякалися.\",\"delayed\":[]},{\"id\":\"give_intl_late\",\"order\":4,\"label\":\"Передати все міжнародним розслідувачам, щоб довели без нас\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"traffic\":-4,\"ethics\":6},\"fxPoll\":0,\"setFlags\":[\"artina_given_intl_late\"],\"counters\":{},\"feedback\":\"Архів і ваша експертиза поїхали до міжнародних розслідувачів. Якщо правда підтвердиться на весь світ, це станеться вже після виборів.\",\"delayed\":[]}]},\"d9_artina_payer\":{\"id\":\"d9_artina_payer\",\"day\":9,\"order\":5,\"type\":\"news\",\"storyline\":\"campaign\",\"headline\":\"Експертиза підтвердила архів «Артіни». Офшорна прокладка веде не в Бакію, а у фонд розвитку Союзу\",\"body\":\"Технічна експертиза завершена: метадані справжні, листування автентичне. Гроші пройшли через офшорну фірму, власником якої виявився «фонд сприяння відбудові» при структурах Союзу. Це той самий фонд, коштом якого «Пульс» торік їздив на конференцію. Усі сліди, що вказували на Бакію, виявилися підкинутими. Доказ усе ще неповний: бракує останньої ланки, підпису людин . Якщо вона з'явиться після виборів, історія вийде повною, але вже нікого не зацікавить.\",\"delayed\":[]},{\"id\":\"give_intl\",\"order\":4,\"label\":\"Віддати історію міжнародному консорціуму: захист і перевірка, але не наш тріумф\",\"reqTruthKnown\":false,\"req\":null,\"fx\":{\"traffic\":-4,\"ethics\":6},\"fxPoll\":0,\"setFlags\":[\"artina_given_intl\"],\"counters\":{},\"feedback\":\"Історія їде до міжнародного консорціуму. Викриття буде, і буде доведеним, але авторство належатиме не «Пульсу».\",\"delayed\":[{\"afterDays\":1,\"text\":\"Міжнародний консорціум розслідувачів вийшов із викриттям: замовником дезінформаційної кампанії в Соновії названо фонд при структурах Союзу. Світові видання цитують документи, які ви передали. Імені «Пульсу» в матеріалі немає.\",\"fx\":{\"audience\":5},\"fxPoll\":2.5,\"setFlags\":[\"campaign_exposed\"]}]}]},\"d10_hospital\":{\"id\":\"d10_hospital\",\"day\":10,\"order\":1,\"type\":\"news\",\"storyline\":\"\",\"headline\":\"Фото з військового шпиталю: поранені ветерани лежать у коридорах, у палатах пліснява, а на поверх лишилося три лікарі\",\"body\":\"Медсестра військового шпиталю передала редакції десятки фотографій. Герої війни за Край лежать у коридорах під крапельницями, стеля в палатах укрита плямами плісняви, а на двісті ліжок працює три чергові лікарі. Міністерство просить «не бити по духу країни в день тиші» і обіцяє: «завтра вибори, потім розберемось». Медсестра відповідає: «Вони розберуться так само, як розбирались чотири роки. Публікуйте, поки країна дивиться».\",\"truth\":\"true\",\"revealText\":\"Фотографії справжні: шпиталь роками недофінансовували попри «пріоритет ветеранів» у кожній передвиборчій промові. Медсестра ризикнула роботою, щоб країна це побачила.\",\"req\":null,\"checks\":{\"factcheck\":{\"reveal\":\"full\",\"text\":\"Соломія: «Метадані фото чисті: цей шпиталь, ці дати, один телефон. Серійні номери ліжок збігаються з держзакупівлями саме цього закладу».\"},\"reporter\":{\"reveal\":\"full\",\"text\":\"Ірма з
